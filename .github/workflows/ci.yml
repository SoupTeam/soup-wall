# CI for the complete open-source Soup Wall workspace.
# Every workspace member, including the gateway, is built from the same lock.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      smoke_only:
        description: Run only the merged-source smoke command (not full qualification)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft-checks:
    name: Draft fast checks (not merge qualification)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check admission, scheduling and documentation contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_ci_*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_check_docs.py' -v
          python3 scripts/check_docs.py
      - name: Rule classifier unit regressions
        run: python3 -m unittest discover -s rule_baseline -p 'test_*.py' -v

  main-smoke:
    name: Main binary smoke (full qualification runs before merge)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.smoke_only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-default
          cache-bin: false
      - name: Build the actual merged Agent and Gateway
        run: cargo build --locked -p agentfw --bin agentfw -p llm-firewall --bin llm-firewall
      - name: Check Agent CLI and the versioned adapter contract
        run: |
          target/debug/agentfw --help
          cargo test --locked -p soup-wall-adapter --lib
      - name: Exercise the merged Gateway with an owned local upstream and SQLite
        run: python3 scripts/self-hosted-local-acceptance.py --gateway target/debug/llm-firewall --artifact-label "$GITHUB_SHA" --out target/main-smoke.json
      - name: Retain merged-source smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-smoke-${{ github.sha }}
          path: target/main-smoke.json
          if-no-files-found: error
          retention-days: 7

  impact:
    if: github.event_name != 'workflow_dispatch' || !inputs.smoke_only
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: ci.yml
  documentation:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'documentation')
    # A skipped draft job must not satisfy the required ready-PR context.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Deferred - Documentation links' || 'Documentation links' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify the documentation checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_docs.py' -v
      - name: Check versioned local links and heading anchors
        run: python3 scripts/check_docs.py

  test:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Deferred - test' || 'test' }}
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-default
          # PR caches remain scoped to refs/pull/<n>/merge; privileged admission never restores them.
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          cache-bin: false
      # Refuse formatting errors before compiling or running expensive probes.
      - run: cargo fmt --all -- --check
      - name: Install Linux sandbox runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Retain focused provenance-overflow regressions
        run: |
          set -o pipefail
          mkdir -p target/provenance-overflow
          {
            git rev-parse HEAD
            rustc --version
            cargo test --locked -p soup-wall-agent incomplete_marker -- --nocapture
            cargo test --locked -p soup-wall-agent zero_capacity_marks -- --nocapture
            cargo test --locked -p soup-wall-agent --test provenance_overflow -- --nocapture
          } 2>&1 | tee target/provenance-overflow/results.log
      - name: Upload focused provenance-overflow evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provenance-overflow
          path: target/provenance-overflow/results.log
          if-no-files-found: error
      - name: Frozen production policy composition matrix
        run: python3 scripts/verify_policy_composition.py
      - name: Retain exact-source policy composition report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-composition
          path: target/policy-composition/
          if-no-files-found: warn
      - name: Runtime protection diagnostics regressions
        env:
          AGENTFW_STATUS_EVIDENCE: ${{ github.workspace }}/target/runtime-protection-status/runtime.json
        run: |
          set -o pipefail
          mkdir -p target/runtime-protection-status
          git rev-parse HEAD > target/runtime-protection-status/source.txt
          git ls-files crates/agent crates/agentfw | xargs sha256sum > target/runtime-protection-status/source-sha256.txt
          cargo test --locked -p agentfw --test protection_status 2>&1 | tee target/runtime-protection-status/results.log
      - name: Retain runtime diagnostics evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-protection-status
          path: target/runtime-protection-status/
          if-no-files-found: warn
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Retain Task 3 attack scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task3-attack-scenarios
          path: |
            crates/adapter/attack_results.json
            attack_results.json
          if-no-files-found: error
      - name: Build Gateway for isolated binary acceptance
        run: cargo build --locked -p llm-firewall
      - name: Isolated Gateway and SQLite Console acceptance
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Run combined SOU-18 local probes
        run: python3 scripts/run-sou18-acceptance.py --run --include-generic --repo . --agentfw target/debug/agentfw --expected-commit "${{ github.sha }}" --output "${{ runner.temp }}/sou18-suite-${{ github.run_id }}-${{ github.run_attempt }}"
      # The suite runs setup and status exactly once in isolated profiles,
      # verifies their source/binary hashes, and fails on missing stages.
      - name: Retain setup and status evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-setup-linux
          path: ${{ runner.temp }}/sou18-suite-${{ github.run_id }}-${{ github.run_attempt }}/setup.json
          if-no-files-found: warn
      - name: Retain initial status and MCP evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou18-status-linux
          path: ${{ runner.temp }}/sou18-suite-${{ github.run_id }}-${{ github.run_attempt }}/status/results.json
          if-no-files-found: warn
      - name: Retain combined SOU-18 probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou18-suite-linux
          path: ${{ runner.temp }}/sou18-suite-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
      - name: Run isolated Gateway binary acceptance
        run: python3 scripts/self-hosted-local-acceptance.py --gateway target/debug/llm-firewall --artifact-label "$GITHUB_SHA" --out target/local-gateway-evidence.json
      - name: Retain isolated Gateway acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-gateway-acceptance
          path: target/local-gateway-evidence.json
          if-no-files-found: ignore
      - name: Stdio MCP admission demonstration
        run: |
          cargo build --locked -p agentfw
          python3 scripts/mcp-admission-demo.py --out target/mcp-admission-demo.json
      - name: Real rule-baseline MCP admission demonstration
        run: python3 scripts/mcp-admission-demo.py --classifier rule-baseline --out target/sou-22-real-baseline.json
      - name: Retain MCP admission demonstration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-admission-demo
          path: |
            target/mcp-admission-demo.json
            target/sou-22-real-baseline.json
          if-no-files-found: ignore

  python-classifier:
    name: Python classifier and evaluation
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'python-classifier')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Optional classifier adapter regressions (offline)
        run: python3 -m unittest experiments.classification.test_jev experiments.classification.test_shadow -v
      - name: Task 1 classification evaluation runner units
        run: python3 -m unittest discover -s eval -p 'test_*.py' -v
      - name: Task 1 rule baseline unit regressions
        run: python3 -m unittest discover -s rule_baseline -p 'test_*.py' -v
      - name: SOU-13 public data-free suite and source privacy gate
        # Private-artifact skips are pinned by count; the private full validation is owner-only.
        run: |
          python3 -m venv target/sou13-venv
          target/sou13-venv/bin/python -m pip install --disable-pip-version-check -r eval/sou13/requirements-cp2.txt
          target/sou13-venv/bin/python eval/sou13/run_tests.py --expect-skipped 150
          target/sou13-venv/bin/python eval/sou13/scripts_cp2/check_release_privacy.py --root eval/sou13
      - name: Optional learned classifier preparation regressions (offline)
        run: python3 -m unittest experiments.local_classifier.test_model experiments.local_classifier.test_ledger experiments.local_classifier.test_custodian experiments.local_classifier.test_gold_import -v
      - name: Task 1 frozen core regression evaluation
        run: python3 eval/eval_runner.py eval/fixtures/soup_task1_evaluation_cases_v0.4.json --classifier-path rule_baseline --out-dir target/task1-core-evaluation
      - name: Task 1 mixed-action and benign regression evaluation
        run: python3 eval/eval_runner.py eval/fixtures/soup_task1_mixed_actions_urtisto_v0.1.json eval/fixtures/soup_task1_benign_comparison_urtisto_v0.1.json --classifier-path rule_baseline --out-dir target/task1-mixed-evaluation
      - name: Retain Task 1 classifier regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task1-classifier-regression-evidence
          path: |
            target/task1-core-evaluation/
            target/task1-mixed-evaluation/
          if-no-files-found: warn

  # The Linux workspace job covers these targets; this adds the native macOS boundary.
  native-macos-resilience:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'native-macos-resilience')
    name: Native macOS admission resilience
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-default
          # PR caches remain scoped to refs/pull/<n>/merge; privileged admission never restores them.
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          cache-bin: false
      - name: Prepare canonical temporary storage and environment evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/task3-resilience/tmp
          # Keep strict probe output outside Cargo's cache and unique on retries.
          printf 'SOU17_GENERIC_OUTPUT=%s/sou17-generic-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$(cd target/task3-resilience/tmp && pwd -P)" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            uname -a
            rustc --version
            cargo --version
            python3 --version
          } > target/task3-resilience/environment.log
      - name: Retain exact-source SOU-17 regression outcomes
        run: python3 scripts/verify-sou17.py --expected-commit "$GITHUB_SHA" --out target/task3-resilience/verification
      - name: Verify generic classifier shapes at the execution boundary
        shell: bash
        run: |
          set -euo pipefail
          SOU17_BINARY_SHA="$(python3 -c 'import hashlib, pathlib; print(hashlib.sha256(pathlib.Path("target/debug/agentfw").read_bytes()).hexdigest())')"
          python3 scripts/verify-sou17-generic-boundary.py \
            --repo "$PWD" --agentfw target/debug/agentfw \
            --expected-commit "$GITHUB_SHA" \
            --expected-binary-sha256 "$SOU17_BINARY_SHA" \
            --output "$SOU17_GENERIC_OUTPUT"
      - name: Retain native macOS resilience evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task3-native-macos-resilience
          path: |
            target/task3-resilience/environment.log
            target/task3-resilience/verification/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current-run generic boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task3-native-macos-generic-boundary
          path: ${{ env.SOU17_GENERIC_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Run combined SOU-18 local probes
        run: python3 scripts/run-sou18-acceptance.py --run --include-generic --repo . --agentfw target/debug/agentfw --expected-commit "${{ github.sha }}" --output "${{ runner.temp }}/sou18-suite-${{ github.run_id }}-${{ github.run_attempt }}"
      # The suite runs setup and status exactly once in isolated profiles,
      # verifies their source/binary hashes, and fails on missing stages.
      - name: Retain setup and status evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-setup-macos
          path: ${{ runner.temp }}/sou18-suite-${{ github.run_id }}-${{ github.run_attempt }}/setup.json
          if-no-files-found: warn
      - name: Retain initial status and MCP evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou18-status-macos
          path: ${{ runner.temp }}/sou18-suite-${{ github.run_id }}-${{ github.run_attempt }}/status/results.json
          if-no-files-found: warn
      - name: Retain combined SOU-18 probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou18-suite-macos
          path: ${{ runner.temp }}/sou18-suite-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn

  agent-lifecycle-macos:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'agent-lifecycle-macos')
    name: Agent lifecycle on macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-default
          # PR caches remain scoped to refs/pull/<n>/merge; privileged admission never restores them.
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          cache-bin: false
      - name: Build and test managed Agent lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/sou29-macos
          {
            git rev-parse HEAD
            uname -a
            rustc --version
            cargo --version
          } | tee target/sou29-macos/environment.log
          cargo build --locked -p agentfw --bin agentfw
          shasum -a 256 target/debug/agentfw | tee target/sou29-macos/agentfw.sha256
          cargo test --locked -p agentfw --test lifecycle -- --test-threads=1 2>&1 | tee target/sou29-macos/lifecycle.log
          cargo test --locked -p agentfw --test self_test -- --test-threads=1 2>&1 | tee target/sou29-macos/self_test.log
      - name: Retain macOS lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou29-macos-lifecycle
          path: target/sou29-macos/
          if-no-files-found: warn

  # The optional ML stack is not compiled by the default-feature job.
  all-features:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Deferred - all-features' || 'all-features' }}
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'all-features')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-all-features
          # PR caches remain scoped to refs/pull/<n>/merge; privileged admission never restores them.
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          cache-bin: false
      - name: Install Linux sandbox runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  agent-windows-security:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Deferred - agent-windows-security' || 'agent-windows-security' }}
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'agent-windows-security')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-default
          # PR caches remain scoped to refs/pull/<n>/merge; privileged admission never restores them.
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          cache-bin: false
      - run: cargo clippy --locked -p agentfw --all-targets -- -D warnings
      # Each MCP case owns real processes and protected profile files. Avoid a
      # startup burst on Windows; explicit within-case concurrency remains tested.
      - run: cargo test --locked -p agentfw -- --test-threads=1
      - name: Verify lifecycle under a disposable standard Windows user
        shell: pwsh
        run: |
          $messages = & cargo test --locked -p agentfw --test lifecycle --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle test build failed' }
          $artifacts = @($messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'lifecycle' -and $_.executable
          })
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one lifecycle test executable' }
          ./scripts/ci-windows-lifecycle.ps1 -AgentBinary target/debug/agentfw.exe `
            -TestBinary $artifacts[0].executable -Commit $env:GITHUB_SHA `
            -OutputDirectory "$env:RUNNER_TEMP/windows-lifecycle-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Retain standard-user Windows lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-lifecycle-standard-user
          path: ${{ runner.temp }}/windows-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Native Windows MCP fixture storage and harness checks
        run: python -m unittest discover -s scripts/tests -p 'test_windows*.py' -v
      - run: cargo build --locked -p agentfw --bin agentfw
      - name: Disposable Agent setup and daemon status
        run: python scripts/clean-setup-acceptance.py --run --agentfw target/debug/agentfw.exe --output target/clean-setup-windows.json
      - name: Retain setup and status evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-setup-windows
          path: target/clean-setup-windows.json
          if-no-files-found: warn
      - name: Compare Agent status with independent MCP witnesses
        run: python scripts/verify-sou18-status.py --run --repo . --agentfw target/debug/agentfw.exe --expected-commit "${{ github.sha }}" --output "${{ runner.temp }}/sou18-status"
      - name: Retain initial status and MCP evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou18-status-windows
          path: ${{ runner.temp }}/sou18-status/results.json
          if-no-files-found: warn
      - name: Disposable Windows Agent acceptance
        run: ./scripts/windows-agent-acceptance.ps1 -EvidencePath target/windows-agent-acceptance.json
      - name: Disposable IPv6 loopback Agent acceptance
        run: ./scripts/windows-agent-acceptance.ps1 -BindAddress ::1 -EvidencePath target/windows-agent-acceptance-ipv6.json
      - uses: actions/upload-artifact@v7
        with:
          name: windows-agent-acceptance
          path: target/windows-agent-acceptance*.json
          if-no-files-found: error

  saml-release-targets:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'saml-release-targets')
    name: SAML ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rsa: absent
          - os: macos-15
            target: aarch64-apple-darwin
            rsa: absent
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rsa: absent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rsa: absent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-saml-${{ matrix.target }}
          # PR caches remain scoped to refs/pull/<n>/merge; privileged admission never restores them.
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          cache-bin: false
      - name: Verify target's resolved RSA dependency boundary
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          EXPECT_RSA: ${{ matrix.rsa }}
        run: |
          set -euo pipefail
          graph="$(cargo tree --locked -p llm-firewall --target "$RELEASE_TARGET" --edges normal --prefix none)"
          if grep -q '^rsa v' <<< "$graph"; then actual=present; else actual=absent; fi
          echo "rsa in $RELEASE_TARGET dependency graph: $actual"
          test "$actual" = "$EXPECT_RSA"
      - name: Verify signed SAML, tamper rejection, and disabled decryption
        run: cargo test --locked -p llm-firewall --lib --target ${{ matrix.target }} saml_auth::tests

  redis-integration:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'redis-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-default
          # PR caches remain scoped to refs/pull/<n>/merge; privileged admission never restores them.
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          cache-bin: false
      - run: cargo test --locked -p llm-firewall redis_limits::tests::redis_shares_rate_and_spend_windows -- --ignored
        env:
          LLM_FW_TEST_REDIS_URL: redis://127.0.0.1:6379/15

  postgres-integration:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'postgres-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: firewall
          POSTGRES_USER: firewall
          POSTGRES_PASSWORD: firewall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firewall -d firewall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-default
          # PR caches remain scoped to refs/pull/<n>/merge; privileged admission never restores them.
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          cache-bin: false
      # Run on the fresh service database before suites which leave queued events.
      - name: Verify webhook ownership, recovery and populated migrations
        run: cargo test --locked -p llm-firewall --lib tenant_store::webhook_recovery_tests::postgres_webhook_recovery_and_fenced_completion -- --ignored --exact --nocapture
        env:
          LLM_FW_TEST_POSTGRES_URL: postgresql://firewall:firewall@127.0.0.1:5432/firewall?sslmode=disable
      - name: Verify independent webhook receipts and interrupted sender recovery
        run: cargo test --locked -p llm-firewall --lib tenant_store::webhook_delivery_tests::webhook_receiver_recovery_demo -- --ignored --exact --nocapture
        env:
          SOUP_WALL_WEBHOOK_EVIDENCE: ${{ github.workspace }}/target/webhook-receiver-evidence.json
      - name: Retain sanitized webhook receiver evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webhook-receiver-recovery
          path: target/webhook-receiver-evidence.json
          if-no-files-found: ignore
      - run: cargo test --locked -p llm-firewall tenant_store::tests::postgres_control_plane_persists_tenants_tokens_policies_and_audit -- --ignored
        env:
          LLM_FW_TEST_POSTGRES_URL: postgresql://firewall:firewall@127.0.0.1:5432/firewall?sslmode=disable
      - name: Build populated restore helper and migration command
        run: cargo build --locked -p llm-firewall --bin llm-firewall --example postgres-restore-fixture
      - name: Install encrypted restore tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y age postgresql-client
          command -v pwsh
      - name: Verify populated encrypted restore on fresh disposable databases
        shell: bash
        env:
          LLM_FW_RESTORE_FIXTURE_ADMIN_URL: postgresql://firewall:firewall@127.0.0.1:5432/firewall?sslmode=disable
        run: |
          set -euo pipefail
          python3 scripts/postgres-populated-restore-acceptance.py --run \
            --helper "$PWD/target/debug/examples/postgres-restore-fixture" \
            --gateway "$PWD/target/debug/llm-firewall" \
            --psql "$(command -v psql)" \
            --pg-dump "$(command -v pg_dump)" \
            --pg-restore "$(command -v pg_restore)" \
            --age "$(command -v age)" \
            --age-keygen "$(command -v age-keygen)" \
            --pwsh "$(command -v pwsh)" \
            > target/populated-restore-evidence.json
      - name: Retain aggregate populated restore evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-populated-postgres-restore
          path: target/populated-restore-evidence.json
          if-no-files-found: ignore

  docker-build:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'docker-build')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: soup-wall:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke gateway health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker run -d soup-wall:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if docker exec "$container" curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1
