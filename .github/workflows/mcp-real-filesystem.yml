              '--baseline-commit', os.environ['ASK_BASELINE_SHA'],
              '--candidate-root', str(Path.cwd()),
              '--candidate-commit', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              '--output', str(temp / 'sou124-ask-comparison'),
              '--offline-inputs', str(temp / 'sou124-offline-inputs')]
          for side, record in [('baseline', baseline), ('candidate', first)]:
              for role in ['agentfw', 'git_launcher', 'receipt']:
                  command += ['--' + side + '-' + role.replace('_', '-'), record[role]]
          for role, path in {'node': temp / 'sou111-assets/node/bin/node',
                  'npm': temp / 'sou111-assets/node/bin/npm',
                  'claude': temp / 'sou111-assets/claude/node_modules/@anthropic-ai/claude-code-linux-x64/claude',
                  'bwrap': os.environ['SOU111_BWRAP'], 'git': os.environ['SOU115_GIT'],
                  'strace': subprocess.check_output(['which', 'strace'], text=True).strip()}.items():
              command += ['--' + role, str(path)]
