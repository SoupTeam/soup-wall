            python3 -B scripts/switch-prepared-pilot.py --output "$output" --target "$target" \
              --previous-source "$source" --target-source "$source" --apply --confirm "$plan" \
              > "$asset/switch-$label-applied.json"
          }
          switch "$first" return-a
          switch "$second" select-b
          python3 -B scripts/qualify-prepared-pilot-run.py --selection "$output/generations/$second/selection.json" \
            --expected-commit "$commit" --strace "$(command -v strace)" \
            --output "$RUNNER_TEMP/sou133-b-qualification" --transition-target "$first"
          switch "$first" rollback-a
          python3 -B scripts/qualify-prepared-pilot-run.py --selection "$output/generations/$first/selection.json" \
            --expected-commit "$commit" --strace "$(command -v strace)" \
            --output "$RUNNER_TEMP/sou133-a-qualification"
          python3 -B - "$output" "$source" "$first" "$second" "$asset/switch-fault-controls.json" <<'PY'
          import importlib.util, json, os, subprocess, sys
          from pathlib import Path
          output, source, first, second, report = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], sys.argv[4], Path(sys.argv[5])
          spec = importlib.util.spec_from_file_location('transition', source/'scripts/switch-prepared-pilot.py')
          switch = importlib.util.module_from_spec(spec); spec.loader.exec_module(switch)
          original_publish = switch.publish_json
          selected = (output/'current.json').read_bytes()
          unrelated = output.parent/'sou133-unrelated.txt'
          unrelated.write_text('preserve this unrelated state\n')
          target_selection = output/'generations'/second/'selection.json'
          target_bytes = target_selection.read_bytes()
          tampered = json.loads(target_bytes)
          tampered['files']['agentfw']['sha256'] = '0'*64
          try:
              target_selection.write_text(json.dumps(tampered))
              result = subprocess.run([sys.executable, '-B', str(source/'scripts/switch-prepared-pilot.py'),
                  '--output',str(output),'--target',second,'--previous-source',str(source),
                  '--target-source',str(source)],capture_output=True,timeout=120)
              assert result.returncode == 2
              assert (output/'current.json').read_bytes() == selected
          finally:
              target_selection.write_bytes(target_bytes)
          def interrupted(directory, name, value):
              if name == 'current.json':
                  raise OSError('owned interruption control')
              return original_publish(directory, name, value)
          plan = switch.plan(output, second, source, source)[3]
          switch.publish_json = interrupted
          try:
              try:
                  switch.apply(output, second, source, source, plan['plan_sha256'])
              except OSError:
                  pass
              else:
                  raise AssertionError('publication interruption was not exercised')
          finally:
              switch.publish_json = original_publish
          assert (output/'current.json').read_bytes() == selected
          assert switch.recover(output)['status'] == 'interrupted_before_publication'
          modified = False
          def concurrent(directory, name, value):
              global modified
              result = original_publish(directory, name, value)
              if name == switch.JOURNAL and value.get('pending') is not None and not modified:
                  modified = True
                  original_publish(directory, 'current.json', switch.marker(output)[2])
              return result
          switch.publish_json = concurrent
          try:
              try:
                  switch.apply(output, second, source, source, plan['plan_sha256'])
              except ValueError as error:
                  assert str(error) == 'concurrent_marker_edit'
              else:
                  raise AssertionError('concurrent pointer edit was not refused')
          finally:
              switch.publish_json = original_publish
          assert switch.recover(output)['status'] == 'interrupted_before_publication'
          assert switch.marker(output)[2]['generation'] == first
          assert unrelated.read_text() == 'preserve this unrelated state\n'
          report.write_text(json.dumps({'status':'passed','tampered_target_refused':True,
              'interrupted_before_publication_recovered':True,'concurrent_edit_refused':True,
              'unrelated_preserved':True},sort_keys=True)+'\n')
          PY
          python3 -B scripts/switch-prepared-pilot.py --output "$output" --status > "$asset/switch-status.json"
          python3 - "$asset" "$first" "$second" <<'PY'
          import json, sys
          from pathlib import Path
          asset, first, second = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          assert json.loads((asset/'switch-status.json').read_text())['actual_generation'] == first
          for label, expected in [('return-a', first), ('select-b', second), ('rollback-a', first)]:
              assert json.loads((asset/f'switch-{label}-applied.json').read_text())['target'] == expected
          assert json.loads((asset/'switch-return-a-plan.json').read_text())['previous']['generation'] == second
          print(json.dumps({'status':'passed','sequence':[first,second,first],
                            'source_commit':json.loads((asset/'switch-rollback-a-plan.json').read_text())['target']['source']['commit'],
                            'scripted_provider':True,'active_protection_claim':False}))
          PY
