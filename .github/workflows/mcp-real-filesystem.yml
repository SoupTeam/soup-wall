name: Real filesystem MCP profile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-real-filesystem-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: mcp-real-filesystem.yml
  required-linux-sandbox-and-real-host:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'required-linux-sandbox-and-real-host')
    # This selected runtime is Linux x86-64. No host sysctl/AppArmor relaxation.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the pinned Linux runtime and bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config ripgrep zlib1g-dev strace
          mkdir -p "$RUNNER_TEMP/sou62-runtime" "$RUNNER_TEMP/sou62-bwrap-source"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz --output "$RUNNER_TEMP/sou62-node.tar.xz"
          printf '%s  %s\n' 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37 "$RUNNER_TEMP/sou62-node.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/sou62-node.tar.xz" --directory "$RUNNER_TEMP/sou62-runtime" --strip-components=1 --no-same-owner --no-same-permissions
          curl --fail --location --retry 3 https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz --output "$RUNNER_TEMP/sou62-bwrap.tar.xz"
          printf '%s  %s\n' 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d "$RUNNER_TEMP/sou62-bwrap.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/sou62-bwrap.tar.xz" --directory "$RUNNER_TEMP/sou62-bwrap-source" --strip-components=1 --no-same-owner --no-same-permissions
          meson setup "$RUNNER_TEMP/sou62-bwrap-build" "$RUNNER_TEMP/sou62-bwrap-source" -Dtests=false -Dman=disabled -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/sou62-bwrap-build"
          # Reuse the accepted Git profile's exact runtime, without a kit builder.
          mkdir "$RUNNER_TEMP/sou100-git-source"
          curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.51.2.tar.xz --output "$RUNNER_TEMP/sou100-git.tar.xz"
          printf '%s  %s\n' 233d7143a2d58e60755eee9b76f559ec73ea2b3c297f5b503162ace95966b4e3 "$RUNNER_TEMP/sou100-git.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou100-git.tar.xz" -C "$RUNNER_TEMP/sou100-git-source" --strip-components=1 --no-same-owner --no-same-permissions
          make -C "$RUNNER_TEMP/sou100-git-source" -j2 NO_CURL=YesPlease NO_EXPAT=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_OPENSSL=YesPlease git
          "$RUNNER_TEMP/sou62-bwrap-build/bwrap" --help | rg -- '--ro-bind-fd'
          printf '%s\n' "$RUNNER_TEMP/sou62-runtime/bin" >> "$GITHUB_PATH"
          rustc --version > "$RUNNER_TEMP/sou62-rust.txt"
          python3 --version > "$RUNNER_TEMP/sou62-python.txt"
          "$RUNNER_TEMP/sou62-runtime/bin/node" --version > "$RUNNER_TEMP/sou62-node.txt"
          "$RUNNER_TEMP/sou62-bwrap-build/bwrap" --version > "$RUNNER_TEMP/sou62-bwrap.txt"
          sha256sum "$RUNNER_TEMP/sou62-node.tar.xz" "$RUNNER_TEMP/sou62-runtime/bin/node" "$RUNNER_TEMP/sou62-bwrap.tar.xz" "$RUNNER_TEMP/sou62-bwrap-build/bwrap" > "$RUNNER_TEMP/sou62-runtime-hashes.txt"
      - name: Install the pinned actual Claude Code host without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/sou62-claude-host"
          cp profiles/mcp/filesystem-readonly-v1/claude-host/package*.json "$RUNNER_TEMP/sou62-claude-host/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/sou62-claude-host"
          "$RUNNER_TEMP/sou62-claude-host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" --version > "$RUNNER_TEMP/sou62-claude.txt"
          sha256sum "$RUNNER_TEMP/sou62-claude-host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" > "$RUNNER_TEMP/sou62-claude-hash.txt"
      - name: Build the exact Agent and positive sandbox test binary
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou62-source.txt"
          cargo build --locked -p agentfw --bins --message-format=json > "$RUNNER_TEMP/sou62-build.jsonl"
          cargo test --locked -p agentfw --lib --no-run --message-format=json > "$RUNNER_TEMP/sou62-test-build.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          records = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'sou62-test-build.jsonl').read_text().splitlines()]
          binaries = [r['executable'] for r in records if r.get('reason') == 'compiler-artifact' and r.get('target', {}).get('name') == 'agentfw' and r.get('profile', {}).get('test') and r.get('executable')]
          assert len(binaries) == 1, 'one exact Agent library test binary is required'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SOU62_SANDBOX_TEST_BINARY=' + binaries[0] + '\n')
          PY
          sha256sum target/debug/agentfw > "$RUNNER_TEMP/sou62-binary-hashes.txt"
      - name: Required literal read/search semantics through original filesystem MCP
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p test_sou110_literal_arguments.py -v
          python3 -B scripts/verify-sou110-literal-arguments.py --run \
            --agentfw "$PWD/target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou62-runtime/bin/node" --npm "$RUNNER_TEMP/sou62-runtime/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou62-bwrap-build/bwrap" --strace /usr/bin/strace \
            --expected-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/sou110-literals" \
            2>&1 | tee "$RUNNER_TEMP/sou110-literals.log"
      - name: SOU-99 full launcher with installed original profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_launcher_witness.py -v
          python3 -B scripts/qualify-pilot-launcher.py \
            --agentfw "$PWD/target/debug/agentfw" --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --node "$RUNNER_TEMP/sou62-runtime/bin/node" --npm "$RUNNER_TEMP/sou62-runtime/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou62-bwrap-build/bwrap" --git "$RUNNER_TEMP/sou100-git-source/git" \
            --claude "$RUNNER_TEMP/sou62-claude-host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --strace /usr/bin/strace --output "$RUNNER_TEMP/sou99-original-launcher"
      - name: SOU-112 run-scoped operator Ask through actual pilot launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/qualify-pilot-ask.py \
            --agentfw "$PWD/target/debug/agentfw" --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --node "$RUNNER_TEMP/sou62-runtime/bin/node" --npm "$RUNNER_TEMP/sou62-runtime/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou62-bwrap-build/bwrap" --git "$RUNNER_TEMP/sou100-git-source/git" \
            --claude "$RUNNER_TEMP/sou62-claude-host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --strace /usr/bin/strace --output "$RUNNER_TEMP/sou112-pilot-ask"
      - name: Profile and evidence controls, safe archive runtime compatibility
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_sou62_real_mcp.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_installed_pilot.py -v
          cargo test --locked -p agentfw --lib selected_registry_shared_daemon | tee "$RUNNER_TEMP/sou100-registry-regressions.log"
          python3 -B - <<'REGISTRY_CONTROLS'
          import os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'sou100-registry-regressions.log').read_text()
          assert re.search(r'test result: ok\. 3 passed; 0 failed; 0 ignored;', text), 'three executed registry regressions are required'
          REGISTRY_CONTROLS
          python3 -B -m unittest discover -s scripts/tests -p test_linux_alert_acceptance.py -v
          python3 -B - <<'PYCONTROLS'
          import unittest
          suite = unittest.defaultTestLoader.discover('scripts/tests', pattern='test_sou62_sou63_combined.py')
          if suite.countTestCases() == 0:
              raise SystemExit('combined smoke controls are required; zero tests discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PYCONTROLS
      - name: Required real server, positive sandbox, overlap, cancellation and actual Claude Code
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-sou62-real-mcp.py --run --agentfw "$PWD/target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou62-runtime/bin/node" --npm "$RUNNER_TEMP/sou62-runtime/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou62-bwrap-build/bwrap" \
            --claude "$RUNNER_TEMP/sou62-claude-host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --sandbox-test-binary "$SOU62_SANDBOX_TEST_BINARY" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou62-acceptance" 2>&1 | tee "$RUNNER_TEMP/sou62-acceptance.log"
      - name: SOU-98 same-preset original-server acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-sou62-real-mcp.py --run --pilot-preset --agentfw "$PWD/target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou62-runtime/bin/node" --npm "$RUNNER_TEMP/sou62-runtime/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou62-bwrap-build/bwrap" \
            --claude "$RUNNER_TEMP/sou62-claude-host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --sandbox-test-binary "$SOU62_SANDBOX_TEST_BINARY" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou98-filesystem" 2>&1 | tee "$RUNNER_TEMP/sou98-filesystem.log"
      - name: Required combined original-server, shared-session, hooks and actual Claude Code smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-sou62-sou63-combined.py --run --agentfw "$PWD/target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou62-runtime/bin/node" --npm "$RUNNER_TEMP/sou62-runtime/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou62-bwrap-build/bwrap" \
            --claude "$RUNNER_TEMP/sou62-claude-host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --sandbox-test-binary "$SOU62_SANDBOX_TEST_BINARY" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou62-sou63-combined" 2>&1 | tee "$RUNNER_TEMP/sou62-sou63-combined.log"
      - name: Required installed filesystem and Git pilot through actual Claude Code
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PILOT_SELECTION'
          import importlib.util, os, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('pilot_selection', 'scripts/qualify-installed-pilot.py')
          pilot = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pilot)
          temporary = Path(os.environ['RUNNER_TEMP'])
          selected_policy = temporary / 'sou100-selected-policy.yaml'
          pilot.owned_bytes(selected_policy, pilot.PILOT_POLICY.encode('utf-8'))
          files = {
              'agentfw': Path('target/debug/agentfw'),
              'git_launcher': Path('target/debug/agentfw-git-sandbox'),
              'sandbox_tests': Path(os.environ['SOU62_SANDBOX_TEST_BINARY']),
              'node': temporary / 'sou62-runtime/bin/node',
              'npm': temporary / 'sou62-runtime/bin/npm',
              'bwrap': temporary / 'sou62-bwrap-build/bwrap',
              'git': temporary / 'sou100-git-source/git',
              'claude': temporary / 'sou62-claude-host/node_modules/@anthropic-ai/claude-code-linux-x64/claude',
              'python': Path(sys.executable),
              'filesystem_classifier': Path('rule_baseline/rule_baseline.py'),
              'git_classifier': Path('rule_baseline/git_readonly_v1/rule_baseline.py'),
              'policy': selected_policy,
          }
          pilot.private_json(temporary / 'sou100-selection.json', {
              'format': 'sw-installed-pilot-selection/2', 'source': pilot.source(),
              'expected_refusal': {'verdict': 'ask', 'rule': pilot.SHARED.RULE},
              'files': {role: {'path': str(path.resolve(strict=True)), 'sha256': pilot.sha(path)} for role, path in files.items()},
          })
          PILOT_SELECTION
          python3 -B scripts/qualify-installed-pilot.py --run \
            --selection "$RUNNER_TEMP/sou100-selection.json" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou100-pilot" 2>&1 | tee "$RUNNER_TEMP/sou100-pilot.log"
      - name: Required exact single-use Ask through original filesystem and Git servers
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p test_sou105_selected_approval.py -v
          python3 -B scripts/verify-sou105-selected-approval.py --run \
            --agentfw "$PWD/target/debug/agentfw" --node "$RUNNER_TEMP/sou62-runtime/bin/node" \
            --npm "$RUNNER_TEMP/sou62-runtime/bin/npm" --git "$RUNNER_TEMP/sou100-git-source/git" \
            --bwrap "$RUNNER_TEMP/sou62-bwrap-build/bwrap" --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --strace "$(command -v strace)" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou105-approval" 2>&1 | tee "$RUNNER_TEMP/sou105-approval.log"
      - name: Publish bounded installed-pilot outcome
        if: always()
        shell: bash
        run: |
          python3 -B - <<'PILOT_OUTCOME'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'sou100-pilot/report.json'
          result = json.loads(path.read_text()) if path.exists() else {'status': 'incomplete', 'reason': 'installed_pilot_not_executed'}
          selected = {key: result.get(key) for key in ('format', 'status', 'source_before', 'source_after', 'required', 'counts', 'benign_workflows', 'remaining_blockers')}
          print(json.dumps(selected, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(selected, indent=2) + '\n```\n')
          PILOT_OUTCOME
      - name: Required persistent onboarding of the installed filesystem profile
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/onboarding-profile-acceptance.py --profiles filesystem \
            --agentfw "$PWD/target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou62-runtime/bin/node" --npm "$RUNNER_TEMP/sou62-runtime/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou62-bwrap-build/bwrap" \
            --out "$RUNNER_TEMP/profile-onboarding-filesystem" --work-parent "$RUNNER_TEMP" \
            2>&1 | tee "$RUNNER_TEMP/sou62-profile-onboarding.log"
      - name: Publish bounded outcome
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'sou62-acceptance/report.json'
          data = json.loads(path.read_text()) if path.exists() else {'status': 'incomplete', 'error': 'required acceptance did not produce a report'}
          selected = {k: data.get(k) for k in ['status', 'passed', 'failed', 'skipped', 'error', 'source_before', 'binary_sha256', 'sandbox_test_binary_sha256', 'required_positive_sandbox', 'peak_active', 'peak_queued', 'workspace_unchanged', 'installed_profile_unchanged', 'daemon_stopped', 'private_profile_removed']}
          host = data.get('actual_claude_host', {})
          selected['actual_claude_host'] = {k: host.get(k) for k in ['status', 'claude_version', 'claude_sha256', 'real_host_executed', 'scripted_owned_provider', 'live_model_efficacy_measured']}
          print(json.dumps(selected, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(selected, indent=2) + '\n```\n')
          PY
      - name: Publish bounded combined smoke outcome
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCOMBINED'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'sou62-sou63-combined/report.json'
          data = json.loads(path.read_text()) if path.exists() else {'status': 'incomplete', 'error': 'required combined smoke did not produce a report'}
          selected = {k: data.get(k) for k in ['status', 'passed', 'failed', 'skipped', 'source_before', 'source_after', 'binary_sha256', 'claude_sha256', 'sandbox_test_binary_sha256', 'proof_policy_sha256', 'required_positive_sandbox']}
          selected['error'] = str(data['error'])[:2000] if data.get('error') else None
          selected['bindings'] = [{k: row[k] for k in ['host_session', 'server_id', 'agent_id', 'parent_id', 'tools', 'proof_sha256', 'binding_sha256'] if k in row} for row in (data.get('bindings') or [])[:8]]
          for name in ['clean_control', 'shared_mcp', 'shared_hook']:
              section = data.get(name) or {}
              selected[name] = {k: section[k] for k in ['status', 'rule', 'rule_name', 'no_reader', 'no_backend_execution', 'shared_host_session', 'passed'] if k in section}
          host = data.get('actual_claude_host') or {}
          selected['actual_claude_host'] = {k: host.get(k) for k in ['status', 'claude_version', 'claude_sha256', 'exit_code', 'real_host_executed', 'scripted_owned_provider', 'live_model_efficacy_measured']}
          def process_summary(value):
              value = value if isinstance(value, dict) else {}
              return {k: value.get(k) for k in ['all_stopped', 'descendant_count']} | {'remaining_count': len(value.get('remaining') or [])}
          selected['actual_claude_host']['process_cleanup'] = process_summary(host.get('process_cleanup', {}))
          cleanup = data.get('cleanup') or {}
          selected['cleanup'] = {k: cleanup.get(k) for k in ['daemon_stopped', 'private_profile_removed', 'all_stopped']}
          selected['cleanup']['daemon_process_cleanup'] = process_summary(cleanup.get('daemon_process_cleanup', {}))
          selected['cleanup']['client_count'] = len(cleanup.get('clients') or [])
          selected['cleanup']['clients'] = [{k: row.get(k) for k in ['exit_code', 'forced_cleanup']} | {'process_cleanup': process_summary(row.get('process_cleanup', {}))} for row in (cleanup.get('clients') or [])[:8]]
          rendered = json.dumps(selected, indent=2)
          print(rendered)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + rendered + '\n```\n')
          PYCOMBINED
      - name: Retain exact source, runtime and owned acceptance witnesses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou62-real-filesystem-mcp-evidence
          path: |
            ${{ runner.temp }}/sou110-literals.log
            ${{ runner.temp }}/sou110-literals/report.json
            ${{ runner.temp }}/sou110-literals/*.log
            ${{ runner.temp }}/sou110-literals/*.witness.json
            ${{ runner.temp }}/sou105-approval.log
            ${{ runner.temp }}/sou105-approval/report.json
            ${{ runner.temp }}/sou105-approval/**/*.log
            ${{ runner.temp }}/sou105-approval/**/*.witness.json
            ${{ runner.temp }}/sou98-filesystem/**
            ${{ runner.temp }}/sou98-filesystem.log
            ${{ runner.temp }}/sou100-selection.json
            ${{ runner.temp }}/sou100-selected-policy.yaml
            ${{ runner.temp }}/sou100-registry-regressions.log
            ${{ runner.temp }}/sou100-pilot.log
            ${{ runner.temp }}/sou100-pilot/**
            ${{ runner.temp }}/sou99-original-launcher/**
            ${{ runner.temp }}/sou112-pilot-ask/**
            ${{ runner.temp }}/sou62-*.txt
            ${{ runner.temp }}/sou62-*.jsonl
            ${{ runner.temp }}/sou62-*.log
            ${{ runner.temp }}/sou62-acceptance/*.json
            ${{ runner.temp }}/sou62-acceptance/*.log
            ${{ runner.temp }}/sou62-sou63-combined/*.json
            ${{ runner.temp }}/sou62-sou63-combined/*.log
            ${{ runner.temp }}/profile-onboarding-filesystem/*.json
          if-no-files-found: error
          retention-days: 30
