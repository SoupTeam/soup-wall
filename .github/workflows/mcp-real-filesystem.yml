          fi
      - name: Validate optional native Ask series plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.ask_series != ''
        shell: bash
        env:
          ASK_SERIES: ${{ github.event.inputs.ask_series }}
          ASK_BASELINE_SHA: ${{ github.event.inputs.ask_latency_baseline_sha }}
          NATIVE_ONLY: ${{ github.event.inputs.native_preparation_only }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_ONLY" == true && -z "$ASK_BASELINE_SHA" ]]
          [[ "$ASK_SERIES" =~ ^cold(,(cold|warm)){0,5}$ ]]
      - name: Attest compiler and interpreter inputs for the native lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/sou122-toolchain"
          status=0
          python3 -B scripts/verify-pilot-toolchain.py --lane native \
            --python "$(command -v python3)" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou122-toolchain/native-attestation.json" || status=$?
          cat "$RUNNER_TEMP/sou122-toolchain/native-attestation.json"
          exit "$status"
      - name: Focused preparation boundaries
        env:
          PILOT_CLEANUP_PRIVILEGED_FIXTURE: '1'
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_prepare_installed_pilot.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_existing_pilot_workspaces.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_measurement.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_installed_pilot.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_run.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_validation.py -v
