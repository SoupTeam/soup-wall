name: SOU-144 focused native qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspector:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 561fd091306941e8107948c35df530d94995e578
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Prepare dependencies without executing target builds
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap strace
          cargo fetch --locked
          task_scratch="$RUNNER_TEMP/sou144"
          mkdir -p "$task_scratch"/{home,tmp,cargo-home}
          ln -s "$HOME/.cargo/registry" "$task_scratch/cargo-home/registry"
          echo "SOU144_SCRATCH=$task_scratch" >> "$GITHUB_ENV"
      - name: Compile and exercise exact source in a read-only offline namespace
        run: |
          set -euo pipefail
          git show ${{ github.sha }}:scripts/sou144-native-body.sh > "$SOU144_SCRATCH/run.sh"
          sudo -- /usr/bin/bwrap --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --bind "$SOU144_SCRATCH" "$SOU144_SCRATCH" --proc /proc --dev /dev \
            --cap-drop ALL --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP --cap-add CAP_SYS_ADMIN \
            --chdir / /bin/bash -euc 'mount -t proc -o nosuid,nodev,noexec proc /proc; mount -t tmpfs -o nosuid,nodev,mode=1777 tmpfs /dev/shm; exec "$@"' bash \
            /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            /usr/bin/env -i PATH="$HOME/.cargo/bin:/usr/bin:/bin" RUSTUP_HOME="$HOME/.rustup" RUSTUP_TOOLCHAIN=1.99.1 \
            HOME="$SOU144_SCRATCH/home" CARGO_HOME="$SOU144_SCRATCH/cargo-home" \
            CARGO_TARGET_DIR="$SOU144_SCRATCH/target" TMPDIR="$SOU144_SCRATCH/tmp" \
            SOU144_SCRATCH="$SOU144_SCRATCH" CARGO_BUILD_JOBS=4 CARGO_NET_OFFLINE=true \
            /bin/bash "$SOU144_SCRATCH/run.sh"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sou144-focused-native
          path: |
            ${{ env.SOU144_SCRATCH }}/*.log
            ${{ env.SOU144_SCRATCH }}/witness/report.json
          if-no-files-found: warn
          retention-days: 30
