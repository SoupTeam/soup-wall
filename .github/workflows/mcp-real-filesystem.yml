name: SOU-176 fixed-source scoped runtime execution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 119e6962d83fd1298f2092f6d20b2950167fe371
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Acquire only pinned public sources and dependency caches
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config strace bubblewrap
          cargo fetch --locked
          task_scratch="$RUNNER_TEMP/sou176"
          mkdir -m 700 "$task_scratch"
          mkdir -m 700 "$task_scratch"/{home,cargo-home,tmp,host,node,packages,bwrap-source,git-source,offline}
          mkdir -m 700 "$task_scratch/offline"/{npm-cache,wheelhouse,python-root}
          ln -s "$HOME/.cargo/registry" "$task_scratch/cargo-home/registry"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz -o "$task_scratch/node.tar.xz"
          printf '%s  %s\n' 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37 "$task_scratch/node.tar.xz" | sha256sum --check
          tar -xJf "$task_scratch/node.tar.xz" -C "$task_scratch/node" --strip-components=1 --no-same-owner --no-same-permissions
          curl --fail --location --retry 3 https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz -o "$task_scratch/bwrap.tar.xz"
          printf '%s  %s\n' 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d "$task_scratch/bwrap.tar.xz" | sha256sum --check
          tar -xJf "$task_scratch/bwrap.tar.xz" -C "$task_scratch/bwrap-source" --strip-components=1 --no-same-owner --no-same-permissions
          curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.51.2.tar.xz -o "$task_scratch/git.tar.xz"
          printf '%s  %s\n' 233d7143a2d58e60755eee9b76f559ec73ea2b3c297f5b503162ace95966b4e3 "$task_scratch/git.tar.xz" | sha256sum --check
          tar -xJf "$task_scratch/git.tar.xz" -C "$task_scratch/git-source" --strip-components=1 --no-same-owner --no-same-permissions
          curl --fail --location --retry 3 'https://github.com/astral-sh/python-build-standalone/releases/download/20251014/cpython-3.11.14%2B20251014-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz' -o "$task_scratch/offline/python.tar.gz"
          printf '%s  %s\n' 91ab434738647ab45d630aaa02e3808bb516239beeb52f7799c12a12d1557a38 "$task_scratch/offline/python.tar.gz" | sha256sum --check
          tar -xzf "$task_scratch/offline/python.tar.gz" -C "$task_scratch/offline/python-root" --strip-components=1 --no-same-owner --no-same-permissions
          "$task_scratch/offline/python-root/bin/python3.11" -m pip download --disable-pip-version-check --only-binary=:all: --require-hashes -r profiles/mcp/git-readonly-v1/requirements.lock --dest "$task_scratch/offline/wheelhouse"
          cp profiles/mcp/filesystem-readonly-v1/claude-host/package*.json "$task_scratch/host/"
          cp profiles/mcp/filesystem-readonly-v1/package*.json "$task_scratch/packages/"
          PATH="$task_scratch/node/bin:$PATH" npm ci --ignore-scripts --no-audit --no-fund --prefix "$task_scratch/host"
          PATH="$task_scratch/node/bin:$PATH" npm ci --ignore-scripts --no-audit --no-fund --prefix "$task_scratch/packages" --cache "$task_scratch/offline/npm-cache"
          printf '%s  %s\n' fd5f10ff0eb58daec04900466b143ea98aab50abf208a422bc008eaec13f61f7 "$task_scratch/host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" | sha256sum --check
          git show ${{ github.sha }}:scripts/sou176-build-body.sh > "$task_scratch/build.sh"
          git show ${{ github.sha }}:scripts/sou176-runtime-body.sh > "$task_scratch/runtime.sh"
          echo "SOU145_SCRATCH=$task_scratch" >> "$GITHUB_ENV"
      - name: Compile fixed source with scratch-only writes and no external network
        run: |
          set -euo pipefail
          sudo -- /usr/bin/bwrap --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --bind "$SOU145_SCRATCH" "$SOU145_SCRATCH" --proc /proc --dev /dev --cap-drop ALL \
            --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP --cap-add CAP_SYS_ADMIN \
            --chdir / /bin/bash -euc 'mount -t proc -o nosuid,nodev,noexec proc /proc; mount -t tmpfs -o nosuid,nodev,mode=1777 tmpfs /dev/shm; exec "$@"' bash \
            /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            /usr/bin/env -i PATH="$HOME/.cargo/bin:/usr/bin:/bin" RUSTUP_HOME="$HOME/.rustup" RUSTUP_TOOLCHAIN=1.99.1 \
            HOME="$SOU145_SCRATCH/home" CARGO_HOME="$SOU145_SCRATCH/cargo-home" CARGO_NET_OFFLINE=true \
            CARGO_TARGET_DIR="$SOU145_SCRATCH/target" TMPDIR="$SOU145_SCRATCH/tmp" CARGO_BUILD_JOBS=4 \
            CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 \
            SOU145_SOURCE="$GITHUB_WORKSPACE" SOU145_SCRATCH="$SOU145_SCRATCH" /bin/bash "$SOU145_SCRATCH/build.sh"
      - name: Provision only accepted job-scoped sandbox permission
        env:
          SOUP_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 -B scripts/ci_bwrap_userns.py install --source "$SOU145_SCRATCH/bwrap-build/bwrap" \
            --sha256 "$(sha256sum "$SOU145_SCRATCH/bwrap-build/bwrap" | cut -d ' ' -f1)" \
            --report "$SOU145_SCRATCH/apparmor-provisioning.json"
      - name: Execute all inventories on one unchanged source and selection
        run: |
          set -euo pipefail
          sudo -- /usr/bin/bwrap --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --bind "$SOU145_SCRATCH" "$SOU145_SCRATCH" --proc /proc --dev /dev --cap-drop ALL \
            --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP --cap-add CAP_SYS_ADMIN --cap-add CAP_NET_ADMIN \
            --chdir / /bin/bash -euc 'mount -t proc -o nosuid,nodev,noexec proc /proc; mount -t tmpfs -o nosuid,nodev,mode=1777 tmpfs /dev/shm; ip link set lo up; exec "$@"' bash \
            /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            /usr/bin/env -i PATH="$SOU145_SCRATCH/node/bin:/usr/bin:/bin" LANG=C.UTF-8 \
            HOME="$SOU145_SCRATCH/home" TMPDIR="$SOU145_SCRATCH/tmp" \
            SOU145_HOST_PID_NS="$(readlink /proc/self/ns/pid)" SOU145_SELECTED_BWRAP="$SOU111_BWRAP" \
            SOU145_SOURCE="$GITHUB_WORKSPACE" SOU145_SCRATCH="$SOU145_SCRATCH" /bin/bash "$SOU145_SCRATCH/runtime.sh"
      - name: Remove job-scoped sandbox permission
        if: always()
        env:
          SOUP_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -B scripts/ci_bwrap_userns.py cleanup --report "$RUNNER_TEMP/sou176-apparmor-cleanup.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sou176-fixed-source-execution
          path: |
            ${{ runner.temp }}/sou176/build-record.json
            ${{ runner.temp }}/sou176/seed.json
            ${{ runner.temp }}/sou176/results/execution.json
            ${{ runner.temp }}/sou176/results/frozen-plan.json
            ${{ runner.temp }}/sou176/results/runtime-plan.json
            ${{ runner.temp }}/sou176/results/*-identities.json
            ${{ runner.temp }}/sou176/native-identity-controls.log
            ${{ runner.temp }}/sou176/results/*/report.json
            ${{ runner.temp }}/sou176/results/installed/negative-*/report.json
            ${{ runner.temp }}/sou176/results/*/qualification.json
            ${{ runner.temp }}/sou176/apparmor-provisioning.json
            ${{ runner.temp }}/sou176-apparmor-cleanup.json
          if-no-files-found: warn
          retention-days: 30
