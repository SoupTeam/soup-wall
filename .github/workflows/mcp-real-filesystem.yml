          output="$RUNNER_TEMP/sou111-preparation"
          source="$PWD"
          commit="$(git rev-parse HEAD)"
          first="$(python3 -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"sou111-assets/first.json").read_text())["generation"])')"
          args=(--output "$output" --expected-commit "$commit"
            --agentfw "$SOU119_AGENTFW" --git-launcher "$SOU119_GIT_LAUNCHER"
            --sandbox-tests "$SOU119_SANDBOX_TESTS" --node-archive "$asset/node.tar.xz"
