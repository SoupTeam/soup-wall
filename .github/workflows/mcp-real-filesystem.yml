          spec = importlib.util.spec_from_file_location('prepared_inputs', 'scripts/prepare-installed-pilot.py')
          prepared = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(prepared)
          package = generation / 'git-profile/package'
          expected = json.loads((generation / 'git-profile/profile.json').read_text())['packageTreeSha256']
          assert prepared.FS.tree_sha(package) == expected, 'profile_package_changed_before_download'
          inputs = temp / 'sou124-offline-inputs'
          inputs.mkdir(mode=0o700)
