          temp = Path(os.environ['RUNNER_TEMP'])
          first = json.loads((temp / 'sou111-assets/first.json').read_text())
          generation = Path(first['selection']).resolve(strict=True).parent
          assert generation.is_relative_to(temp / 'sou111-preparation/generations')
          for role in ('filesystem', 'git'):
              profile = generation / (role + '-profile') / 'profile.json'
