  manual-long-session:
    # Manual-only: excluded explicitly from ci_components.py and PR admission.
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["smoke","soak"]'), github.event.inputs.stability_mode)
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the pinned Linux runtime and bubblewrap
        shell: bash
        run: |
          set -euo pipefail
