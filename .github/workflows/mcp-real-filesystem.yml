          if [[ "$PILOT_CONCURRENT_PREPARATION" == true && "$NATIVE_ONLY" != true ]]; then
            echo 'Concurrent preparation requires the focused native-only dispatch' >&2
            exit 1
          fi
          await_preparation_owner() {
            python3 -B - "$1" "$2" "$3" <<'PY'
          import fcntl, json, os, sys, time
          from pathlib import Path
          lock = Path(sys.argv[1]) / '.pilot-input-preparation.lock'
          owner = Path('/proc') / sys.argv[2] / 'stat'
          record = Path(sys.argv[3])
          deadline = time.monotonic() + 45
          while time.monotonic() < deadline:
              try:
                  fd = os.open(lock, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              except FileNotFoundError:
                  pass
              else:
                  try:
                      try:
                          fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                      except BlockingIOError:
                          raise SystemExit(0)
                  finally:
                      os.close(fd)
              try:
                  exited = owner.read_text().split()[2] == 'Z'
              except OSError:
                  exited = True
              if exited:
                  try:
                      row = json.loads(record.read_bytes()[:1024])
                      detail = ':'.join(str(row.get(key, 'unknown'))[:300]
                                        for key in ('status', 'stage', 'reason'))
                  except (OSError, ValueError, TypeError):
                      detail = 'bounded_result_unavailable'
                  raise SystemExit('owner_exited_before_lock: ' + detail)
              time.sleep(.05)
          raise SystemExit('owned preparation lock was not observed within 45 seconds')
          PY
          }
          mkdir -m 700 "$RUNNER_TEMP/sou111-assets"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/sou111-assets/node.tar.xz"
          printf '%s  %s\n' 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37 \
            "$RUNNER_TEMP/sou111-assets/node.tar.xz" | sha256sum --check
          curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.51.2.tar.xz \
            --output "$RUNNER_TEMP/sou111-assets/git.tar.xz"
          printf '%s  %s\n' 233d7143a2d58e60755eee9b76f559ec73ea2b3c297f5b503162ace95966b4e3 \
            "$RUNNER_TEMP/sou111-assets/git.tar.xz" | sha256sum --check
          curl --fail --location --retry 3 \
            https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz \
            --output "$RUNNER_TEMP/sou111-assets/bwrap.tar.xz"
          printf '%s  %s\n' 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d \
            "$RUNNER_TEMP/sou111-assets/bwrap.tar.xz" | sha256sum --check
          mkdir -m 700 "$RUNNER_TEMP/sou111-assets/libcap"
