name: Constrained MCP file creation

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Explicit source build or same-source producer/consumer prototype
        type: choice
        options: [source, shared]
        default: source
      comparison_only:
        description: Run only the two measured Ubuntu 24.04 consumers
        type: boolean
        default: false
      edit_only:
        description: Focus on installed edit, stop, refresh and cumulative quota qualification
        type: boolean
        default: false
      batch_only:
        description: Author-only exact-source SOU-196 core and installed batch qualification, not merge admission
        type: boolean
        default: false
      replacement_only:
        description: Focus only on the additive SOU-159 qualification
        type: boolean
        default: false
      operator_policy_only:
        description: Focus on installed inert operator policy authoring (not merge admission)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcp-create-file-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    if: github.event.inputs.build_mode != 'shared'
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: mcp-create-file.yml
  linux-create-file:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'linux-create-file') && github.event.inputs.operator_policy_only != 'true' && github.event.inputs.replacement_only != 'true' && github.event.inputs.edit_only != 'true' && github.event.inputs.batch_only != 'true' && github.event.inputs.build_mode != 'shared'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOU166_MODE: source
      SOU166_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SOU166_PRODUCER_RESULT: ''
      SOU166_PRODUCER_ATTEMPT: ''
      SOU166_PRODUCER_IMAGE_VERSION: ''
      SOU166_ARTIFACT_ID: ''
      SOU166_ARCHIVE_NAME: ''
      SOU166_ARCHIVE_SHA256: ''
      SOU166_MANIFEST_SHA256: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Prepare locked sources for explicit source mode
        if: env.SOU166_MODE == 'source'
        run: cargo fetch --locked
      - name: Initialize private current-job artifact locations
        run: |
          printf 'SOU166_BUNDLE=%s/sou166-selected\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SOU166_CONTEXT=%s/sou166-context.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require successful explicit producer before download
        if: env.SOU166_MODE == 'shared'
        run: python3 -B scripts/ci_qualification_build.py guard
      - name: Download only the immutable current-run producer artifact
        if: env.SOU166_MODE == 'shared'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ env.SOU166_ARTIFACT_ID }}
          path: ${{ runner.temp }}/sou166-download
          skip-decompress: true
          digest-mismatch: error
      - name: Independently verify provenance, tuple and every executable byte
        if: env.SOU166_MODE == 'shared'
        run: |
          python3 -B scripts/ci_qualification_build.py prepare \
            --archive "$RUNNER_TEMP/sou166-download/$SOU166_ARCHIVE_NAME" \
            --output "$SOU166_BUNDLE" --context "$SOU166_CONTEXT"
      - name: Build the exact candidate
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou54-source.txt"
          rustc --version > "$RUNNER_TEMP/sou54-rust.txt"
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-build.json" -- build --locked --offline -p agentfw --bin agentfw > "$RUNNER_TEMP/sou54-build.jsonl"
          sha256sum "$(python3 -B scripts/ci_qualification_build.py binary)" > "$RUNNER_TEMP/sou54-binary.txt"
      - name: Native authority, publication and effect-accounting regressions
        shell: bash
        run: |
          set -o pipefail
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-test-0.json" -- test --locked --offline -p agentfw --lib create_file -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-unit.log"
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-test-1.json" -- test --locked --offline -p agentfw --test native_endpoint create_file_v2 -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-router.log"
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-test-2.json" -- test --locked --offline -p agentfw --lib sou54_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-composition.log"
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-test-3.json" -- test --locked --offline -p agentfw --lib mcp::input::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-input.log"
      - name: Require nonempty native boundary evidence
        run: |
          python3 - <<'PYCODE'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('sou54_probe', 'scripts/verify-sou54-create-file.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          for name in ('unit', 'router', 'composition', 'input'):
              text = Path(os.environ['RUNNER_TEMP'], 'sou54-native-' + name + '.log').read_text()
              assert probe.native_test_passed({'exit_code': 0, 'stdout': text}), name + ': no verified passed native tests'
          PYCODE
      - name: Evidence grading controls
        run: python3 -m unittest discover -s scripts/tests -p 'test_sou54_create*.py' -v
      - name: Real enforcing daemon, stdio and independent file witnesses
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify-sou54-create-file.py --run --repo "$PWD" \
            --agentfw "$(python3 -B scripts/ci_qualification_build.py binary)" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou54-create-file-results.json" 2>&1 | tee "$RUNNER_TEMP/sou54-driver.log"
      - name: Actual native authority substitution, concurrency and replay races
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify-sou54-create-races.py --run --repo "$PWD" \
            --agentfw "$(python3 -B scripts/ci_qualification_build.py binary)" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou54-create-races-results.json" 2>&1 | tee "$RUNNER_TEMP/sou54-races.log"
      - name: Retain sanitized outcomes and source/build witnesses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou54-create-file-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sou54-*.json
            ${{ runner.temp }}/sou54-*.jsonl
            ${{ runner.temp }}/sou54-*.txt
            ${{ runner.temp }}/sou54-*.log
            ${{ runner.temp }}/sou166-*.json
            ${{ runner.temp }}/sou166-*.log
          if-no-files-found: warn
          retention-days: 30

  linux-replace-file:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'linux-replace-file') && github.event.inputs.operator_policy_only != 'true' && github.event.inputs.edit_only != 'true' && github.event.inputs.batch_only != 'true' && github.event.inputs.comparison_only != 'true' && github.event.inputs.build_mode != 'shared'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Prepare isolated offline qualification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          cargo fetch --locked
          mkdir -p "$RUNNER_TEMP/sou159-scratch"/{home,cargo-home,tmp,faults}
          ln -s "$HOME/.cargo/registry" "$RUNNER_TEMP/sou159-scratch/cargo-home/registry"
          git rev-parse HEAD > "$RUNNER_TEMP/sou159-scratch/source.txt"
      - name: Read-only source and private loopback runtime qualification
        shell: bash
        run: |
          set -euo pipefail
          task_scratch="$RUNNER_TEMP/sou159-scratch"
          # Trusted sandbox setup, then drop ALL capabilities and the root UID.
          # No host sysctl, cgroup delegation or shared-runner setting changes.
          sudo -- bwrap --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --bind "$task_scratch" "$task_scratch" \
            --proc /proc --dev /dev --cap-drop ALL \
            --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP \
            --chdir / /usr/bin/setpriv \
            --reuid "$(id -u)" --regid "$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            /usr/bin/env -i \
            PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" RUSTUP_TOOLCHAIN=1.99.1 \
            HOME="$task_scratch/home" CARGO_HOME="$task_scratch/cargo-home" \
            CARGO_TARGET_DIR="$task_scratch/target" TMPDIR="$task_scratch/tmp" \
            SOU159_SCRATCH="$task_scratch" SOU159_SOURCE="$GITHUB_WORKSPACE" CARGO_BUILD_JOBS=4 \
            /bin/bash -euo pipefail <<'BASH'
          cd "$SOU159_SOURCE"
          cargo build --locked --offline -p agentfw --bin agentfw
          cargo test --locked --offline -p agentfw --lib replace_file -- --nocapture
          cargo test --locked --offline -p agentfw --lib resource::replacement -- --nocapture
          cargo test --locked --offline -p agentfw --test replace_file -- --nocapture
          cargo test --locked --offline -p agentfw --lib create_file -- --nocapture
          cargo clippy --locked --offline -p agentfw --all-targets -- -D warnings
          cargo fmt --all --check
          python3 -B -m unittest discover -s scripts/tests -p 'test_sou159*.py' -v
          gcc -shared -fPIC -Wall -Wextra -Werror -DFAULT=1 scripts/fixtures/sou159_faults.c -ldl -o "$SOU159_SCRATCH/faults/stage-fault.so"
          gcc -shared -fPIC -Wall -Wextra -Werror -DFAULT=2 scripts/fixtures/sou159_faults.c -ldl -o "$SOU159_SCRATCH/faults/publication-fault.so"
          gcc -shared -fPIC -Wall -Wextra -Werror -DFAULT=3 scripts/fixtures/sou159_faults.c -ldl -o "$SOU159_SCRATCH/faults/committed-error.so"
          sha256sum "$CARGO_TARGET_DIR/debug/agentfw" > "$SOU159_SCRATCH/binary.txt"
          python3 -B scripts/verify-sou159-replace-file.py --run --agentfw "$CARGO_TARGET_DIR/debug/agentfw" \
            --fault-libraries "$SOU159_SCRATCH/faults" --output "$SOU159_SCRATCH/runtime.json"
          BASH
      - name: Retain current-source finite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou159-replacement-evidence
          path: |
            ${{ runner.temp }}/sou159-scratch/source.txt
            ${{ runner.temp }}/sou159-scratch/binary.txt
            ${{ runner.temp }}/sou159-scratch/runtime.json
          if-no-files-found: warn
          retention-days: 30
  linux-installed-edit:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'linux-installed-edit') && github.event.inputs.replacement_only != 'true' && github.event.inputs.build_mode != 'shared'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOU199_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operator_policy_only == 'true' && 'true' || 'false' }}
      SOU166_MODE: source
      SOU166_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SOU166_PRODUCER_RESULT: ''
      SOU166_PRODUCER_ATTEMPT: ''
      SOU166_PRODUCER_IMAGE_VERSION: ''
      SOU166_ARTIFACT_ID: ''
      SOU166_ARCHIVE_NAME: ''
      SOU166_ARCHIVE_SHA256: ''
      SOU166_MANIFEST_SHA256: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Initialize private current-job artifact locations
        run: |
          printf 'SOU166_BUNDLE=%s/sou166-selected\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SOU166_CONTEXT=%s/sou166-context.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require successful explicit producer before download
        if: env.SOU166_MODE == 'shared'
        run: python3 -B scripts/ci_qualification_build.py guard
      - name: Download only the immutable current-run producer artifact
        if: env.SOU166_MODE == 'shared'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ env.SOU166_ARTIFACT_ID }}
          path: ${{ runner.temp }}/sou166-download
          skip-decompress: true
          digest-mismatch: error
      - name: Independently verify provenance, tuple and every executable byte
        if: env.SOU166_MODE == 'shared'
        run: |
          python3 -B scripts/ci_qualification_build.py prepare \
            --archive "$RUNNER_TEMP/sou166-download/$SOU166_ARCHIVE_NAME" \
            --output "$SOU166_BUNDLE" --context "$SOU166_CONTEXT"
      - name: Trusted setup of locked dependencies and genuine host
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap strace
          cargo fetch --locked
          task_scratch="$RUNNER_TEMP/sou161-scratch"
          mkdir -m 700 "$task_scratch"
          mkdir -m 700 "$task_scratch"/{home,cargo-home,tmp,host,low-space}
          sudo install -o 0 -g 0 -m 600 /dev/null "$task_scratch/foreign-record"
          ln -s "$HOME/.cargo/registry" "$task_scratch/cargo-home/registry"
          if [[ "$SOU199_ONLY" != true ]]; then
            cp profiles/mcp/filesystem-readonly-v1/claude-host/package*.json "$task_scratch/host/"
            npm ci --ignore-scripts --no-audit --no-fund --prefix "$task_scratch/host"
            printf '%s  %s\n' fd5f10ff0eb58daec04900466b143ea98aab50abf208a422bc008eaec13f61f7 \
              "$task_scratch/host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" | sha256sum --check
          fi
          mkdir -m 700 "$task_scratch/inventory-foreign"
          sudo mkdir -m 700 "$task_scratch/inventory-foreign/edit-90000000-0000-4000-8000-000000000002"
          git rev-parse HEAD > "$task_scratch/source.txt"
      - name: Read-only source, private scratch, offline native installed qualification
        shell: bash
        run: |
          set -euo pipefail
          task_scratch="$RUNNER_TEMP/sou161-scratch"
          sudo -- bwrap --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --bind "$task_scratch" "$task_scratch" \
            --size 65536 --perms 1777 --tmpfs "$task_scratch/low-space" \
            --proc /proc --dev /dev --cap-drop ALL \
            --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP \
            --chdir / /usr/bin/setpriv \
            --reuid "$(id -u)" --regid "$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            /usr/bin/env -i \
            PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" RUSTUP_TOOLCHAIN=1.99.1 \
            HOME="$task_scratch/home" CARGO_HOME="$task_scratch/cargo-home" \
            CARGO_TARGET_DIR="$task_scratch/target" TMPDIR="$task_scratch/tmp" \
            SOU161_SCRATCH="$task_scratch" SOU161_SOURCE="$GITHUB_WORKSPACE" CARGO_BUILD_JOBS=4 \
            SOU199_ONLY="$SOU199_ONLY" \
            SOU196_ONLY="${{ github.event_name == 'workflow_dispatch' && inputs.batch_only == true && 'true' || 'false' }}" \
            SOU166_MODE="$SOU166_MODE" SOU166_BUNDLE="$SOU166_BUNDLE" SOU166_CONTEXT="$SOU166_CONTEXT" \
            ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            /bin/bash -euo pipefail <<'BASH'
          cd "$SOU161_SOURCE"
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-build.json" -- build --locked --offline -p agentfw --bin agentfw
          qualify_batch() {
            python3 -B -m unittest discover -s scripts/tests -p 'test_edit_batch.py' -v
            gcc -shared -fPIC -Wall -Wextra -Werror scripts/fixtures/sou196_batch_fault.c -ldl -o "$SOU161_SCRATCH/batch-fault.so"
            python3 -B scripts/qualify-edit-batch.py --run --agentfw "$(python3 -B scripts/ci_qualification_build.py binary)" \
              --claude "$SOU161_SCRATCH/host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
              --python /usr/bin/python3.12 --fault "$SOU161_SCRATCH/batch-fault.so" --output "$SOU161_SCRATCH/batch"
          }
          if [ "${SOU196_ONLY:-false}" = true ]; then
            python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-batch-unit.json" -- test --locked --offline -p agentfw --lib edit_session -- --nocapture
            python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-batch-clippy.json" -- clippy --locked --offline -p agentfw --all-targets -- -D warnings
            cargo fmt --all --check
            sha256sum "$(python3 -B scripts/ci_qualification_build.py binary)" > "$SOU161_SCRATCH/binary.txt"
            qualify_batch
            exit 0
          fi
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou199-policy-test.json" -- test --locked --offline -p agentfw --lib policy_candidate -- --nocapture
          python3 -B -m unittest discover -s scripts/tests -p 'test_operator_policy.py' -v
          mkdir -m 700 "$SOU161_SCRATCH/operator-policy"
          sha256sum "$(python3 -B scripts/ci_qualification_build.py binary)" > "$SOU161_SCRATCH/operator-policy/binary.txt"
          python3 -B scripts/qualify-operator-policy.py --run --agentfw "$(python3 -B scripts/ci_qualification_build.py binary)" \
            --expected-commit "$(git rev-parse HEAD)" --output "$SOU161_SCRATCH/operator-policy/report.json"
          if [[ "$SOU199_ONLY" == true ]]; then
            python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou199-policy-clippy.json" -- clippy --locked --offline -p agentfw --all-targets -- -D warnings
            cargo fmt --all --check
            exit 0
          fi
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-test-0.json" -- test --locked --offline -p agentfw --lib edit_session -- --nocapture
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-review-publish.json" -- test --locked --offline -p agentfw --lib private_export -- --nocapture
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-support-export.json" -- test --locked --offline -p agentfw --lib support_bundle -- --nocapture
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-stop-unit.json" -- test --locked --offline -p agentfw --lib pilot_approval -- --nocapture
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-stop-endpoint.json" -- test --locked --offline -p agentfw --test native_endpoint sou125_stop -- --nocapture
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-test-1.json" -- test --locked --offline -p agentfw --lib native::execution::transport -- --nocapture
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-test-2.json" -- test --locked --offline -p agentfw --lib replace_file -- --nocapture
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-test-3.json" -- test --locked --offline -p agentfw --test replace_file -- --nocapture
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-test-4.json" -- test --locked --offline -p agentfw --lib create_file -- --nocapture
          python3 -B scripts/ci_qualification_build.py cargo --output "$SOU161_SCRATCH/sou166-edit-clippy.json" -- clippy --locked --offline -p agentfw --all-targets -- -D warnings
          cargo fmt --all --check
          python3 -B -m unittest discover -s scripts/tests -p 'test_installed_edit.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_pilot_run_operations.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_run_archive.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_archive_qualification.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_pilot_front_door_component.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_quota.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_installed_edit_stop.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_refresh.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_review.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_diff.py' -v
          sha256sum "$(python3 -B scripts/ci_qualification_build.py binary)" > "$SOU161_SCRATCH/binary.txt"
          qualify_batch
          gcc -shared -fPIC -Wall -Wextra -Werror scripts/fixtures/sou189_diff_fault.c -ldl -o "$SOU161_SCRATCH/diff-fault.so"
          python3 -B scripts/qualify-edit-diff.py --run --agentfw "$(python3 -B scripts/ci_qualification_build.py binary)" \
            --claude "$SOU161_SCRATCH/host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --python /usr/bin/python3.12 --fault "$SOU161_SCRATCH/diff-fault.so" --foreign "$SOU161_SCRATCH/foreign-record" \
            --output "$SOU161_SCRATCH/diff"
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_inventory.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_application.py' -v
          python3 -B scripts/qualify-edit-inventory.py --run --agentfw "$(python3 -B scripts/ci_qualification_build.py binary)" \
            --claude "$SOU161_SCRATCH/host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --python /usr/bin/python3.12 --foreign-state "$SOU161_SCRATCH/inventory-foreign" \
            --output "$SOU161_SCRATCH/inventory"
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_export_set.py' -v
          gcc -shared -fPIC -Wall -Wextra -Werror scripts/fixtures/sou186_export_fault.c -ldl -o "$SOU161_SCRATCH/export-set-fault.so"
          python3 -B scripts/qualify-edit-export-set.py --run --agentfw "$(python3 -B scripts/ci_qualification_build.py binary)" \
            --claude "$SOU161_SCRATCH/host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --python /usr/bin/python3.12 --fault "$SOU161_SCRATCH/export-set-fault.so" --output "$SOU161_SCRATCH/export-set"
          gcc -shared -fPIC -Wall -Wextra -Werror scripts/fixtures/sou179_review_fault.c -ldl -o "$SOU161_SCRATCH/review-fault.so"
