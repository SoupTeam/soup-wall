name: Constrained MCP file creation

on:
  workflow_dispatch:
    inputs:
      edit_only:
        description: Focus on installed edit and explicit refresh qualification
        type: boolean
        default: false
      replacement_only:
        description: Focus only on the additive SOU-159 qualification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcp-create-file-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: mcp-create-file.yml
  linux-create-file:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'linux-create-file') && github.event.inputs.replacement_only != 'true' && github.event.inputs.edit_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the exact candidate
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou54-source.txt"
          rustc --version > "$RUNNER_TEMP/sou54-rust.txt"
          cargo build --locked -p agentfw --bin agentfw --message-format=json > "$RUNNER_TEMP/sou54-build.jsonl"
          sha256sum target/debug/agentfw > "$RUNNER_TEMP/sou54-binary.txt"
      - name: Native authority, publication and effect-accounting regressions
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p agentfw --lib create_file -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-unit.log"
          cargo test --locked -p agentfw --test native_endpoint create_file_v2 -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-router.log"
          cargo test --locked -p agentfw --lib sou54_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-composition.log"
          cargo test --locked -p agentfw --lib mcp::input::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-input.log"
      - name: Require nonempty native boundary evidence
        run: |
          python3 - <<'PYCODE'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('sou54_probe', 'scripts/verify-sou54-create-file.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          for name in ('unit', 'router', 'composition', 'input'):
              text = Path(os.environ['RUNNER_TEMP'], 'sou54-native-' + name + '.log').read_text()
              assert probe.native_test_passed({'exit_code': 0, 'stdout': text}), name + ': no verified passed native tests'
          PYCODE
      - name: Evidence grading controls
        run: python3 -m unittest discover -s scripts/tests -p 'test_sou54_create*.py' -v
      - name: Real enforcing daemon, stdio and independent file witnesses
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify-sou54-create-file.py --run --repo "$PWD" \
            --agentfw "$PWD/target/debug/agentfw" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou54-create-file-results.json" 2>&1 | tee "$RUNNER_TEMP/sou54-driver.log"
      - name: Actual native authority substitution, concurrency and replay races
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify-sou54-create-races.py --run --repo "$PWD" \
            --agentfw "$PWD/target/debug/agentfw" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou54-create-races-results.json" 2>&1 | tee "$RUNNER_TEMP/sou54-races.log"
      - name: Retain sanitized outcomes and source/build witnesses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou54-create-file-evidence
          path: |
            ${{ runner.temp }}/sou54-*.json
            ${{ runner.temp }}/sou54-*.jsonl
            ${{ runner.temp }}/sou54-*.txt
            ${{ runner.temp }}/sou54-*.log
          if-no-files-found: warn
          retention-days: 30
  linux-replace-file:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'linux-replace-file') && github.event.inputs.edit_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Prepare isolated offline qualification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          cargo fetch --locked
          mkdir -p "$RUNNER_TEMP/sou159-scratch"/{home,cargo-home,tmp,faults}
          ln -s "$HOME/.cargo/registry" "$RUNNER_TEMP/sou159-scratch/cargo-home/registry"
          git rev-parse HEAD > "$RUNNER_TEMP/sou159-scratch/source.txt"
      - name: Read-only source and private loopback runtime qualification
        shell: bash
        run: |
          set -euo pipefail
          task_scratch="$RUNNER_TEMP/sou159-scratch"
          # Trusted sandbox setup, then drop ALL capabilities and the root UID.
          # No host sysctl, cgroup delegation or shared-runner setting changes.
          sudo -- bwrap --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --bind "$task_scratch" "$task_scratch" \
            --proc /proc --dev /dev --cap-drop ALL \
            --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP \
            --chdir / /usr/bin/setpriv \
            --reuid "$(id -u)" --regid "$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            /usr/bin/env -i \
            PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" RUSTUP_TOOLCHAIN=1.99.1 \
            HOME="$task_scratch/home" CARGO_HOME="$task_scratch/cargo-home" \
            CARGO_TARGET_DIR="$task_scratch/target" TMPDIR="$task_scratch/tmp" \
            SOU159_SCRATCH="$task_scratch" SOU159_SOURCE="$GITHUB_WORKSPACE" CARGO_BUILD_JOBS=4 \
            /bin/bash -euo pipefail <<'BASH'
          cd "$SOU159_SOURCE"
          cargo build --locked --offline -p agentfw --bin agentfw
          cargo test --locked --offline -p agentfw --lib replace_file -- --nocapture
          cargo test --locked --offline -p agentfw --lib resource::replacement -- --nocapture
          cargo test --locked --offline -p agentfw --test replace_file -- --nocapture
          cargo test --locked --offline -p agentfw --lib create_file -- --nocapture
          cargo clippy --locked --offline -p agentfw --all-targets -- -D warnings
          cargo fmt --all --check
          python3 -B -m unittest discover -s scripts/tests -p 'test_sou159*.py' -v
          gcc -shared -fPIC -Wall -Wextra -Werror -DFAULT=1 scripts/fixtures/sou159_faults.c -ldl -o "$SOU159_SCRATCH/faults/stage-fault.so"
          gcc -shared -fPIC -Wall -Wextra -Werror -DFAULT=2 scripts/fixtures/sou159_faults.c -ldl -o "$SOU159_SCRATCH/faults/publication-fault.so"
          gcc -shared -fPIC -Wall -Wextra -Werror -DFAULT=3 scripts/fixtures/sou159_faults.c -ldl -o "$SOU159_SCRATCH/faults/committed-error.so"
          sha256sum "$CARGO_TARGET_DIR/debug/agentfw" > "$SOU159_SCRATCH/binary.txt"
          python3 -B scripts/verify-sou159-replace-file.py --run --agentfw "$CARGO_TARGET_DIR/debug/agentfw" \
            --fault-libraries "$SOU159_SCRATCH/faults" --output "$SOU159_SCRATCH/runtime.json"
          BASH
      - name: Retain current-source finite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou159-replacement-evidence
          path: |
            ${{ runner.temp }}/sou159-scratch/source.txt
            ${{ runner.temp }}/sou159-scratch/binary.txt
            ${{ runner.temp }}/sou159-scratch/runtime.json
          if-no-files-found: warn
          retention-days: 30
  linux-installed-edit:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'linux-installed-edit') && github.event.inputs.replacement_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Trusted setup of locked dependencies and genuine host
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          cargo fetch --locked
          task_scratch="$RUNNER_TEMP/sou161-scratch"
          mkdir -m 700 "$task_scratch"
          mkdir -m 700 "$task_scratch"/{home,cargo-home,tmp,host}
          ln -s "$HOME/.cargo/registry" "$task_scratch/cargo-home/registry"
          cp profiles/mcp/filesystem-readonly-v1/claude-host/package*.json "$task_scratch/host/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$task_scratch/host"
          printf '%s  %s\n' fd5f10ff0eb58daec04900466b143ea98aab50abf208a422bc008eaec13f61f7 \
            "$task_scratch/host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" | sha256sum --check
          git rev-parse HEAD > "$task_scratch/source.txt"
      - name: Read-only source, private scratch, offline native installed qualification
        shell: bash
        run: |
          set -euo pipefail
          task_scratch="$RUNNER_TEMP/sou161-scratch"
          sudo -- bwrap --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --bind "$task_scratch" "$task_scratch" \
            --proc /proc --dev /dev --cap-drop ALL \
            --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP \
            --chdir / /usr/bin/setpriv \
            --reuid "$(id -u)" --regid "$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            /usr/bin/env -i \
            PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" RUSTUP_TOOLCHAIN=1.99.1 \
            HOME="$task_scratch/home" CARGO_HOME="$task_scratch/cargo-home" \
            CARGO_TARGET_DIR="$task_scratch/target" TMPDIR="$task_scratch/tmp" \
            SOU161_SCRATCH="$task_scratch" SOU161_SOURCE="$GITHUB_WORKSPACE" CARGO_BUILD_JOBS=4 \
            /bin/bash -euo pipefail <<'BASH'
          cd "$SOU161_SOURCE"
          cargo build --locked --offline -p agentfw --bin agentfw
          cargo test --locked --offline -p agentfw --lib edit_session -- --nocapture
          cargo test --locked --offline -p agentfw --lib native::execution::transport -- --nocapture
          cargo test --locked --offline -p agentfw --lib replace_file -- --nocapture
          cargo test --locked --offline -p agentfw --test replace_file -- --nocapture
          cargo test --locked --offline -p agentfw --lib create_file -- --nocapture
          cargo clippy --locked --offline -p agentfw --all-targets -- -D warnings
          cargo fmt --all --check
          python3 -B -m unittest discover -s scripts/tests -p 'test_installed_edit.py' -v
          python3 -B -m unittest discover -s scripts/tests -p 'test_edit_refresh.py' -v
          sha256sum "$CARGO_TARGET_DIR/debug/agentfw" > "$SOU161_SCRATCH/binary.txt"
          python3 -B scripts/qualify-installed-edit.py --run --agentfw "$CARGO_TARGET_DIR/debug/agentfw" \
            --claude "$SOU161_SCRATCH/host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --python /usr/bin/python3.12 --output "$SOU161_SCRATCH/runtime"
          gcc -shared -fPIC -Wall -Wextra -Werror scripts/fixtures/sou168_publish_fault.c -ldl -o "$SOU161_SCRATCH/publish-fault.so"
          python3 -B scripts/qualify-edit-refresh.py --run --agentfw "$CARGO_TARGET_DIR/debug/agentfw" \
            --claude "$SOU161_SCRATCH/host/node_modules/@anthropic-ai/claude-code-linux-x64/claude" \
            --python /usr/bin/python3.12 --publish-fault "$SOU161_SCRATCH/publish-fault.so" \
            --output "$SOU161_SCRATCH/refresh"
          BASH
      - name: Retain finite current-source qualification and build correlation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou161-installed-edit-evidence
          path: |
            ${{ runner.temp }}/sou161-scratch/source.txt
            ${{ runner.temp }}/sou161-scratch/binary.txt
            ${{ runner.temp }}/sou161-scratch/runtime/report.json
            ${{ runner.temp }}/sou161-scratch/refresh/report.json
          if-no-files-found: warn
          retention-days: 30
