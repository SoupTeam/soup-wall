  reuse-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'shared'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        run: |
          python3 -B - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from ci_impact import WORKFLOW_JOBS
          selected = {name: [] for name in WORKFLOW_JOBS}
          selected['ci-builds.yml'] = ['agent-default-ubuntu2404']
          selected['mcp-create-file.yml'] = ['linux-create-file', 'linux-installed-edit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('plan=' + json.dumps({'workflows': selected}, separators=(',', ':')) + '\n')
          PYCODE
  reuse-qualification:
    needs: reuse-plan
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'shared'
    uses: ./.github/workflows/ci-components.yml
    with:
      plan: ${{ needs.reuse-plan.outputs.plan }}
