      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.backend == 'sqlite' && '["sqlite"]' || inputs.backend == 'postgres' && '["postgres"]' || '["sqlite","postgres"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare disposable browser and vendor driver
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools
          python3 -m venv target/oidc-driver
          target/oidc-driver/bin/python -m pip install requests==2.34.2 cryptography==50.0.2 psutil==7.2.2 playwright==1.63.0
          target/oidc-driver/bin/python -m playwright install --with-deps chromium
      - name: Run browser regressions and real Keycloak lifecycle
        env:
          SSO_RUNS: ${{ inputs.runs || '1' }}
        run: |
          export PATH="$PWD/target/oidc-driver/bin:$PATH"
          python3 -m unittest discover -s scripts/tests -p test_console_browser.py -v
          python3 -m unittest discover -s scripts/tests -p test_keycloak_oidc_acceptance.py -v
          python3 -m unittest discover -s scripts/tests -p 'test_sso*.py' -v
          cargo test --locked -p llm-firewall --example keycloak-oidc-bootstrap
          bash scripts/keycloak-oidc-acceptance.sh "${{ matrix.backend }}"
      - name: Retain only sanitized checks and hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-oidc-linux-${{ matrix.backend }}-evidence
          path: target/oidc-evidence/**/*.json
          if-no-files-found: warn
          retention-days: 30

