      - name: Install independent client
        run: |
          python3 -m venv "$RUNNER_TEMP/scim-client"
          "$RUNNER_TEMP/scim-client/bin/python" -m pip install -r scripts/scim-directory-requirements.txt
      - name: Run genuine client lifecycle
        run: |
          "$RUNNER_TEMP/scim-client/bin/python" scripts/scim-directory-acceptance.py --backend "${{ matrix.backend }}" --fixture target/debug/examples/scim-directory-fixture --out "$RUNNER_TEMP/scim-evidence/${{ matrix.backend }}.json"
      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scim-directory-${{ matrix.backend }}
          path: ${{ runner.temp }}/scim-evidence/*.json
          if-no-files-found: warn
          retention-days: 30

  sou79-resource-budgets--required-disposable-delegated-linux:
    name: "sou79-resource-budgets / required-disposable-delegated-linux"
    if: contains(fromJSON(inputs.plan).workflows['sou79-resource-budgets.yml'], 'required-disposable-delegated-linux')
    # This job explicitly prepares ONE disposable, owned delegated service.
    # Other hosted checks retain their existing permissions and prerequisites.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Build pinned Node and unprivileged bubblewrap prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config
          mkdir "$RUNNER_TEMP/sou79-node" "$RUNNER_TEMP/sou79-bwrap-source"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz --output "$RUNNER_TEMP/sou79-node.tar.xz"
          printf '%s  %s\n' 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37 "$RUNNER_TEMP/sou79-node.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/sou79-node.tar.xz" --directory "$RUNNER_TEMP/sou79-node" --strip-components=1 --no-same-owner --no-same-permissions
          curl --fail --location --retry 3 https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz --output "$RUNNER_TEMP/sou79-bwrap.tar.xz"
          printf '%s  %s\n' 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d "$RUNNER_TEMP/sou79-bwrap.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/sou79-bwrap.tar.xz" --directory "$RUNNER_TEMP/sou79-bwrap-source" --strip-components=1 --no-same-owner --no-same-permissions
          meson setup "$RUNNER_TEMP/sou79-bwrap-build" "$RUNNER_TEMP/sou79-bwrap-source" -Dtests=false -Dman=disabled -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/sou79-bwrap-build"
          sha256sum "$RUNNER_TEMP/sou79-node.tar.xz" "$RUNNER_TEMP/sou79-node/bin/node" "$RUNNER_TEMP/sou79-bwrap.tar.xz" "$RUNNER_TEMP/sou79-bwrap-build/bwrap" > "$RUNNER_TEMP/sou79-runtime-hashes.txt"
      - name: Build exact candidate and require nonempty observer controls
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou79-source.txt"
          rustc --version > "$RUNNER_TEMP/sou79-rust.txt"
          python3 --version > "$RUNNER_TEMP/sou79-python.txt"
          systemd --version > "$RUNNER_TEMP/sou79-systemd.txt"
          cargo build --locked -p agentfw --bin agentfw --message-format=json > "$RUNNER_TEMP/sou79-build.jsonl"
          sha256sum target/debug/agentfw > "$RUNNER_TEMP/sou79-binary.txt"
          python3 -B - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover('scripts/tests',pattern='test_sou79_resource_budgets.py')
          if not suite.countTestCases(): raise SystemExit('required observer controls missing')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Explicitly prepare disposable delegation and run as ordinary user
        shell: bash
        run: |
          set -euo pipefail
          unit="sou79-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # This unit alone receives delegation. No chmod/chown of cgroupfs,
          # global controller writes, sysctl changes or AppArmor relaxation.
          sudo systemd-run --quiet --wait --pipe --collect --unit="$unit" \
            --property="User=$(id -un)" --property="Group=$(id -gn)" \
            --property='Delegate=cpu memory pids' \
            --property=MemoryMax=2G --property=MemorySwapMax=0 \
            --property=TasksMax=256 --property=CPUQuota=200% \
            --property=RuntimeMaxSec=15min --property=KillMode=control-group \
            --working-directory="$GITHUB_WORKSPACE" \
            /usr/bin/env "PATH=$PATH" "TMPDIR=$RUNNER_TEMP" \
            python3 -B scripts/verify-sou79-resource-budgets.py --run \
            --agentfw "$GITHUB_WORKSPACE/target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou79-node/bin/node" --npm "$RUNNER_TEMP/sou79-node/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou79-bwrap-build/bwrap" \
            --expected-commit "$(git rev-parse HEAD)" --disposable-systemd-unit="$unit.service" \
            --output "$RUNNER_TEMP/sou79-acceptance"
      - name: Publish bounded sanitized kernel evidence
        if: always()
        run: |
          python3 -B - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('sou79','scripts/verify-sou79-resource-budgets.py')
          driver=importlib.util.module_from_spec(spec);spec.loader.exec_module(driver)
          path=Path(os.environ['RUNNER_TEMP'])/'sou79-acceptance/report.json'
          report=json.loads(path.read_text()) if path.exists() else {'status':'incomplete','error':'required_report_missing','passed':0,'failed':1,'skipped':0}
          rendered=json.dumps(driver.summary(report),indent=2)
          print(rendered)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream: stream.write('```json\n'+rendered+'\n```\n')
          PY
      - name: Retain source identities and sanitized owned observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou79-linux-resource-budget-evidence
          path: |
            ${{ runner.temp }}/sou79-*.txt
            ${{ runner.temp }}/sou79-build.jsonl
            ${{ runner.temp }}/sou79-acceptance/report.json
          if-no-files-found: warn
          retention-days: 30

  sou86-crash-supervision--required-disposable-linux-crash-supervision:
    name: "sou86-crash-supervision / required-disposable-linux-crash-supervision"
    if: contains(fromJSON(inputs.plan).workflows['sou86-crash-supervision.yml'], 'required-disposable-linux-crash-supervision')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
      SOU86_ACCEPTED: '2af2f35b326e0f70660b5c4cbde8134fe4ab9751'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Build pinned Node and unprivileged bubblewrap prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config
          mkdir "$RUNNER_TEMP/sou86-node" "$RUNNER_TEMP/sou86-bwrap-source"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz --output "$RUNNER_TEMP/sou86-node.tar.xz"
          printf '%s  %s\n' 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37 "$RUNNER_TEMP/sou86-node.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/sou86-node.tar.xz" --directory "$RUNNER_TEMP/sou86-node" --strip-components=1 --no-same-owner --no-same-permissions
          curl --fail --location --retry 3 https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz --output "$RUNNER_TEMP/sou86-bwrap.tar.xz"
          printf '%s  %s\n' 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d "$RUNNER_TEMP/sou86-bwrap.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/sou86-bwrap.tar.xz" --directory "$RUNNER_TEMP/sou86-bwrap-source" --strip-components=1 --no-same-owner --no-same-permissions
          meson setup "$RUNNER_TEMP/sou86-bwrap-build" "$RUNNER_TEMP/sou86-bwrap-source" -Dtests=false -Dman=disabled -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/sou86-bwrap-build"
          sha256sum "$RUNNER_TEMP/sou86-node.tar.xz" "$RUNNER_TEMP/sou86-node/bin/node" "$RUNNER_TEMP/sou86-bwrap.tar.xz" "$RUNNER_TEMP/sou86-bwrap-build/bwrap" > "$RUNNER_TEMP/sou86-runtime-hashes.txt"
      - name: Build accepted runtime separately before implementing the new boundary
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou86-driver-source.txt"
          git rev-parse "$SOU86_ACCEPTED" "$SOU86_ACCEPTED^{tree}" > "$RUNNER_TEMP/sou86-accepted-source.txt"
          rustc --version > "$RUNNER_TEMP/sou86-rust.txt"
          python3 --version > "$RUNNER_TEMP/sou86-python.txt"
          systemd --version > "$RUNNER_TEMP/sou86-systemd.txt"
          mkdir "$RUNNER_TEMP/sou86-accepted"
          git archive "$SOU86_ACCEPTED" | tar --extract --directory "$RUNNER_TEMP/sou86-accepted"
          cargo build --manifest-path "$RUNNER_TEMP/sou86-accepted/Cargo.toml" --target-dir "$RUNNER_TEMP/sou86-accepted-target" --locked -p agentfw --bin agentfw --message-format=json > "$RUNNER_TEMP/sou86-accepted-build.jsonl"
          sha256sum "$RUNNER_TEMP/sou86-accepted-target/debug/agentfw" > "$RUNNER_TEMP/sou86-accepted-binary.txt"
      - name: Require nonempty observer controls
        run: |
          python3 -B - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover('scripts/tests',pattern='test_sou86_crash_supervision.py')
          if not suite.countTestCases(): raise SystemExit('required crash observer controls missing')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Inventory actual accepted crash behavior before any harness recovery
        shell: bash
        run: |
          set -euo pipefail
          unit="sou86-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Explicit authorization is limited to this one disposable service.
          # Its outer teardown is emergency safety, never successful evidence.
          sudo systemd-run --quiet --wait --pipe --collect --unit="$unit" \
            --property="User=$(id -un)" --property="Group=$(id -gn)" \
            --property='Delegate=cpu memory pids' \
            --property=MemoryMax=2G --property=MemorySwapMax=0 \
            --property=TasksMax=256 --property=CPUQuota=200% \
            --property=RuntimeMaxSec=15min --property=KillMode=control-group \
            --working-directory="$GITHUB_WORKSPACE" \
            /usr/bin/env "PATH=$PATH" "TMPDIR=$RUNNER_TEMP" \
            python3 -B scripts/verify-sou86-crash-supervision.py --run --mode baseline-inventory \
            --agentfw "$RUNNER_TEMP/sou86-accepted-target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou86-node/bin/node" --npm "$RUNNER_TEMP/sou86-node/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou86-bwrap-build/bwrap" \
            --expected-commit "$(git rev-parse HEAD)" --runtime-source-commit "$SOU86_ACCEPTED" \
            --disposable-systemd-unit="$unit.service" --output "$RUNNER_TEMP/sou86-baseline-inventory"
      - name: Build explicitly pinned Git and the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends zlib1g-dev
          mkdir "$RUNNER_TEMP/sou86-git-source"
          curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.51.2.tar.xz --output "$RUNNER_TEMP/sou86-git.tar.xz"
          printf '%s  %s\n' 233d7143a2d58e60755eee9b76f559ec73ea2b3c297f5b503162ace95966b4e3 "$RUNNER_TEMP/sou86-git.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/sou86-git.tar.xz" --directory "$RUNNER_TEMP/sou86-git-source" --strip-components=1 --no-same-owner --no-same-permissions
          make -C "$RUNNER_TEMP/sou86-git-source" -j2 NO_CURL=YesPlease NO_EXPAT=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_OPENSSL=YesPlease git
          cargo build --locked -p agentfw --bins --message-format=json > "$RUNNER_TEMP/sou86-candidate-build.jsonl"
          sha256sum target/debug/agentfw target/debug/agentfw-git-sandbox "$RUNNER_TEMP/sou86-git-source/git" > "$RUNNER_TEMP/sou86-candidate-binaries.txt"
      - name: Validate SOU-89 selected liveness grader and observer contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/test-sou89-selected-contracts.py
      - name: Require original filesystem Git and independently observed crash recovery
        shell: bash
        run: |
          set -euo pipefail
          unit="sou86-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The first service has exited and been collected. This is a fresh
          # explicitly owned service, with no shared-root recovery scan.
          sudo systemd-run --quiet --wait --pipe --collect --unit="$unit" \
            --property="User=$(id -un)" --property="Group=$(id -gn)" \
            --property='Delegate=cpu memory pids' \
            --property=MemoryMax=2G --property=MemorySwapMax=0 \
            --property=TasksMax=256 --property=CPUQuota=200% \
            --property=RuntimeMaxSec=15min --property=KillMode=control-group \
            --working-directory="$GITHUB_WORKSPACE" \
            /usr/bin/env "PATH=$PATH" "TMPDIR=$RUNNER_TEMP" \
            python3 -B scripts/verify-sou86-crash-supervision.py --run --mode acceptance \
            --agentfw "$GITHUB_WORKSPACE/target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou86-node/bin/node" --npm "$RUNNER_TEMP/sou86-node/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou86-bwrap-build/bwrap" \
            --git "$RUNNER_TEMP/sou86-git-source/git" \
            --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou86-git-source/git" | cut -d' ' -f1)" \
            --git-launcher "$GITHUB_WORKSPACE/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" --runtime-source-commit "$(git rev-parse HEAD)" \
            --disposable-systemd-unit="$unit.service" --output "$RUNNER_TEMP/sou86-acceptance"
      - name: Require SOU-89 selected filesystem and Git native liveness and autonomous reclamation
        shell: bash
        run: |
          set -euo pipefail
          # The accepted SOU-86 delegation helper requires its owned namespace.
          # The preceding service is collected; this launch must be fresh again.
          # The harness covers 140 full startup/crash/cleanup cycles. Its finite
          # outer wall budget does not change any per-case lease or cleanup deadline.
          unit="sou86-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo systemd-run --wait --pipe --collect --unit="$unit" \
            --property="User=$(id -un)" --property="Group=$(id -gn)" \
            --property='Delegate=cpu memory pids' \
            --property=MemoryMax=2G --property=MemorySwapMax=0 \
            --property=TasksMax=256 --property=CPUQuota=200% \
            --property=RuntimeMaxSec=25min --property=KillMode=control-group \
            --working-directory="$GITHUB_WORKSPACE" \
            /usr/bin/env "PATH=$PATH" "TMPDIR=$RUNNER_TEMP" \
            python3 -B scripts/verify-sou89-selected-liveness.py --run \
            --agentfw "$GITHUB_WORKSPACE/target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou86-node/bin/node" --npm "$RUNNER_TEMP/sou86-node/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou86-bwrap-build/bwrap" \
            --git "$RUNNER_TEMP/sou86-git-source/git" \
            --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou86-git-source/git" | cut -d' ' -f1)" \
            --git-launcher "$GITHUB_WORKSPACE/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" --runtime-source-commit "$(git rev-parse HEAD)" \
            --disposable-systemd-unit="$unit.service" --output "$RUNNER_TEMP/sou89-selected-acceptance"
      - name: Publish separate bounded sanitized inventory and protection evidence
        if: always()
        run: |
          python3 -B - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('sou86','scripts/verify-sou86-crash-supervision.py')
          driver=importlib.util.module_from_spec(spec);spec.loader.exec_module(driver)
          spec89=importlib.util.spec_from_file_location('sou89','scripts/verify-sou89-selected-liveness.py')
          driver89=importlib.util.module_from_spec(spec89);spec89.loader.exec_module(driver89)
          for directory,protected in (('sou86-baseline-inventory',False),('sou86-acceptance',True),('sou89-selected-acceptance',True)):
              path=Path(os.environ['RUNNER_TEMP'])/directory/'report.json'
              if directory == 'sou89-selected-acceptance':
                  report=json.loads(path.read_text()) if path.exists() else {'status':'incomplete','error':'required_report_missing','selected_production_acceptance':protected,'passed':0,'failed':1}
                  rendered=json.dumps(driver89.summary(report),indent=2)
              else:
                  report=json.loads(path.read_text()) if path.exists() else {'status':'incomplete','error':'required_report_missing','protection_acceptance':protected,'passed':0,'failed':1,'skipped':0}
                  rendered=json.dumps(driver.summary(report),indent=2)
              print(rendered)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream: stream.write('```json\n'+rendered+'\n```\n')
          PY
      - name: Retain exact identities and sanitized owned observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou86-linux-crash-supervision-evidence
          path: |
            ${{ runner.temp }}/sou86-*.txt
            ${{ runner.temp }}/sou86-accepted-build.jsonl
            ${{ runner.temp }}/sou86-candidate-build.jsonl
            ${{ runner.temp }}/sou86-baseline-inventory/report.json
            ${{ runner.temp }}/sou86-acceptance/report.json
            ${{ runner.temp }}/sou89-selected-acceptance/report.json
          if-no-files-found: warn
          retention-days: 30

  supply-chain--cargo-audit:
    if: contains(fromJSON(inputs.plan).workflows['supply-chain.yml'], 'cargo-audit')
    name: "supply-chain / Cargo audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binary: compiling cargo-audit from source costs several minutes
      # per run for a tool that does no compilation itself.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      # All SAML release targets use AWS-LC; the complete lock excludes rsa.
      # No vulnerability is excepted. Informational warnings remain visible.
      - run: cargo audit

  supply-chain--sbom:
    if: contains(fromJSON(inputs.plan).workflows['supply-chain.yml'], 'sbom')
    name: "supply-chain / CycloneDX SBOM"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      # Include the optional ML classifier and the gateway's SAML/DB stack.
      - name: Generate SBOM
        run: cargo cyclonedx --all --format json --all-features --target all
      - name: Confirm all six workspace packages have an SBOM
        shell: bash
        run: |
          set -euo pipefail
          for package in soup-wall-core soup-wall-agent agentfw soup-wall-adapter soup-wall-bench llm-firewall; do
            test "$(find . -name "$package.cdx.json" | wc -l)" -eq 1 || {
              echo "missing or duplicate SBOM for $package" >&2
              exit 1
            }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: soup-wall-sbom
          path: "**/*.cdx.json"
          if-no-files-found: error
          retention-days: 90

  test-environment--windows-launcher:
    if: contains(fromJSON(inputs.plan).workflows['test-environment.yml'], 'windows-launcher')
    name: "test-environment / Windows launcher guidance and reporting"
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Exercises Windows Python diagnostics and mocked host/report paths.
      # This job does not run WSL2 or certify Docker Desktop integration.
      - name: Verify launcher behavior on Windows Python
        run: python -m unittest discover -s scripts/tests -p 'test_test_environment.py' -v

  test-environment--fixture-baseline:
    if: contains(fromJSON(inputs.plan).workflows['test-environment.yml'], 'fixture-baseline')
    name: "test-environment / Linux fixture baseline (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Verify the environment launcher
        run: python3 -m unittest discover -s scripts/tests -p 'test_test_environment.py' -v
      - name: Build and run the same local command
        run: python3 scripts/test-environment.py --platform '${{ matrix.platform }}'
      - name: Retain reports, skipped cases and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-fixtures-${{ matrix.artifact }}
          path: target/test-environment/
          if-no-files-found: warn
          retention-days: 14

  tls-lifecycle--linux:
    name: "tls-lifecycle / linux"
    if: contains(fromJSON(inputs.plan).workflows['tls-lifecycle.yml'], 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: TLS rotation and recovery
        run: python3 scripts/tls-lifecycle.py --out target/tls-evidence/ci
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tls-lifecycle-linux
          path: target/tls-evidence/ci
          if-no-files-found: error

