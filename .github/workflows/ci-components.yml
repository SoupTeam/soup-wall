            ${{ runner.temp }}/sou111-assets/capacity-*.json
            ${{ runner.temp }}/sou111-assets/selected-hashes.txt
            ${{ runner.temp }}/sou140-operator-results/operator-results.json
            ${{ runner.temp }}/sou140-rust-tests.log
            ${{ runner.temp }}/sou122-toolchain/native-attestation.json
            ${{ runner.temp }}/sou111-assets/native-summary.json
            ${{ runner.temp }}/sou173-download.json
            ${{ runner.temp }}/sou111-assets/native-timing.json
            ${{ runner.temp }}/sou111-assets/sou180-interrupted.json
            ${{ runner.temp }}/sou111-assets/sou180-watch.json
