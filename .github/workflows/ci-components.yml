              Tee-Object -FilePath "$env:RUNNER_TEMP/sou60-router.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native endpoint regressions failed' }
      - name: Actual stdio, enforcing daemon and handle tests as a standard user
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/ci-windows-create.ps1 -AgentBinary ./target/debug/agentfw.exe `
              -TestBinary $env:SOU60_TEST_BINARY -PythonBinary (Get-Command python).Source `
              -Commit ((& git rev-parse HEAD).Trim()) -OutputDirectory "$env:RUNNER_TEMP/sou60-standard-user"
          if ($LASTEXITCODE -ne 0) { throw 'Standard-user native Windows acceptance failed' }
      - name: Publish bounded native Windows failure diagnostics
        if: always()
        shell: pwsh
        run: |
          python -B scripts/print-sou60-ci-diagnostics.py --root "$env:RUNNER_TEMP" --summary "$env:GITHUB_STEP_SUMMARY"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish native Windows diagnostics' }
      - name: Retain sanitized outcomes and exact source/build witnesses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou60-native-windows-create-evidence
          path: |
            ${{ runner.temp }}/sou60-*.txt
            ${{ runner.temp }}/sou60-*.jsonl
            ${{ runner.temp }}/sou60-*.log
            ${{ runner.temp }}/sou60-standard-user/*.json
            ${{ runner.temp }}/sou60-standard-user/*.log
          if-no-files-found: warn
          retention-days: 30

