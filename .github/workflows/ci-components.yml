          sha256sum target/debug/agentfw > "$RUNNER_TEMP/sou76-binary.txt"
      - name: Require nonempty observer and evidence controls
        run: |
          python3 -B - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover('scripts/tests',pattern='test_sou76_native_stderr.py')
          if not suite.countTestCases(): raise SystemExit('required observer controls are missing')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Required real daemon and native MCP output-boundary evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-sou76-native-stderr.py --run --agentfw "$PWD/target/debug/agentfw" \
            --expected-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/sou76-acceptance" \
            2>&1 | tee "$RUNNER_TEMP/sou76-summary.log"
      - name: Publish bounded sanitized outcome
        if: always()
        run: |
          python3 -B - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('sou76','scripts/verify-sou76-native-stderr.py')
          driver=importlib.util.module_from_spec(spec); spec.loader.exec_module(driver)
          path=Path(os.environ['RUNNER_TEMP'])/'sou76-acceptance/report.json'
          report=json.loads(path.read_text()) if path.exists() else {'status':'incomplete','error':'required_report_missing'}
          rendered=json.dumps(driver.summary(report),indent=2)
          print(rendered)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream: stream.write('```json\n'+rendered+'\n```\n')
          PY
      - name: Retain sanitized hashes counters and owned cleanup witnesses
        if: always()
        uses: actions/upload-artifact@v7
