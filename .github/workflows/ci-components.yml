        with:
          name: keycloak-saml-linux-${{ matrix.backend }}-evidence
          path: ${{ runner.temp }}/saml-evidence/**/*.json
          if-no-files-found: warn
          retention-days: 30

  license-policy--rust-license-policy:
    if: contains(fromJSON(inputs.plan).workflows['license-policy.yml'], 'rust-license-policy')
    name: "license-policy / Locked workspace license policy"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Unit-test policy evaluator and fail-closed paths
        run: python3 -m unittest discover -s scripts/tests -p 'test_license_policy.py' -v
      - name: Check full locked workspace and write provenance report
        run: >-
          python3 scripts/license_policy.py
          --root .
          --policy policy/license-policy.toml
          --assets policy/asset-provenance.toml
          --report target/license-policy/report.json
      - name: Archive inventory and unresolved license evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locked-license-policy-${{ github.run_id }}
          path: target/license-policy/report.json
          if-no-files-found: warn
          retention-days: 90

  managed-credential-rotation--formatting-preview:
    if: contains(fromJSON(inputs.plan).workflows['managed-credential-rotation.yml'], 'formatting-preview')
    name: "managed-credential-rotation / Rust formatting preview (read-only)"
    runs-on: ubuntu-24.04
