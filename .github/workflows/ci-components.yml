    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Check receiver and drill boundaries
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_alert_receiver.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_linux_alert_acceptance.py' -v
      - name: Run the exact-source Linux acceptance command
        run: |
          mkdir -p target
          python3 scripts/linux-alert-acceptance.py --execute --expected-commit "$(git rev-parse HEAD)" --out target/linux-alert-evidence.json
      - name: Show sanitized acceptance summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("target/linux-alert-evidence.json")
          if not path.is_file():
              print(json.dumps({"status": "incomplete", "evidence_present": False}))
          else:
              evidence = json.loads(path.read_text())
              checks = evidence.get("checks", [])
              fields = ("phase", "command_sequence", "failure_kind", "return_code",
                        "elapsed_seconds", "private_log_sha256")
              summary = {"status": evidence.get("status", "incomplete"),
                         "source_commit": evidence.get("source", {}).get("commit"),
                         "passed_checks": sum(row.get("outcome") == "pass" for row in checks),
                         "failed_checks": sum(row.get("outcome") == "fail" for row in checks),
                         "error_type": evidence.get("error_type"),
                         "error_reason": evidence.get("error_reason"), "error_phase": evidence.get("error_phase"),
                         "failed_check_names": [row.get("check") for row in checks if row.get("outcome") == "fail"][:20],
                         "endpoint_witnesses": evidence.get("endpoint_witnesses", [])[:4],
                         "command_failures": [{key: row.get(key) for key in fields}
                                              for row in evidence.get("command_failures", [])]}
              print(json.dumps(summary, sort_keys=True))
          PY
      - name: Retain sanitized raw outcomes, including incomplete runs
