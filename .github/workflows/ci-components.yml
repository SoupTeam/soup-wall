  mcp-real-git--required-linux-git:
    name: "mcp-real-git / required-linux-git"
    if: contains(fromJSON(inputs.plan).workflows['mcp-real-git.yml'], 'required-linux-git') && !inputs.installed_profiles_only
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - name: Refuse unqualified combined capability selection
        if: (inputs.local_refs_only && inputs.shallow_only) || (inputs.local_refs_only && inputs.file_revisions_only) || (inputs.shallow_only && inputs.file_revisions_only) || (inputs.tracked_symlinks_only && (inputs.local_refs_only || inputs.shallow_only || inputs.file_revisions_only))
        run: exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build explicitly pinned Git and bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config zlib1g-dev
          mkdir "$RUNNER_TEMP/sou68-git-source" "$RUNNER_TEMP/sou68-bwrap-source"
          curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.51.2.tar.xz --output "$RUNNER_TEMP/sou68-git.tar.xz"
          printf '%s  %s\n' 233d7143a2d58e60755eee9b76f559ec73ea2b3c297f5b503162ace95966b4e3 "$RUNNER_TEMP/sou68-git.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou68-git.tar.xz" -C "$RUNNER_TEMP/sou68-git-source" --strip-components=1 --no-same-owner --no-same-permissions
          make -C "$RUNNER_TEMP/sou68-git-source" -j2 NO_CURL=YesPlease NO_EXPAT=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_OPENSSL=YesPlease git
          mkdir "$RUNNER_TEMP/sou107-git-source"
          tar -xJf "$RUNNER_TEMP/sou68-git.tar.xz" -C "$RUNNER_TEMP/sou107-git-source" --strip-components=1 --no-same-owner --no-same-permissions
          make -C "$RUNNER_TEMP/sou107-git-source" -j2 LDFLAGS=-static NO_CURL=YesPlease NO_EXPAT=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_OPENSSL=YesPlease git
          sha256sum "$RUNNER_TEMP/sou107-git-source/git" > "$RUNNER_TEMP/sou107-runtime-hashes.txt"
          curl --fail --location --retry 3 https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz --output "$RUNNER_TEMP/sou68-bwrap.tar.xz"
          printf '%s  %s\n' 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d "$RUNNER_TEMP/sou68-bwrap.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou68-bwrap.tar.xz" -C "$RUNNER_TEMP/sou68-bwrap-source" --strip-components=1 --no-same-owner --no-same-permissions
          meson setup "$RUNNER_TEMP/sou68-bwrap-build" "$RUNNER_TEMP/sou68-bwrap-source" -Dtests=false -Dman=disabled -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/sou68-bwrap-build"
          sha256sum "$RUNNER_TEMP/sou68-git-source/git" "$RUNNER_TEMP/sou68-bwrap-build/bwrap" > "$RUNNER_TEMP/sou68-runtime-hashes.txt"
      - name: Build exact Agent and sandbox test binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p agentfw --bins
          cargo test --locked -p agentfw --lib --no-run --message-format=json > "$RUNNER_TEMP/sou68-test-build.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'sou68-test-build.jsonl').read_text().splitlines()]
          binaries = [r['executable'] for r in rows if r.get('reason') == 'compiler-artifact' and r.get('target', {}).get('name') == 'agentfw' and r.get('profile', {}).get('test') and r.get('executable')]
          assert len(binaries) == 1
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SOU68_TEST_BINARY=' + binaries[0] + '\n')
          PY
      - name: Pilot selection and policy controls
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.local_refs_only || inputs.shallow_only || inputs.file_revisions_only || inputs.tracked_symlinks_only)) }}
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_policy.py -v
          cargo test --locked -p soup-wall-agent --test pilot_policy
          python3 -B scripts/pilot_decision_matrix.py --output "$RUNNER_TEMP/sou98-development.json"
      - name: Git and existing filesystem regressions
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.local_refs_only || inputs.shallow_only || inputs.file_revisions_only || inputs.tracked_symlinks_only)) }}
        run: |
          cargo test --locked -p agentfw server_profile --lib
          cargo test --locked -p agentfw real_server --lib
          cargo test --locked -p agentfw syscall_filter --lib
          python3 -B -m unittest discover -s scripts/tests -p test_sou68_real_mcp.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_sou107_profile.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_sou62_real_mcp.py -v
          python3 -B -m unittest discover -s rule_baseline -p 'test_*.py' -v
          python3 eval/eval_runner.py eval/fixtures/soup_task1_evaluation_cases_v0.4.json --classifier-path rule_baseline/git_readonly_v1 --out-dir target/sou68-core-evaluation
          python3 eval/eval_runner.py eval/fixtures/soup_task1_mixed_actions_urtisto_v0.1.json eval/fixtures/soup_task1_benign_comparison_urtisto_v0.1.json --classifier-path rule_baseline/git_readonly_v1 --out-dir target/sou68-mixed-evaluation
          cargo run --locked --release -p soup-wall-bench -- --agent crates/bench/corpora/agent_sessions.jsonl --policy profiles/mcp/git-readonly-v1/policy.yaml
      - name: Actual Git server and independent OS isolation
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.local_refs_only || inputs.shallow_only || inputs.file_revisions_only || inputs.tracked_symlinks_only)) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-sou68-real-mcp.py --run --agentfw "$PWD/target/debug/agentfw" \
            --git "$RUNNER_TEMP/sou68-git-source/git" --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou68-git-source/git" | cut -d' ' -f1)" \
            --bwrap "$RUNNER_TEMP/sou68-bwrap-build/bwrap" --sandbox-test-binary "$SOU68_TEST_BINARY" \
            --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/sou68-acceptance" \
            2>&1 | tee "$RUNNER_TEMP/sou68-acceptance.log"
      - name: SOU-98 same-preset original-server acceptance
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.local_refs_only || inputs.shallow_only || inputs.file_revisions_only || inputs.tracked_symlinks_only)) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-sou68-real-mcp.py --run --pilot-preset --agentfw "$PWD/target/debug/agentfw" \
            --git "$RUNNER_TEMP/sou68-git-source/git" --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou68-git-source/git" | cut -d' ' -f1)" \
            --bwrap "$RUNNER_TEMP/sou68-bwrap-build/bwrap" --sandbox-test-binary "$SOU68_TEST_BINARY" \
            --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/sou98-git" \
            2>&1 | tee "$RUNNER_TEMP/sou98-git.log"
      - name: SOU-107 opt-in local-clone acceptance
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.local_refs_only || inputs.shallow_only || inputs.file_revisions_only || inputs.tracked_symlinks_only)) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-sou107-real-git.py --run --agentfw "$PWD/target/debug/agentfw" \
            --git "$RUNNER_TEMP/sou107-git-source/git" --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou107-git-source/git" | cut -d' ' -f1)" \
            --bwrap "$RUNNER_TEMP/sou68-bwrap-build/bwrap" --sandbox-test-binary "$SOU68_TEST_BINARY" \
            --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/sou107-git" \
            2>&1 | tee "$RUNNER_TEMP/sou107-git.log"
      - name: Required persistent onboarding of the installed Git profile
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.local_refs_only || inputs.shallow_only || inputs.file_revisions_only || inputs.tracked_symlinks_only)) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/onboarding-profile-acceptance.py --profiles git \
