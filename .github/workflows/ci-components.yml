    if: contains(fromJSON(inputs.plan).workflows['mcp-windows-create.yml'], 'linux-read-create-https-regressions')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
