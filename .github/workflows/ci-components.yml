  managed-credential-rotation--managed-credential-rotation:
    if: contains(fromJSON(inputs.plan).workflows['managed-credential-rotation.yml'], 'managed-credential-rotation')
    name: "managed-credential-rotation / Real Console + Agent credential rotation (${{ matrix.backend }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate owned acceptance driver
        run: python3 -m py_compile scripts/managed-credential-rotation-demo.py
      - name: Build real Console and Agent
        run: cargo build --locked -p llm-firewall -p agentfw
      - name: Install isolated PostgreSQL fixture dependency
        if: matrix.backend == 'postgres'
        run: |
          python3 -m venv "$RUNNER_TEMP/sou55-venv"
          "$RUNNER_TEMP/sou55-venv/bin/python" -m pip install cryptography==50.0.2
      - name: Run real-process rotation, retry, revocation and policy acceptance
        env:
          SOU55_BACKEND: ${{ matrix.backend }}
        run: |
          if [ "$SOU55_BACKEND" = postgres ]; then
            "$RUNNER_TEMP/sou55-venv/bin/python" scripts/managed-credential-rotation-demo.py --backend postgres --no-build --output target/sou55-postgres.json
          else
            python3 scripts/managed-credential-rotation-demo.py --backend sqlite --no-build --output target/sou55-sqlite.json
          fi
      - name: Archive exact-source non-secret evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou55-rotation-${{ matrix.backend }}
          path: target/sou55-${{ matrix.backend }}.json
          if-no-files-found: warn
          retention-days: 30

  managed-group-rollout--group-rollout:
    name: "managed-group-rollout / group-rollout"
    if: contains(fromJSON(inputs.plan).workflows['managed-group-rollout.yml'], 'group-rollout')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:ec9f656f17c8b4dfebf49e58cf5c46d493d4846d4ea6d8b85d0637f68ee33bfc
        env:
          POSTGRES_PASSWORD: disposable-admin
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: disposable-admin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install native recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Select the isolated service port
        run: echo "PGPORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"
      - name: Create only owned disposable databases
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rollout_owner LOGIN PASSWORD 'disposable-owner' NOSUPERUSER;
          GRANT pg_monitor TO rollout_owner;
          CREATE DATABASE group_controls OWNER rollout_owner;
          CREATE DATABASE group_source OWNER rollout_owner;
          CREATE DATABASE group_restored OWNER rollout_owner;
          SQL
      - name: Build and run SQLite regressions
        run: |
          cargo build --locked -p llm-firewall -p agentfw
          cargo test --locked -p llm-firewall --test managed_group_rollout --test managed_group_atomic
      - name: Run the same fault and concurrency controls on PostgreSQL
        env:
          SOUP_GROUP_TEST_POSTGRES_URL: postgresql://rollout_owner:disposable-owner@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/group_controls?sslmode=disable
        run: cargo test --locked -p llm-firewall --test managed_group_atomic postgres_atomic_restart_and_concurrency -- --ignored
      - name: Four real Agents with encrypted SQLite recovery
        run: python3 scripts/managed-group-rollout-demo.py --no-build --output target/group-sqlite.json
      - name: Four real Agents with encrypted PostgreSQL recovery
        env:
          SOUP_GROUP_DEMO_DATABASE_URL: postgresql://rollout_owner:disposable-owner@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/group_source?sslmode=disable
          SOUP_GROUP_DEMO_RESTORED_URL: postgresql://rollout_owner:disposable-owner@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/group_restored?sslmode=disable
        run: python3 scripts/managed-group-rollout-demo.py --no-build --backend postgres --output target/group-postgres.json
      - name: Retain sanitized outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-group-rollout
          path: target/group-*.json
          if-no-files-found: warn
          retention-days: 30

  managed-policy-demo--managed-rollout-e2e:
    if: contains(fromJSON(inputs.plan).workflows['managed-policy-demo.yml'], 'managed-rollout-e2e')
    name: "managed-policy-demo / Signed activation and rollback on real Agent"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - name: Verify Rust source formatting
        run: cargo fmt --all -- --check
      - name: Check standalone demonstration syntax
        run: python3 -m py_compile scripts/managed-policy-demo.py
      - name: Verify native policy transition boundaries and managed activation
        run: cargo test --locked -p agentfw --lib
      - name: Build the real Console and Agent
        run: cargo build --locked -p llm-firewall -p agentfw
      - name: Verify signed delivery and runtime rollback
        run: python3 scripts/managed-policy-demo.py --no-build
      - name: Verify live token rotation using actual Console and Agent
        run: |
          python3 -m py_compile scripts/managed-credential-rotation-demo.py
          python3 scripts/managed-credential-rotation-demo.py --backend sqlite --no-build
      - name: Archive non-secret SOU-55 credential witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sou55-sqlite-credential-rotation
          path: target/sou55-managed-credential-rotation.json
          if-no-files-found: warn
      - name: Archive non-secret witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sou30-managed-policy-evidence
          path: target/sou30-managed-rollout-evidence.json
          if-no-files-found: warn

  managed-policy-postgres--managed-postgres:
    if: contains(fromJSON(inputs.plan).workflows['managed-policy-postgres.yml'], 'managed-postgres')
    name: "managed-policy-postgres / PostgreSQL migration and real Agent rollout"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build the unmodified v25 migration fixture
        run: |
          git worktree add --detach "$RUNNER_TEMP/managed-previous" e6f6305de53943d8657f88ffcb5495aa60d17411
          # Keep historical artifacts separate from the current Agent API.
          CARGO_TARGET_DIR="$RUNNER_TEMP/managed-previous-target" cargo build --locked --manifest-path "$RUNNER_TEMP/managed-previous/Cargo.toml" -p llm-firewall --bin llm-firewall
          cp "$RUNNER_TEMP/managed-previous-target/debug/llm-firewall" "$RUNNER_TEMP/previous-console"
      - name: Build real Console and unchanged Agent
        run: |
          cargo build --locked -p llm-firewall -p agentfw
          cargo test --locked -p llm-firewall managed
          python3 -m venv "$RUNNER_TEMP/managed-driver"
          "$RUNNER_TEMP/managed-driver/bin/python" -m pip install cryptography==50.0.2
      - name: Run disposable PostgreSQL migration and rollout witness
        run: '"$RUNNER_TEMP/managed-driver/bin/python" scripts/managed-policy-postgres-demo.py --no-build --previous-gateway "$RUNNER_TEMP/previous-console" --output "$RUNNER_TEMP/sou42-managed-postgres-evidence.json"'
      - name: Verify PostgreSQL live credential rotation
