# Generated by scripts/ci_components.py; edit the original manual workflows.
name: CI component qualification
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      backend:
        type: string
        default: all
      runs:
        type: string
        default: '1'
permissions:
  contents: read
jobs:
  agent-doctor--agent-doctor-linux:
    if: contains(fromJSON(inputs.plan).workflows['agent-doctor.yml'], 'agent-doctor-linux')
    name: "agent-doctor / doctor-linux"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Record exact source
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Focused doctor and privacy unit tests
        run: |
          cargo test --locked -p agentfw --lib doctor
          cargo test --locked -p agentfw --lib support_bundle
      - name: Installed command outside checkout
        run: cargo test --locked -p agentfw --test doctor -- --nocapture
      - name: Warnings denied
        run: cargo clippy --locked -p agentfw --all-targets -- -D warnings

  agent-fleet--fleet:
    if: contains(fromJSON(inputs.plan).workflows['agent-fleet.yml'], 'fleet')
    name: "agent-fleet / Fleet API and real dual-store browser witness"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Retain formatting diagnostics without changing tested source
        run: |
          mkdir -p target/fleet-evidence
          cargo fmt --all
          git diff --binary > target/fleet-evidence/format.patch
          git restore .
          git rev-parse HEAD > target/fleet-evidence/source.txt
      - name: Fleet storage and authorization regressions
        run: cargo test --locked -p llm-firewall --test fleet_projection
      - name: Build real Console and Agent
        run: cargo build --locked -p llm-firewall -p agentfw
      - name: Prepare isolated browser driver
        run: |
          python3 -m venv "$RUNNER_TEMP/fleet-driver"
          "$RUNNER_TEMP/fleet-driver/bin/python" -m pip install playwright==1.55.0 cryptography==50.0.2
          "$RUNNER_TEMP/fleet-driver/bin/python" -m playwright install --with-deps chromium
      - name: SQLite real processes and browser
        run: '"$RUNNER_TEMP/fleet-driver/bin/python" scripts/fleet-console-acceptance.py --backend sqlite --output target/fleet-evidence/sqlite'
      - name: PostgreSQL TLS real processes and browser
        run: '"$RUNNER_TEMP/fleet-driver/bin/python" scripts/fleet-console-acceptance.py --backend postgres --output target/fleet-evidence/postgres'
      - name: Managed Agent rollout panel browser regressions
        run: '"$RUNNER_TEMP/fleet-driver/bin/python" -B -m unittest scripts/tests/test_console_rollout_browser.py -v'
      - name: Browser rollout to one pilot and two real Agents over HTTPS
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/fleet-driver/bin/python" -B scripts/console-rollout-acceptance.py --no-build --output "$RUNNER_TEMP/rollout"
          status=$?
          cp -r "$RUNNER_TEMP/rollout" target/fleet-evidence/rollout
          exit $status
      - name: Require clean formatting
        run: test ! -s target/fleet-evidence/format.patch
      - name: Retain sanitized fleet evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-fleet-evidence
          path: target/fleet-evidence/
          retention-days: 30
          if-no-files-found: error

  agent-windows-onboarding--standard-user-onboarding:
    name: "agent-windows-onboarding / standard-user-onboarding"
    if: contains(fromJSON(inputs.plan).workflows['agent-windows-onboarding.yml'], 'standard-user-onboarding')
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the native Agent and focused tests
        shell: pwsh
        run: |
          cargo build --locked -p agentfw --bin agentfw
          if ($LASTEXITCODE -ne 0) { throw 'Agent build failed' }
          cargo test --locked -p agentfw --lib --no-run --message-format=json > "$env:RUNNER_TEMP/onboarding-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Native test build failed' }
          $tests = Get-Content "$env:RUNNER_TEMP/onboarding-build.jsonl" |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'agentfw' -and $_.profile.test -and $_.executable }
          if (@($tests).Count -ne 1) { throw 'Unique native test binary required' }
          "ONBOARDING_TEST_BINARY=$($tests.executable)" | Add-Content $env:GITHUB_ENV
      - name: Run onboarding under a disposable standard account
        shell: pwsh
        run: |
          ./scripts/ci-windows-self-test.ps1 -AgentBinary ./target/debug/agentfw.exe `
            -TestBinary $env:ONBOARDING_TEST_BINARY -PythonBinary (Get-Command python).Source `
            -OutputDirectory "$env:RUNNER_TEMP/onboarding-results" -Commit ((git rev-parse HEAD).Trim()) `
            -AcceptanceKind onboarding
          if ($LASTEXITCODE -ne 0) { throw 'Native onboarding acceptance failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-windows-onboarding
          path: ${{ runner.temp }}/onboarding-results/
          if-no-files-found: error

  agent-windows-self-test--standard-user-self-test:
    name: "agent-windows-self-test / standard-user-self-test"
    if: contains(fromJSON(inputs.plan).workflows['agent-windows-self-test.yml'], 'standard-user-self-test')
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build native Agent and focused tests
        shell: pwsh
        run: |
          cargo build --locked -p agentfw --bin agentfw
          if ($LASTEXITCODE -ne 0) { throw 'Agent build failed' }
          cargo test --locked -p agentfw --lib --no-run --message-format=json > "$env:RUNNER_TEMP/self-test-build.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Native test build failed' }
          $tests = Get-Content "$env:RUNNER_TEMP/self-test-build.jsonl" |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'agentfw' -and $_.profile.test -and $_.executable }
          if (@($tests).Count -ne 1) { throw 'Unique native test binary required' }
          "SELF_TEST_BINARY=$($tests.executable)" | Add-Content $env:GITHUB_ENV
      - name: Verify platform-scoped CLI on the normal Windows stack
        shell: pwsh
        run: |
          cargo test --locked -p agentfw --bin agentfw archive_parser_matches_supported_platform -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Platform-scoped CLI regression failed' }
      - name: Exercise installed Agent under a disposable standard account
        shell: pwsh
        run: |
          ./scripts/ci-windows-self-test.ps1 -AgentBinary ./target/debug/agentfw.exe `
            -TestBinary $env:SELF_TEST_BINARY -PythonBinary (Get-Command python).Source `
            -OutputDirectory "$env:RUNNER_TEMP/self-test-results" -Commit ((git rev-parse HEAD).Trim())
          if ($LASTEXITCODE -ne 0) { throw 'Native standard-user acceptance failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-windows-self-test
          path: ${{ runner.temp }}/self-test-results/
          if-no-files-found: error

  classifier-runtime-windows--native-windows-classifier-runtime:
    name: "classifier-runtime-windows / native-windows-classifier-runtime"
    if: contains(fromJSON(inputs.plan).workflows['classifier-runtime-windows.yml'], 'native-windows-classifier-runtime')
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Prerequisites and pinned classifier bytes (a missing prerequisite fails the job)
        id: prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $IsWindows) { throw 'Native Windows is required' }
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') { throw 'x86_64 is required' }
          $python = (& python -I -c 'import sys; print(sys.executable)').Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $python)) { throw 'A local CPython is required' }
          if ($python -match 'WindowsApps') { throw 'A Microsoft Store alias is not a supported interpreter' }
          "AGENTFW_TEST_PYTHON=$python" | Add-Content $env:GITHUB_ENV
          $drive = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).PSDrive.Name
          $fs = (Get-Volume -DriveLetter $drive).FileSystem
          if ($fs -ne 'NTFS') { throw "Local NTFS is required, found $fs" }
          $pins = @{
            'rule_baseline/rule_baseline.py' = 'd2d43d6f67719921592bba4d52e73c0f0543c5b1f1b24c75b88e8d964676aebd'
            'rule_baseline/rev2/rule_baseline.py' = 'd0b4fc02720ee5ff38dec73d5992c6bdee9eda8595282e33015e60d07ce33ea5'
          }
          foreach ($path in $pins.Keys) {
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $pins[$path]) { throw "$path does not match its pinned digest ($actual)" }
          }
          @{ commit = (& git rev-parse HEAD).Trim(); rustc = (& rustc --version); python = $python
             python_version = (& python -I -c 'import sys; print(sys.version.split()[0])').Trim()
             python_sha256 = (Get-FileHash -LiteralPath $python -Algorithm SHA256).Hash.ToLowerInvariant()
             os = [Environment]::OSVersion.VersionString; filesystem = $fs } |
            ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/sou81-identities.json"
      - name: Native Windows package lifecycle, ACL, junction, tamper and worker tests
        shell: pwsh
        run: |
          & cargo test --locked -p agentfw --test classifier_runtime_windows -- --test-threads=1 2>&1 |
              Tee-Object -FilePath "$env:RUNNER_TEMP/sou81-native.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows classifier runtime tests failed' }
          $log = Get-Content "$env:RUNNER_TEMP/sou81-native.log" -Raw
          if ($log -notmatch 'test result: ok\. 20 passed; 0 failed; 1 ignored;') {
              throw 'All 20 positive native tests must run and pass (only the latency measurement is opt-in)'
          }
      - name: Real collector with the installed package on Windows
        shell: pwsh
        run: |
          & cargo test --locked -p agentfw --test mcp_admission sou64 -- --test-threads=1 2>&1 |
              Tee-Object -FilePath "$env:RUNNER_TEMP/sou81-collector.log"
          if ($LASTEXITCODE -ne 0) { throw 'Collector tests failed' }
          $log = Get-Content "$env:RUNNER_TEMP/sou81-collector.log" -Raw
          if ($log -notmatch 'test result: ok\. 2 passed; 0 failed; 0 ignored;') {
              throw 'Both installed-package collector tests must run and pass'
          }
      - name: Cold and warm latency distribution (deadlines and retries unchanged)
        shell: pwsh
        run: |
          & cargo test --locked -p agentfw --test classifier_runtime_windows -- --ignored --nocapture latency 2>&1 |
              Tee-Object -FilePath "$env:RUNNER_TEMP/sou81-latency.log"
          if ($LASTEXITCODE -ne 0) { throw 'Latency measurement failed: a cold start exceeded its unchanged deadline or a call failed' }
      - name: Production collector from a clean installed directory
        shell: pwsh
        run: |
          & cargo build --locked -p agentfw --bin agentfw
          if ($LASTEXITCODE -ne 0) { throw 'Agent build failed' }
          & python -I scripts/classifier-runtime-windows-acceptance.py --require-windows `
              --python $env:AGENTFW_TEST_PYTHON --agentfw target/debug/agentfw.exe `
              --out "$env:RUNNER_TEMP/sou81-acceptance.json" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/sou81-acceptance.log"
          if ($LASTEXITCODE -ne 0) { throw 'Clean-directory acceptance failed' }
      - name: Retain identities, logs and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou81-native-windows-classifier-runtime-evidence
          path: |
            ${{ runner.temp }}/sou81-*.json
            ${{ runner.temp }}/sou81-*.log
          if-no-files-found: warn
          retention-days: 30

  benchmark--agent-scorecard:
    if: contains(fromJSON(inputs.plan).workflows['benchmark.yml'], 'agent-scorecard')
    name: "benchmark / Agent security scorecard"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Verify historical import and free runtime adapter contracts
        run: python3 -m unittest discover -s scripts/benchmarks -p 'test_*.py' -v
      - name: Run reproducible agent benchmark
        shell: bash
        run: |
          cargo run --locked --release -p soup-wall-bench -- \
            --agent crates/bench/corpora/agent_sessions.jsonl \
            --agent-out agent-evaluation.json \
            > agent-security-scorecard.md
          diff -u docs/benchmarks/agent-security-scorecard.generated.md agent-security-scorecard.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-security-scorecard
          path: |
            agent-security-scorecard.md
            agent-evaluation.json
          if-no-files-found: ignore
          retention-days: 90

  ci-builds--agent-default-ubuntu2404:
    name: "ci-builds / agent-default-ubuntu2404"
    if: contains(fromJSON(inputs.plan).workflows['ci-builds.yml'], 'agent-default-ubuntu2404')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOU166_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 }}
      producer_attempt: ${{ steps.build.outputs.producer_attempt }}
      image_version: ${{ steps.build.outputs.image_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Fetch exact locked dependency sources
        run: cargo fetch --locked
      - name: Build finite CI-only executable and native harnesses
        id: build
        run: python3 -B scripts/ci_qualification_build.py build --output "$RUNNER_TEMP/sou166-producer"
      - name: Publish immutable current-run raw archive
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/sou166-producer/${{ steps.build.outputs.archive_name }}
          archive: false
          if-no-files-found: error
          retention-days: 3
      - name: Retain bounded build diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sou166-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sou166-producer/*.json
            ${{ runner.temp }}/sou166-producer/*.jsonl
          if-no-files-found: warn
          retention-days: 30

  console-recovery--owned-recovery:
    name: "console-recovery / owned-recovery"
    if: contains(fromJSON(inputs.plan).workflows['console-recovery.yml'], 'owned-recovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/recovery-build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install established recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client-16
          python3 -m venv "$RUNNER_TEMP/recovery-python"
          "$RUNNER_TEMP/recovery-python/bin/python" -m pip install cryptography==50.0.2
      - name: Private PostgreSQL fixture certificate ownership
        run: |
          docker pull --platform linux/amd64 postgres@sha256:ec9f656f17c8b4dfebf49e58cf5c46d493d4846d4ea6d8b85d0637f68ee33bfc
          SOUP_TEST_PRIVATE_POSTGRES_TLS=1 python3 -m unittest discover -s scripts/tests -p 'test_keycloak_oidc_acceptance.py' -v
      - name: Build Console, Agent and explicit fixtures
        id: binaries
        run: |
          cargo build --locked -p llm-firewall --bin llm-firewall --example console-recovery-fixture -p agentfw --bin agentfw
          cargo test --locked -p llm-firewall --example console-recovery-fixture
          cargo test --locked -p llm-firewall --lib --no-run --message-format=json > "$RUNNER_TEMP/recovery-build.jsonl"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          binaries = [m['executable'] for line in Path(os.environ['RUNNER_TEMP'], 'recovery-build.jsonl').read_text().splitlines()
                      if (m := json.loads(line)).get('reason') == 'compiler-artifact'
                      and m.get('executable') and m.get('profile', {}).get('test')]
          assert len(binaries) == 1
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('outbox=' + binaries[0], file=output)
          PYCODE
      - name: Recovery regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_console_recovery*.py' -v
      - name: Restore SQLite and deliver a new signed policy
        run: |
          "$RUNNER_TEMP/recovery-python/bin/python" scripts/console-recovery-acceptance.py --run --backend sqlite \
            --output "$RUNNER_TEMP/recovery-sqlite.json" \
            --console-binary "$CARGO_TARGET_DIR/debug/llm-firewall" \
            --agent-binary "$CARGO_TARGET_DIR/debug/agentfw" \
            --fixture-helper "$CARGO_TARGET_DIR/debug/examples/console-recovery-fixture" \
            --webhook-driver "$PWD/scripts/console-recovery-webhook-fixture.py" \
            --outbox-test-binary '${{ steps.binaries.outputs.outbox }}'
      - name: Restore PostgreSQL and deliver a new signed policy
        run: |
          PATH="/usr/lib/postgresql/16/bin:$PATH" "$RUNNER_TEMP/recovery-python/bin/python" scripts/console-recovery-acceptance.py --run --backend postgres \
            --output "$RUNNER_TEMP/recovery-postgres.json" \
            --console-binary "$CARGO_TARGET_DIR/debug/llm-firewall" \
            --agent-binary "$CARGO_TARGET_DIR/debug/agentfw" \
            --fixture-helper "$CARGO_TARGET_DIR/debug/examples/console-recovery-fixture" \
            --webhook-driver "$PWD/scripts/console-recovery-webhook-fixture.py" \
            --outbox-test-binary '${{ steps.binaries.outputs.outbox }}'
      - name: Retain sanitized outcomes only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-recovery-outcomes
          path: ${{ runner.temp }}/recovery-*.json
          if-no-files-found: warn
          retention-days: 30

  gate-ci--validate-gate-matrix:
    name: "gate-ci / validate-gate-matrix"
    if: contains(fromJSON(inputs.plan).workflows['gate-ci.yml'], 'validate-gate-matrix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: SOU-26 Positive and Failure Matrix
        shell: bash
        run: |
          mkdir -p tests
          cd tests
          
          H="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          MANIFEST="candidate-manifest.json"
          cat <<EOF > "$MANIFEST"
          {
            "tag": "v0.3.0",
            "source_sha": "dummy_sha",
            "run_attempt": "1",
            "checksums": [
              "$H  soup-wall-v0.3.0-x86_64-unknown-linux-gnu.tar.gz",
              "$H  soup-wall-v0.3.0-aarch64-apple-darwin.tar.gz",
              "$H  soup-wall-v0.3.0-x86_64-apple-darwin.tar.gz",
              "$H  soup-wall-v0.3.0-x86_64-pc-windows-msvc.zip",
              "$H  agentfw.cdx.json",
              "$H  llm-firewall.cdx.json",
              "$H  soup-wall-adapter.cdx.json",
              "$H  soup-wall-agent.cdx.json",
              "$H  soup-wall-bench.cdx.json",
              "$H  soup-wall-core.cdx.json",
              "$H  soup-wall-image.tar"
            ]
          }
          EOF
          
          chmod +x ../scripts/validate_candidate.sh

          # Setup base valid record
          cat <<EOF > rec_good.json
          {"decision": "approved", "run_id": "123", "run_attempt": "1", "artifact_id": "999", "artifact_digest": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", "source_sha": "dummy_sha", "checksums": $(jq '.checksums' "$MANIFEST"), "evidence_ref": "https://ref", "gates": {"product": "passed", "operator": "passed", "license": "passed"}}
          EOF

          # Setup base valid API context
          API_GOOD='{"run_id":"123","run_attempt":"1","workflow_path":".github/workflows/release.yml","event":"push","repository":"SoupTeam/soup-wall","prepare_job_status":"success","artifact_id":"999","status":"completed","conclusion":"success","head_sha":"dummy_sha","head_branch":"v0.3.0"}'
          echo "$API_GOOD" > api_good.json

          echo "--- Test 1: Missing approval file ---"
          if ../scripts/validate_candidate.sh "missing.json" "$MANIFEST" "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi

          echo "--- Test 2: Decision rejected ---"
          jq '.decision = "rejected"' rec_good.json > rec_rej.json
          if ../scripts/validate_candidate.sh rec_rej.json "$MANIFEST" "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi

          echo "--- Test 3: Missing product gate ---"
          jq 'del(.gates.product)' rec_good.json > rec_missing_gate.json
          if ../scripts/validate_candidate.sh rec_missing_gate.json "$MANIFEST" "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi

          echo "--- Test 4: Mismatched tag/commit (Handoff Integrity) ---"
          if ../scripts/validate_candidate.sh rec_good.json "$MANIFEST" "v0.4.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi
          if ../scripts/validate_candidate.sh rec_good.json "$MANIFEST" "v0.3.0" "bad_checkout_sha" api_good.json full 2>/dev/null; then exit 1; fi

          echo "--- Test 5: Duplicated artifact ---"
          jq '.checksums[0] = .checksums[1]' "$MANIFEST" > man_dup.json
          jq --argjson c "$(jq '.checksums' man_dup.json)" '.checksums = $c' rec_good.json > rec_dup.json
          if ../scripts/validate_candidate.sh rec_dup.json man_dup.json "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi

          echo "--- Test 6: Suffix alias injection (P1) ---"
          jq '.checksums[10] = "'$H'  unpublished-soup-wall-image.tar"' "$MANIFEST" > man_suffix.json
          jq --argjson c "$(jq '.checksums' man_suffix.json)" '.checksums = $c' rec_good.json > rec_suffix.json
          if ../scripts/validate_candidate.sh rec_suffix.json man_suffix.json "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi

          echo "--- Test 7: Path traversal injection (P1) ---"
          jq '.checksums[10] = "'$H'  ../soup-wall-image.tar"' "$MANIFEST" > man_trav.json
          jq --argjson c "$(jq '.checksums' man_trav.json)" '.checksums = $c' rec_good.json > rec_trav.json
          if ../scripts/validate_candidate.sh rec_trav.json man_trav.json "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi

          echo "--- Test 8: Extra unapproved files (P1) ---"
          jq '.checksums += ["'$H'  extra-file.txt"]' "$MANIFEST" > man_extra.json
          jq --argjson c "$(jq '.checksums' man_extra.json)" '.checksums = $c' rec_good.json > rec_extra.json
          if ../scripts/validate_candidate.sh rec_extra.json man_extra.json "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi

          echo "--- Test 9: Actual bytes mismatch (Artifact Binding) ---"
          jq -r '.checksums[]' "$MANIFEST" > APPROVED_SUMS
          touch soup-wall-v0.3.0-x86_64-unknown-linux-gnu.tar.gz
          if sha256sum --strict -c APPROVED_SUMS 2>/dev/null; then exit 1; fi

          echo "--- Test 10: Successful exact-candidate ---"
          touch soup-wall-v0.3.0-aarch64-apple-darwin.tar.gz \
                soup-wall-v0.3.0-x86_64-apple-darwin.tar.gz \
                soup-wall-v0.3.0-x86_64-pc-windows-msvc.zip \
                agentfw.cdx.json \
                llm-firewall.cdx.json \
                soup-wall-adapter.cdx.json \
                soup-wall-agent.cdx.json \
                soup-wall-bench.cdx.json \
                soup-wall-core.cdx.json \
                soup-wall-image.tar
          ../scripts/validate_candidate.sh rec_good.json "$MANIFEST" "v0.3.0" "dummy_sha" api_good.json full
          
          echo "--- Test 11: Embedded CR/LF injection (P1) ---"
          EVIL_STR="$H  soup-wall-image.tar\n$H  extra-owned.txt"
          jq --arg evil "$EVIL_STR" '.checksums[10] = $evil' "$MANIFEST" > man_embed.json
          jq --argjson c "$(jq -c '.checksums' man_embed.json)" '.checksums = $c' rec_good.json > rec_embed.json
          touch extra-owned.txt
          if ../scripts/validate_candidate.sh rec_embed.json man_embed.json "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi
          rm -f extra-owned.txt

          echo "--- Test 12: Missing or stale run_attempt in record (P2) ---"
          jq 'del(.run_attempt)' rec_good.json > rec_no_attempt.json
          if ../scripts/validate_candidate.sh rec_no_attempt.json /dev/null "v0.3.0" "dummy_sha" api_good.json api-only 2>/dev/null; then exit 1; fi

          echo "--- Test 13: Stale attempt mismatch between record and API (P2) ---"
          jq '.run_attempt = "2"' rec_good.json > rec_attempt2.json
          if ../scripts/validate_candidate.sh rec_attempt2.json /dev/null "v0.3.0" "dummy_sha" api_good.json api-only 2>/dev/null; then exit 1; fi

          echo "--- Test 14: Skipped prepare job negative (P2) ---"
          echo "$API_GOOD" | jq '.prepare_job_status = "skipped"' > api_skip.json
          if ../scripts/validate_candidate.sh rec_good.json /dev/null "v0.3.0" "dummy_sha" api_skip.json api-only 2>/dev/null; then exit 1; fi

          echo "--- Test 15: Failed prepare job negative (P2) ---"
          echo "$API_GOOD" | jq '.prepare_job_status = "failure"' > api_fail.json
          if ../scripts/validate_candidate.sh rec_good.json /dev/null "v0.3.0" "dummy_sha" api_fail.json api-only 2>/dev/null; then exit 1; fi

          echo "--- Test 16: Missing prepare job negative (P2) ---"
          echo "$API_GOOD" | jq '.prepare_job_status = "missing"' > api_missing.json
          if ../scripts/validate_candidate.sh rec_good.json /dev/null "v0.3.0" "dummy_sha" api_missing.json api-only 2>/dev/null; then exit 1; fi

          echo "--- Test 17: Wrong Artifact ID negative (P2) ---"
          echo "$API_GOOD" | jq '.artifact_id = "777"' > api_wrong_art.json
          if ../scripts/validate_candidate.sh rec_good.json /dev/null "v0.3.0" "dummy_sha" api_wrong_art.json api-only 2>/dev/null; then exit 1; fi
          
          echo "--- Test 18: Missing API context fails closed (P2) ---"
          if ../scripts/validate_candidate.sh rec_good.json /dev/null "v0.3.0" "dummy_sha" "" api-only 2>/dev/null; then exit 1; fi

          echo "--- Test 19: API run not completed successfully (P2) ---"
          echo "$API_GOOD" | jq '.status = "in_progress"' > api_prog.json
          if ../scripts/validate_candidate.sh rec_good.json /dev/null "v0.3.0" "dummy_sha" api_prog.json api-only 2>/dev/null; then exit 1; fi
          
          echo "--- Test 20: API head_branch mismatch (P2) ---"
          echo "$API_GOOD" | jq '.head_branch = "v0.9.0"' > api_branch.json
          if ../scripts/validate_candidate.sh rec_good.json /dev/null "v0.3.0" "dummy_sha" api_branch.json api-only 2>/dev/null; then exit 1; fi
          
          echo "--- Test 21: Missing artifact_digest fails closed (P2) ---"
          jq 'del(.artifact_digest)' rec_good.json > rec_no_digest.json
          if ../scripts/validate_candidate.sh rec_no_digest.json /dev/null "v0.3.0" "dummy_sha" api_good.json api-only 2>/dev/null; then exit 1; fi

          echo "--- Test 22: Manifest attempt must match the approved API attempt ---"
          for attempt in 0 2 null; do
            jq --argjson attempt "$attempt" '.run_attempt = $attempt' "$MANIFEST" > man_stale_attempt.json
            if ../scripts/validate_candidate.sh rec_good.json man_stale_attempt.json "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi
          done
          jq 'del(.run_attempt)' "$MANIFEST" > man_missing_attempt.json
          if ../scripts/validate_candidate.sh rec_good.json man_missing_attempt.json "v0.3.0" "dummy_sha" api_good.json full 2>/dev/null; then exit 1; fi

          echo "All SOU-26 validator matrix tests passed successfully!"

  gateway-sdk--official-sdk:
    name: "gateway-sdk / official-sdk"
    if: contains(fromJSON(inputs.plan).workflows['gateway-sdk.yml'], 'official-sdk')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install hash-pinned official SDKs
        run: python -m pip install --require-hashes -r scripts/requirements-sou92.txt
      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou92-source.txt"
          rustc --version > "$RUNNER_TEMP/sou92-rust.txt"
          cargo build --locked -p llm-firewall --bin llm-firewall --message-format=json > "$RUNNER_TEMP/sou92-build.jsonl"
          sha256sum target/debug/llm-firewall > "$RUNNER_TEMP/sou92-binary.txt"
      - name: Evidence grading controls
        run: python -B -m unittest discover -s scripts/tests -p test_sou92_sdk.py -v
      - name: Actual SDKs through Gateway with independent effects
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/verify-sou92-sdk.py --run --gateway "$PWD/target/debug/llm-firewall" \
            --expected-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/sou92-results.json" \
            2>&1 | tee "$RUNNER_TEMP/sou92-driver.log"
      - name: Retain complete and interrupted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou92-sdk-evidence
          path: ${{ runner.temp }}/sou92-*
          if-no-files-found: error
          retention-days: 30

  identity-sandbox--vendor-driver-safety:
    if: contains(fromJSON(inputs.plan).workflows['identity-sandbox.yml'], 'vendor-driver-safety')
    name: "identity-sandbox / Keycloak driver offline safety"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Prepare minimal offline test dependencies
        run: |
          python3 -m venv target/keycloak-driver-safety
          target/keycloak-driver-safety/bin/python -m pip install requests==2.34.2
      - name: Verify driver isolation and failure evidence without starting an IdP
        run: target/keycloak-driver-safety/bin/python -m unittest discover -s scripts/tests -p 'test_keycloak_saml_acceptance.py' -v

  identity-sandbox--local-idp-evidence:
    if: contains(fromJSON(inputs.plan).workflows['identity-sandbox.yml'], 'local-idp-evidence')
    name: "identity-sandbox / OIDC SAML SCIM sandbox fixtures"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux sandbox runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Run local identity fixtures
        shell: pwsh
