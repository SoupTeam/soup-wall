      - name: Build exact production runtime
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou76-source.txt"
          rustc --version > "$RUNNER_TEMP/sou76-rust.txt"
          python3 --version > "$RUNNER_TEMP/sou76-python.txt"
