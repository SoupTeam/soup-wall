          retention-days: 30

  managed-policy-tls--agent-https-rollout:
    if: contains(fromJSON(inputs.plan).workflows['managed-policy-tls.yml'], 'agent-https-rollout')
    name: "managed-policy-tls / Real Agent verified HTTPS rollout and rollback"
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Prepare accepted original MCP runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config zlib1g-dev
          mkdir "$RUNNER_TEMP/sou82-node" "$RUNNER_TEMP/sou82-git" "$RUNNER_TEMP/sou82-bwrap"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz --output "$RUNNER_TEMP/sou82-node.tar.xz"
          printf '%s  %s\n' 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37 "$RUNNER_TEMP/sou82-node.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou82-node.tar.xz" -C "$RUNNER_TEMP/sou82-node" --strip-components=1 --no-same-owner --no-same-permissions
          curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.51.2.tar.xz --output "$RUNNER_TEMP/sou82-git.tar.xz"
          printf '%s  %s\n' 233d7143a2d58e60755eee9b76f559ec73ea2b3c297f5b503162ace95966b4e3 "$RUNNER_TEMP/sou82-git.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou82-git.tar.xz" -C "$RUNNER_TEMP/sou82-git" --strip-components=1 --no-same-owner --no-same-permissions
          make -C "$RUNNER_TEMP/sou82-git" -j2 NO_CURL=YesPlease NO_EXPAT=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_OPENSSL=YesPlease git
