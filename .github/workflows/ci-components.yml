    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Prepare locked sources for explicit source mode
        if: env.SOU166_MODE == 'source'
        run: cargo fetch --locked
      - name: Initialize private current-job artifact locations
        run: |
          printf 'SOU166_BUNDLE=%s/sou166-selected\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SOU166_CONTEXT=%s/sou166-context.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require successful explicit producer before download
        if: env.SOU166_MODE == 'shared'
        run: python3 -B scripts/ci_qualification_build.py guard
      - name: Download only the immutable current-run producer artifact
        if: env.SOU166_MODE == 'shared'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ env.SOU166_ARTIFACT_ID }}
          path: ${{ runner.temp }}/sou166-download
          skip-decompress: true
          digest-mismatch: error
      - name: Independently verify provenance, tuple and every executable byte
        if: env.SOU166_MODE == 'shared'
        run: |
          python3 -B scripts/ci_qualification_build.py prepare \
            --archive "$RUNNER_TEMP/sou166-download/$SOU166_ARCHIVE_NAME" \
            --output "$SOU166_BUNDLE" --context "$SOU166_CONTEXT"
      - name: Build the exact candidate
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou54-source.txt"
          rustc --version > "$RUNNER_TEMP/sou54-rust.txt"
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-build.json" -- build --locked --offline -p agentfw --bin agentfw > "$RUNNER_TEMP/sou54-build.jsonl"
          sha256sum "$(python3 -B scripts/ci_qualification_build.py binary)" > "$RUNNER_TEMP/sou54-binary.txt"
      - name: Native authority, publication and effect-accounting regressions
        shell: bash
        run: |
          set -o pipefail
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-test-0.json" -- test --locked --offline -p agentfw --lib create_file -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-unit.log"
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-test-1.json" -- test --locked --offline -p agentfw --test native_endpoint create_file_v2 -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-router.log"
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-test-2.json" -- test --locked --offline -p agentfw --lib sou54_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-composition.log"
          python3 -B scripts/ci_qualification_build.py cargo --output "$RUNNER_TEMP/sou166-create-test-3.json" -- test --locked --offline -p agentfw --lib mcp::input::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou54-native-input.log"
      - name: Require nonempty native boundary evidence
        run: |
          python3 - <<'PYCODE'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('sou54_probe', 'scripts/verify-sou54-create-file.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          for name in ('unit', 'router', 'composition', 'input'):
              text = Path(os.environ['RUNNER_TEMP'], 'sou54-native-' + name + '.log').read_text()
              assert probe.native_test_passed({'exit_code': 0, 'stdout': text}), name + ': no verified passed native tests'
          PYCODE
      - name: Evidence grading controls
        run: python3 -m unittest discover -s scripts/tests -p 'test_sou54_create*.py' -v
      - name: Real enforcing daemon, stdio and independent file witnesses
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify-sou54-create-file.py --run --repo "$PWD" \
            --agentfw "$(python3 -B scripts/ci_qualification_build.py binary)" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou54-create-file-results.json" 2>&1 | tee "$RUNNER_TEMP/sou54-driver.log"
      - name: Actual native authority substitution, concurrency and replay races
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify-sou54-create-races.py --run --repo "$PWD" \
            --agentfw "$(python3 -B scripts/ci_qualification_build.py binary)" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou54-create-races-results.json" 2>&1 | tee "$RUNNER_TEMP/sou54-races.log"
      - name: Retain sanitized outcomes and source/build witnesses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou54-create-file-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sou54-*.json
            ${{ runner.temp }}/sou54-*.jsonl
            ${{ runner.temp }}/sou54-*.txt
            ${{ runner.temp }}/sou54-*.log
            ${{ runner.temp }}/sou166-*.json
            ${{ runner.temp }}/sou166-*.log
          if-no-files-found: warn
          retention-days: 30

  mcp-create-file--linux-replace-file:
    name: "mcp-create-file / linux-replace-file"
    if: contains(fromJSON(inputs.plan).workflows['mcp-create-file.yml'], 'linux-replace-file') && github.event.inputs.edit_only != 'true' && github.event.inputs.comparison_only != 'true' && github.event.inputs.build_mode != 'shared'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Prepare isolated offline qualification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          cargo fetch --locked
          mkdir -p "$RUNNER_TEMP/sou159-scratch"/{home,cargo-home,tmp,faults}
          ln -s "$HOME/.cargo/registry" "$RUNNER_TEMP/sou159-scratch/cargo-home/registry"
          git rev-parse HEAD > "$RUNNER_TEMP/sou159-scratch/source.txt"
      - name: Read-only source and private loopback runtime qualification
        shell: bash
        run: |
          set -euo pipefail
          task_scratch="$RUNNER_TEMP/sou159-scratch"
          # Trusted sandbox setup, then drop ALL capabilities and the root UID.
          # No host sysctl, cgroup delegation or shared-runner setting changes.
          sudo -- bwrap --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --bind "$task_scratch" "$task_scratch" \
            --proc /proc --dev /dev --cap-drop ALL \
            --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP \
            --chdir / /usr/bin/setpriv \
            --reuid "$(id -u)" --regid "$(id -g)" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            /usr/bin/env -i \
            PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" RUSTUP_TOOLCHAIN=1.99.1 \
            HOME="$task_scratch/home" CARGO_HOME="$task_scratch/cargo-home" \
            CARGO_TARGET_DIR="$task_scratch/target" TMPDIR="$task_scratch/tmp" \
            SOU159_SCRATCH="$task_scratch" SOU159_SOURCE="$GITHUB_WORKSPACE" CARGO_BUILD_JOBS=4 \
            /bin/bash -euo pipefail <<'BASH'
          cd "$SOU159_SOURCE"
          cargo build --locked --offline -p agentfw --bin agentfw
          cargo test --locked --offline -p agentfw --lib replace_file -- --nocapture
          cargo test --locked --offline -p agentfw --lib resource::replacement -- --nocapture
          cargo test --locked --offline -p agentfw --test replace_file -- --nocapture
          cargo test --locked --offline -p agentfw --lib create_file -- --nocapture
          cargo clippy --locked --offline -p agentfw --all-targets -- -D warnings
          cargo fmt --all --check
          python3 -B -m unittest discover -s scripts/tests -p 'test_sou159*.py' -v
          gcc -shared -fPIC -Wall -Wextra -Werror -DFAULT=1 scripts/fixtures/sou159_faults.c -ldl -o "$SOU159_SCRATCH/faults/stage-fault.so"
          gcc -shared -fPIC -Wall -Wextra -Werror -DFAULT=2 scripts/fixtures/sou159_faults.c -ldl -o "$SOU159_SCRATCH/faults/publication-fault.so"
          gcc -shared -fPIC -Wall -Wextra -Werror -DFAULT=3 scripts/fixtures/sou159_faults.c -ldl -o "$SOU159_SCRATCH/faults/committed-error.so"
          sha256sum "$CARGO_TARGET_DIR/debug/agentfw" > "$SOU159_SCRATCH/binary.txt"
          python3 -B scripts/verify-sou159-replace-file.py --run --agentfw "$CARGO_TARGET_DIR/debug/agentfw" \
            --fault-libraries "$SOU159_SCRATCH/faults" --output "$SOU159_SCRATCH/runtime.json"
          BASH
      - name: Retain current-source finite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou159-replacement-evidence
          path: |
            ${{ runner.temp }}/sou159-scratch/source.txt
            ${{ runner.temp }}/sou159-scratch/binary.txt
            ${{ runner.temp }}/sou159-scratch/runtime.json
          if-no-files-found: warn
          retention-days: 30

