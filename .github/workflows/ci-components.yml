    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ask_series != '' && 180 || github.event_name == 'workflow_dispatch' && github.event.inputs.ask_latency_baseline_sha != '' && 140 || github.event_name == 'workflow_dispatch' && github.event.inputs.prepared_switch_lifecycle == 'true' && 105 || 65 }}
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
      PILOT_CAPACITY_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.capacity_only == 'true' && '1' || '0' }}
      PILOT_COORDINATED_UPDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.coordinated_update_only == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ github.event.inputs.coordinated_update_only == 'true' && '0' || '1' }}
          persist-credentials: ${{ github.event.inputs.coordinated_update_only != 'true' }}
      - name: Validate Git stage-reuse qualification dispatch
        if: github.event.inputs.stage_reuse_only == 'true'
        env:
          NATIVE_ONLY: ${{ github.event.inputs.native_preparation_only }}
          CONCURRENT_PREPARATION: ${{ github.event.inputs.preparation_concurrency }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NATIVE_ONLY" == true && "$CONCURRENT_PREPARATION" != true ]]
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Validate focused operator qualification
        if: github.event.inputs.operator_results_only == 'true'
        shell: bash
        env:
          PREPARATION_ONLY: ${{ github.event.inputs.native_preparation_only }}
          MATCHED_ONLY: ${{ github.event.inputs.matched_development_only }}
          PROJECT_ONLY: ${{ github.event.inputs.existing_project_only }}
          AUDIT_ONLY: ${{ github.event.inputs.audit_retention_only }}
          STORAGE_ONLY: ${{ github.event.inputs.storage_recovery_only }}
          BASELINE: ${{ github.event.inputs.ask_latency_baseline_sha }}
        run: |
          set -euo pipefail
          [[ "$PREPARATION_ONLY" != true && "$MATCHED_ONLY" != true && "$PROJECT_ONLY" != true && "$AUDIT_ONLY" != true && "$STORAGE_ONLY" != true && -z "$BASELINE" ]]
          python3 -B -m unittest discover -s scripts/tests -p test_operator_results.py -v
      - name: Validate focused update qualification
        if: github.event.inputs.coordinated_update_only == 'true'
        shell: bash
        env:
          DISPATCH_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os
          inputs = json.loads(os.environ['DISPATCH_INPUTS'])
          assert inputs.get('stability_mode', 'off') == 'off'
          assert all(value in ('', 'false') for key, value in inputs.items()
                     if key not in {'coordinated_update_only', 'stability_mode'})
          PY
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_update.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_prepared_qualification_coverage.py -v
          python3 -B - <<'PY'
          import json, os, stat, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import pilot_update as update
          selected = Path('/usr/bin/python3.12')
          paths = {'development_interpreter': Path(sys.executable).resolve(),
                   'selected_interpreter': selected, 'checkout': Path.cwd(),
                   'scratch': Path(os.environ['RUNNER_TEMP'])}
          report = {'operator_uid': os.getuid(), 'os_release': Path('/etc/os-release').read_text(),
                    'kernel': os.uname().release}
          for role, path in paths.items():
              parents = [path if path.is_dir() else path.parent, *path.parents]
              unsafe = []
              for parent in dict.fromkeys(parents):
                  info = parent.stat()
                  if info.st_uid not in (0, os.getuid()) or (info.st_mode & 0o022
                          and not (info.st_uid == 0 and info.st_mode & stat.S_ISVTX)):
                      unsafe.append({'path': str(parent), 'uid': info.st_uid,
                                     'mode': oct(stat.S_IMODE(info.st_mode))})
              report[role] = {'path': str(path), 'unsafe_parents': unsafe}
          report['selected_interpreter']['identity'] = update.read_file(selected, update.MAX_BINARY)[0]
          target = Path(os.environ['RUNNER_TEMP']) / 'sou164-input-parents.json'
          with target.open('x') as stream:
              os.fchmod(stream.fileno(), 0o600)
              json.dump(report, stream, sort_keys=True, indent=2)
              stream.write('\n')
          print(json.dumps(report, sort_keys=True))
          assert not report['selected_interpreter']['unsafe_parents']
          assert not report['scratch']['unsafe_parents']
          PY
      - name: Prepared operations formatting preflight
        if: github.event.inputs.prepared_operations_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          if ! cargo fmt --all -- --check; then
            cargo fmt --all
            git diff --binary > "$RUNNER_TEMP/prepared-operations-format.patch"
            git restore crates/agentfw/src/lib.rs crates/agentfw/src/main.rs crates/agentfw/src/pilot_observation.rs
            exit 1
          fi
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_run_operations.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_audit.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_ci_components.py -v
      - name: Retain formatting diagnosis
        if: failure() && github.event.inputs.prepared_operations_only == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prepared-operations-format-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-operations-format.patch
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate optional native Ask comparison
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.ask_latency_baseline_sha != ''
        shell: bash
        env:
          ASK_BASELINE_SHA: ${{ github.event.inputs.ask_latency_baseline_sha }}
          NATIVE_ONLY: ${{ github.event.inputs.native_preparation_only }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_ONLY" == true ]]
          [[ "$ASK_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ASK_BASELINE_SHA" == 8c275fcc9abdee99d4997cd4a985e6ce14d751e6 ]]
      - name: Verify capacity controls
        shell: bash
        env:
          DISPATCH_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os
          if os.environ['PILOT_CAPACITY_ONLY'] == '1':
              inputs = json.loads(os.environ['DISPATCH_INPUTS'])
              allowed = {'capacity_only', 'stability_mode'}
              assert inputs.get('stability_mode', 'off') == 'off'
              assert all(value in ('', 'false') for key, value in inputs.items() if key not in allowed)
          PY
          mkdir -m 700 "$RUNNER_TEMP/sou151-capacity"
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_capacity.py -v \
            > "$RUNNER_TEMP/sou151-capacity/controls.log" 2>&1
          if [[ "$PILOT_CAPACITY_ONLY" == 1 ]]; then
            sudo "$(command -v python3)" -B scripts/test-pilot-capacity.py \
              --private-mount --standard-uid "$(id -u)" \
              > "$RUNNER_TEMP/sou151-capacity/fixture.json"
          fi
      - name: Validate optional native Ask series plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.ask_series != ''
        shell: bash
        env:
          ASK_SERIES: ${{ github.event.inputs.ask_series }}
          ASK_BASELINE_SHA: ${{ github.event.inputs.ask_latency_baseline_sha }}
          NATIVE_ONLY: ${{ github.event.inputs.native_preparation_only }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_ONLY" == true && -z "$ASK_BASELINE_SHA" ]]
          [[ "$ASK_SERIES" =~ ^cold(,(cold|warm)){0,5}$ ]]
      - name: Attest compiler and interpreter inputs for the native lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/sou122-toolchain"
          status=0
          python3 -B scripts/verify-pilot-toolchain.py --lane native \
            --python "$(command -v python3)" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou122-toolchain/native-attestation.json" || status=$?
          cat "$RUNNER_TEMP/sou122-toolchain/native-attestation.json"
          exit "$status"
      - name: Focused preparation boundaries
        env:
          PILOT_CLEANUP_PRIVILEGED_FIXTURE: '1'
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_prepare_installed_pilot.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_existing_pilot_workspaces.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_measurement.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_installed_pilot.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_run.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_validation.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_demo.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_switch_prepared_pilot.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_ci_bwrap_userns.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_prepare_native_pilot_prerequisites.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_resumable_download.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_preparation_coordination.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_cleanup.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_build_native_pilot_inputs.py -v
      - name: Qualify exact pinned public bubblewrap transfer and offline reuse
        if: github.event.inputs.capacity_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/qualify-pilot-resumable-download.py --run \
            --report "$RUNNER_TEMP/sou173-download.json"
      - name: Verify disposable runner administration boundary before building
        env:
          SOUP_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -B scripts/ci_bwrap_userns.py check
      - name: Build accepted selected runtimes without global installation
        env:
          SOUP_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PILOT_CONCURRENT_PREPARATION: ${{ github.event.inputs.preparation_concurrency }}
          NATIVE_ONLY: ${{ github.event.inputs.native_preparation_only }}
          STAGE_REUSE_ONLY: ${{ github.event.inputs.stage_reuse_only }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          if [[ "$PILOT_CONCURRENT_PREPARATION" == true && "$NATIVE_ONLY" != true ]]; then
            echo 'Concurrent preparation requires the focused native-only dispatch' >&2
            exit 1
          fi
          await_preparation_owner() {
            python3 -B - "$1" "$2" "$3" <<'PY'
          import fcntl, json, os, sys, time
          from pathlib import Path
          lock = Path(sys.argv[1]) / '.pilot-input-preparation.lock'
          owner = Path('/proc') / sys.argv[2] / 'stat'
          record = Path(sys.argv[3])
          deadline = time.monotonic() + 45
          while time.monotonic() < deadline:
              try:
                  fd = os.open(lock, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              except FileNotFoundError:
                  pass
              else:
                  try:
                      try:
                          fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                      except BlockingIOError:
                          raise SystemExit(0)
                  finally:
                      os.close(fd)
              try:
                  exited = owner.read_text().split()[2] == 'Z'
              except OSError:
                  exited = True
              if exited:
                  try:
                      row = json.loads(record.read_bytes()[:1024])
                      detail = ':'.join(str(row.get(key, 'unknown'))[:300]
                                        for key in ('status', 'stage', 'reason'))
                  except (OSError, ValueError, TypeError):
                      detail = 'bounded_result_unavailable'
                  raise SystemExit('owner_exited_before_lock: ' + detail)
              time.sleep(.05)
          raise SystemExit('owned preparation lock was not observed within 45 seconds')
          PY
          }
          mkdir -m 700 "$RUNNER_TEMP/sou111-assets"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/sou111-assets/node.tar.xz"
          printf '%s  %s\n' 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37 \
            "$RUNNER_TEMP/sou111-assets/node.tar.xz" | sha256sum --check
          curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.51.2.tar.xz \
            --output "$RUNNER_TEMP/sou111-assets/git.tar.xz"
          printf '%s  %s\n' 233d7143a2d58e60755eee9b76f559ec73ea2b3c297f5b503162ace95966b4e3 \
            "$RUNNER_TEMP/sou111-assets/git.tar.xz" | sha256sum --check
          mkdir -m 700 "$RUNNER_TEMP/sou111-assets/libcap"
          if [[ "$PILOT_COORDINATED_UPDATE_ONLY" == 1 ]]; then
            curl --fail --location --retry 3 \
              https://archive.ubuntu.com/ubuntu/pool/main/libc/libcap2/libcap-dev_2.66-5ubuntu2.4_amd64.deb \
              --output "$RUNNER_TEMP/sou111-assets/libcap-dev_2.66-5ubuntu2.4_amd64.deb"
            printf '%s  %s\n' 07f2462867569a2119a2ad0f1593232663f2d1612b791c230d22a8d73a15abee \
              "$RUNNER_TEMP/sou111-assets/libcap-dev_2.66-5ubuntu2.4_amd64.deb" | sha256sum --check
          else
            (cd "$RUNNER_TEMP/sou111-assets" && apt-get download libcap-dev)
          fi
          dpkg-deb -x "$RUNNER_TEMP"/sou111-assets/libcap-dev_*.deb "$RUNNER_TEMP/sou111-assets/libcap"
          caplib="$RUNNER_TEMP/sou111-assets/libcap/usr/lib/x86_64-linux-gnu"
          cp /lib/x86_64-linux-gnu/libcap.so.2 "$caplib/"
          ln -sf libcap.so.2 "$caplib/libcap.so"
          ln -s "$caplib" "$RUNNER_TEMP/sou111-assets/libcap/usr/lib64"
          if [[ "$PILOT_COORDINATED_UPDATE_ONLY" == 1 ]]; then
            mkdir -m 700 "$RUNNER_TEMP/sou111-assets/meson-input"
            python3 -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
              --dest "$RUNNER_TEMP/sou111-assets/meson-input" meson==1.9.1
            printf '%s  %s\n' f824ab770c041a202f532f69e114c971918ed2daff7ea56583d80642564598d0 \
              "$RUNNER_TEMP/sou111-assets/meson-input/meson-1.9.1-py3-none-any.whl" | sha256sum --check
            python3 -m pip install --disable-pip-version-check --no-deps --no-index \
              --target "$RUNNER_TEMP/sou111-assets/build-tools" \
              "$RUNNER_TEMP/sou111-assets/meson-input/meson-1.9.1-py3-none-any.whl"
          else
            python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/sou111-assets/build-tools" \
              meson==1.9.1
          fi
          export PATH="$RUNNER_TEMP/sou111-assets/build-tools/bin:$PATH"
          native_args=(--output "$RUNNER_TEMP/sou111-native-prerequisites"
            --expected-commit "$(git rev-parse HEAD)"
            --git-archive "$RUNNER_TEMP/sou111-assets/git.tar.xz"
            --allow-download
            --pkg-config-libdir "$caplib/pkgconfig"
            --pkg-config-sysroot "$RUNNER_TEMP/sou111-assets/libcap"
            --meson-pythonpath "$RUNNER_TEMP/sou111-assets/build-tools")
          capacity_native=()
          if [[ "$PILOT_CAPACITY_ONLY" == 1 ]]; then
            capacity_native=(--guard-capacity --capacity-build-bytes 2147483648)
            python3 -B scripts/prepare-native-pilot-prerequisites.py --capacity-plan \
              --capacity-build-bytes 2147483648 "${native_args[@]}" > "$RUNNER_TEMP/sou111-assets/capacity-native.json"
          fi
          if ! python3 -B scripts/prepare-native-pilot-prerequisites.py \
            "${native_args[@]}" > "$RUNNER_TEMP/sou111-assets/native-plan.json"; then
            cp "$RUNNER_TEMP/sou111-assets/native-plan.json" \
              "$RUNNER_TEMP/sou111-assets/native-diagnostic.json"
            cat "$RUNNER_TEMP/sou111-assets/native-diagnostic.json"
            exit 1
          fi
          cat "$RUNNER_TEMP/sou111-assets/native-plan.json"
          start="$(date +%s)"
          if [[ "$PILOT_CONCURRENT_PREPARATION" == true ]]; then
            python3 -B scripts/prepare-native-pilot-prerequisites.py --prepare \
              "${capacity_native[@]}" "${native_args[@]}" > "$RUNNER_TEMP/sou111-assets/native-first.json" &
            native_owner=$!
            await_preparation_owner "$RUNNER_TEMP/sou111-native-prerequisites" \
              "$native_owner" "$RUNNER_TEMP/sou111-assets/native-first.json"
            python3 -B scripts/prepare-native-pilot-prerequisites.py --prepare \
              --wait-seconds 2700 "${capacity_native[@]}" "${native_args[@]}" \
              > "$RUNNER_TEMP/sou111-assets/native-reused.json" &
            native_waiter=$!
            if ! wait "$native_owner"; then
              kill "$native_waiter" 2>/dev/null || true
              wait "$native_waiter" 2>/dev/null || true
              cat "$RUNNER_TEMP/sou111-assets/native-first.json"
              exit 1
            fi
            finish="$(date +%s)"
            if ! wait "$native_waiter"; then
              cp "$RUNNER_TEMP/sou111-assets/native-reused.json" \
                "$RUNNER_TEMP/sou111-assets/native-diagnostic.json"
              cat "$RUNNER_TEMP/sou111-assets/native-diagnostic.json"
              exit 1
            fi
          elif [[ "$STAGE_REUSE_ONLY" == true ]]; then
            # Exercise one real pinned Git build, then interrupt only after its
            # fully verified checkpoint is atomically published and bubblewrap
            # has entered an owned build. Never select the interrupted output.
            sou180_first_start="$(date +%s%N)"
            python3 -B scripts/prepare-native-pilot-prerequisites.py --prepare \
              "${capacity_native[@]}" "${native_args[@]}" \
              > "$RUNNER_TEMP/sou111-assets/sou180-interrupted.json" &
            native_owner=$!
            if ! python3 -B - "$RUNNER_TEMP/sou111-native-prerequisites" "$native_owner" \
              "$RUNNER_TEMP/sou111-assets/sou180-watch.json" <<'PY'
          import hashlib, json, os, re, signal, stat, sys, time
          from pathlib import Path
          root, owner, record = Path(sys.argv[1]), int(sys.argv[2]), Path(sys.argv[3])
          marker = root / 'git-stage-current.json'
          deadline = time.monotonic() + 720
          while time.monotonic() < deadline:
              try:
                  state = (Path('/proc') / str(owner) / 'stat').read_text().rsplit(') ', 1)[1][0]
              except (OSError, IndexError):
                  raise SystemExit('preparation_exited_before_git_checkpoint')
              if state in ('Z', 'X'):
                  raise SystemExit('preparation_exited_before_git_checkpoint')
              try:
                  fd = os.open(marker, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              except FileNotFoundError:
                  time.sleep(.02)
                  continue
              try:
                  info = os.fstat(fd)
                  if not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) != 0o600 or info.st_size > 4096:
                      raise SystemExit('git_checkpoint_marker_unsafe')
                  blob = os.read(fd, 4097)
                  row = json.loads(blob)
                  if (row.get('format') != 'sw-native-pilot-git-stage-current/1'
                          or not re.fullmatch(r'[0-9a-f]{32}', row.get('stage', ''))
                          or not re.fullmatch(r'[0-9a-f]{64}', row.get('receipt_sha256', ''))):
                      raise SystemExit('git_checkpoint_marker_invalid')
              finally:
                  os.close(fd)
              while time.monotonic() < deadline:
                  try:
                      os.kill(owner, 0)
                  except ProcessLookupError:
                      raise SystemExit('preparation_exited_before_controlled_interruption')
                  # Meson setup may complete between polls. Compilation is the
                  # longer owned child and has its signal handler before this
                  # private log is opened.
                  if list((root / 'generations').glob('*/bwrap-build.log')):
                      os.kill(owner, signal.SIGTERM)
                      record.write_text(json.dumps({'format': 'sw-sou180-native-watch/1',
                          'checkpoint_marker_sha256': hashlib.sha256(blob).hexdigest(),
                          'signalled_after_git_checkpoint': True}, sort_keys=True) + '\n')
                      raise SystemExit(0)
                  time.sleep(.02)
              break
          raise SystemExit('git_checkpoint_interruption_deadline')
          PY
            then
              kill -TERM "$native_owner" 2>/dev/null || true
              wait "$native_owner" 2>/dev/null || true
              echo 'Controlled post-Git interruption did not complete' >&2
              exit 1
            fi
            first_exit=0
            wait "$native_owner" || first_exit=$?
            test "$first_exit" -ne 0
            sou180_first_end="$(date +%s%N)"
            test ! -e "$RUNNER_TEMP/sou111-native-prerequisites/current.json"
            # The second invocation is traced independently. No make execve
            # may occur during explicit resume; raw trace stays runner-private.
            sou180_retry_start="$(date +%s%N)"
            strace -f -qq -e trace=execve \
              -o "$RUNNER_TEMP/sou111-assets/sou180-retry.exec" \
              python3 -B scripts/prepare-native-pilot-prerequisites.py --prepare --resume \
              "${capacity_native[@]}" "${native_args[@]}" \
              > "$RUNNER_TEMP/sou111-assets/native-first.json"
            sou180_retry_end="$(date +%s%N)"
            python3 -B - "$RUNNER_TEMP/sou111-assets" "$RUNNER_TEMP/sou111-native-prerequisites" \
              "$sou180_first_start" "$sou180_first_end" \
              "$sou180_retry_start" "$sou180_retry_end" <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          asset, root = Path(sys.argv[1]), Path(sys.argv[2])
          interrupted = json.loads((asset / 'sou180-interrupted.json').read_text())
          resumed = json.loads((asset / 'native-first.json').read_text())
          watch = json.loads((asset / 'sou180-watch.json').read_text())
          assert interrupted['status'] == 'failed'
          assert interrupted['stage'] in ('bwrap_setup', 'bwrap_build')
          assert interrupted['reason'] == interrupted['stage'] + '_cancelled'
          assert interrupted['stages']['git']['status'] == 'built'
          assert interrupted['stages']['bwrap']['status'] == 'failed'
          assert resumed['status'] == 'prepared-not-qualified'
          assert resumed['stages']['git']['status'] == 'reused'
          assert resumed['stages']['bwrap']['status'] == 'built'
          assert (interrupted['stages']['git']['checkpoint_sha256'] ==
                  resumed['stages']['git']['checkpoint_sha256'])
          assert watch['signalled_after_git_checkpoint'] is True
          trace_path = asset / 'sou180-retry.exec'
          assert trace_path.stat().st_size <= 4 * 1024 * 1024, 'bounded exec trace exceeded'
          trace = trace_path.read_text()
          invoked = [os.path.basename(path) for path in re.findall(r'\bexecve\("([^"]+)"', trace)]
          make_count = sum(name == 'make' for name in invoked)
          assert make_count == 0, 'Git make executed during checkpoint reuse'
          assert (root / 'current.json').is_file()
          retained_failure = json.loads((root / 'first-failure.json').read_text())
          assert retained_failure == interrupted
          receipt_blob = Path(resumed['receipt']).read_bytes()
          receipt = json.loads(receipt_blob)
          assert receipt['stages']['git']['status'] == 'reused'
          assert receipt['stages']['bwrap']['status'] == 'built'
