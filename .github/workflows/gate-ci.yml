name: Gate Validator CI

on:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest validation for a PR/ref is useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: gate-ci.yml
  validate-gate-matrix:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'validate-gate-matrix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Candidate custody and readiness publication controls
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_validate_candidate.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_publication_readiness.py -v
