name: SOU-78 Linux MCP profile lifecycle
on:
  push:
    branches: [feat/sou-78-mcp-profile-transactional-lifecycle]
  pull_request:
    paths:
      - 'crates/agentfw/**'
      - 'crates/agent/**'
      - 'scripts/verify-sou78-linux.sh'
      - '.github/workflows/mcp-profile-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sou78-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install isolated execution runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Exact-source Linux foundation checks (not whole-issue acceptance)
        run: bash scripts/verify-sou78-linux.sh
      - name: Retain exact-source Linux results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou78-linux-${{ github.sha }}
          path: ${{ runner.temp }}/sou78-linux/evidence/
          if-no-files-found: error
          retention-days: 30
