name: SOU-78 Linux MCP profile lifecycle
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sou78-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: mcp-profile-lifecycle.yml
  linux-foundation:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs), 'linux-foundation')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Exact-source Linux profile and owned-process checks
        run: bash scripts/verify-sou78-linux.sh
      - name: Retain exact-source Linux results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou78-linux-${{ github.sha }}
          path: ${{ runner.temp }}/sou78-linux/evidence/
          if-no-files-found: error
          retention-days: 30
