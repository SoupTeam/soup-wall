name: Real Git MCP profile

on:
  workflow_dispatch:
    inputs:
      sou97_candidate:
        description: Also run the SOU-97 pilot candidate classifier through the original server (opt-in)
        type: boolean
        default: false
      sou97_git_diagnostic:
        description: Diagnostic only, never acceptance - repeat the SOU-68 overlap cancellation against the unwrapped original Git server (opt-in)
        type: boolean
        default: false
      sou97_git_protected_diagnostic:
        description: Diagnostic only, never acceptance - repeat the SOU-68 protected overlap through the sandbox and native relay, default and candidate, then candidate after replay (opt-in)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcp-real-git-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: mcp-real-git.yml
  required-linux-git:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'required-linux-git')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build explicitly pinned Git and bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config zlib1g-dev
          mkdir "$RUNNER_TEMP/sou68-git-source" "$RUNNER_TEMP/sou68-bwrap-source"
          curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.51.2.tar.xz --output "$RUNNER_TEMP/sou68-git.tar.xz"
          printf '%s  %s\n' 233d7143a2d58e60755eee9b76f559ec73ea2b3c297f5b503162ace95966b4e3 "$RUNNER_TEMP/sou68-git.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou68-git.tar.xz" -C "$RUNNER_TEMP/sou68-git-source" --strip-components=1 --no-same-owner --no-same-permissions
          make -C "$RUNNER_TEMP/sou68-git-source" -j2 NO_CURL=YesPlease NO_EXPAT=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_OPENSSL=YesPlease git
          curl --fail --location --retry 3 https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz --output "$RUNNER_TEMP/sou68-bwrap.tar.xz"
          printf '%s  %s\n' 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d "$RUNNER_TEMP/sou68-bwrap.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou68-bwrap.tar.xz" -C "$RUNNER_TEMP/sou68-bwrap-source" --strip-components=1 --no-same-owner --no-same-permissions
          meson setup "$RUNNER_TEMP/sou68-bwrap-build" "$RUNNER_TEMP/sou68-bwrap-source" -Dtests=false -Dman=disabled -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/sou68-bwrap-build"
          sha256sum "$RUNNER_TEMP/sou68-git-source/git" "$RUNNER_TEMP/sou68-bwrap-build/bwrap" > "$RUNNER_TEMP/sou68-runtime-hashes.txt"
      - name: Build exact Agent and sandbox test binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p agentfw --bins
          cargo test --locked -p agentfw --lib --no-run --message-format=json > "$RUNNER_TEMP/sou68-test-build.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'sou68-test-build.jsonl').read_text().splitlines()]
          binaries = [r['executable'] for r in rows if r.get('reason') == 'compiler-artifact' and r.get('target', {}).get('name') == 'agentfw' and r.get('profile', {}).get('test') and r.get('executable')]
          assert len(binaries) == 1
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SOU68_TEST_BINARY=' + binaries[0] + '\n')
          PY
      - name: Pilot selection and policy controls
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_pilot_policy.py -v
          cargo test --locked -p soup-wall-agent --test pilot_policy
          python3 -B scripts/pilot_decision_matrix.py --output "$RUNNER_TEMP/sou98-development.json"
      - name: Git and existing filesystem regressions
        run: |
          cargo test --locked -p agentfw server_profile --lib
          cargo test --locked -p agentfw real_server --lib
          cargo test --locked -p agentfw syscall_filter --lib
          python3 -B -m unittest discover -s scripts/tests -p test_sou68_real_mcp.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_sou62_real_mcp.py -v
          python3 -B -m unittest discover -s rule_baseline -p 'test_*.py' -v
          python3 eval/eval_runner.py eval/fixtures/soup_task1_evaluation_cases_v0.4.json --classifier-path rule_baseline/git_readonly_v1 --out-dir target/sou68-core-evaluation
          python3 eval/eval_runner.py eval/fixtures/soup_task1_mixed_actions_urtisto_v0.1.json eval/fixtures/soup_task1_benign_comparison_urtisto_v0.1.json --classifier-path rule_baseline/git_readonly_v1 --out-dir target/sou68-mixed-evaluation
          cargo run --locked --release -p soup-wall-bench -- --agent crates/bench/corpora/agent_sessions.jsonl --policy profiles/mcp/git-readonly-v1/policy.yaml
      - name: Actual Git server and independent OS isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-sou68-real-mcp.py --run --agentfw "$PWD/target/debug/agentfw" \
            --git "$RUNNER_TEMP/sou68-git-source/git" --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou68-git-source/git" | cut -d' ' -f1)" \
            --bwrap "$RUNNER_TEMP/sou68-bwrap-build/bwrap" --sandbox-test-binary "$SOU68_TEST_BINARY" \
            --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/sou68-acceptance" \
            2>&1 | tee "$RUNNER_TEMP/sou68-acceptance.log"
      - name: SOU-98 same-preset original-server acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-sou68-real-mcp.py --run --pilot-preset --agentfw "$PWD/target/debug/agentfw" \
            --git "$RUNNER_TEMP/sou68-git-source/git" --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou68-git-source/git" | cut -d' ' -f1)" \
            --bwrap "$RUNNER_TEMP/sou68-bwrap-build/bwrap" --sandbox-test-binary "$SOU68_TEST_BINARY" \
            --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/sou98-git" \
            2>&1 | tee "$RUNNER_TEMP/sou98-git.log"
      - name: Required persistent onboarding of the installed Git profile
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/onboarding-profile-acceptance.py --profiles git \
            --agentfw "$PWD/target/debug/agentfw" --bwrap "$RUNNER_TEMP/sou68-bwrap-build/bwrap" \
            --git "$RUNNER_TEMP/sou68-git-source/git" --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou68-git-source/git" | cut -d' ' -f1)" \
            --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --out "$RUNNER_TEMP/profile-onboarding-git" --work-parent "$RUNNER_TEMP" \
            2>&1 | tee "$RUNNER_TEMP/sou68-profile-onboarding.log"
      - name: SOU-97 opt-in candidate classifier through the original Git server
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sou97_candidate == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA256="$(python3 -c 'import json; print(json.load(open("eval/pilot/sou97_gate_manifest_v1.json"))["candidate"]["sha256"])')"
          python3 -B scripts/verify-sou68-real-mcp.py --run --agentfw "$PWD/target/debug/agentfw" \
            --git "$RUNNER_TEMP/sou68-git-source/git" --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou68-git-source/git" | cut -d' ' -f1)" \
            --bwrap "$RUNNER_TEMP/sou68-bwrap-build/bwrap" --sandbox-test-binary "$SOU68_TEST_BINARY" \
            --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" \
            --classifier-script "$PWD/rule_baseline/pilot_readonly_v1/rule_baseline.py" --classifier-sha256 "$CANDIDATE_SHA256" \
            --output "$RUNNER_TEMP/sou97-git-candidate" 2>&1 | tee "$RUNNER_TEMP/sou97-git-candidate.log"
      - name: SOU-97 diagnostic only (never acceptance) - original Git server cancellation overlap
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.sou97_git_diagnostic == 'true' }}
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # Required first: every diagnostic test, including the Linux-only ones, must run and pass; a skip fails.
          if ! python3 -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/diagnostic-sou97-git-tests.log"; then
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("scripts/tests", pattern="test_sou97_git_cancellation_diagnostic.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"diagnostic tests: run={result.testsRun} failures={len(result.failures)} errors={len(result.errors)} skipped={len(result.skipped)}")
          sys.exit(0 if result.wasSuccessful() and result.testsRun > 0 and not result.skipped else 1)
          PY
            echo "::error title=SOU-97 Git diagnostic tests::diagnostic tests failed or skipped; the experiment did not run"
            exit 1
          fi
          python3 -B scripts/diagnose-sou97-git-cancellation.py --run \
            --git "$RUNNER_TEMP/sou68-git-source/git" --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou68-git-source/git" | cut -d' ' -f1)" \
            --bwrap "$RUNNER_TEMP/sou68-bwrap-build/bwrap" --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" --trials 20 --max-seconds 480 \
            --output "$RUNNER_TEMP/diagnostic-sou97-git" 2>&1 | tee "$RUNNER_TEMP/diagnostic-sou97-git.log"
      - name: Retain SOU-97 diagnostic-only output (never acceptance evidence)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.sou97_git_diagnostic == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: sou97-git-cancellation-diagnostic
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/diagnostic-sou97-git-tests.log
            ${{ runner.temp }}/diagnostic-sou97-git.log
            ${{ runner.temp }}/diagnostic-sou97-git/diagnostic.json
      - name: SOU-97 diagnostic only (never acceptance) - protected Git overlap through sandbox and native relay
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.sou97_git_protected_diagnostic == 'true' }}
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          # Required first: every diagnostic test, including the Linux-only ones, must run and pass; a skip fails.
          if ! python3 -B - <<'PY' 2>&1 | tee "$RUNNER_TEMP/diagnostic-sou97-git-protected-tests.log"; then
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("scripts/tests", pattern="test_sou97_git_protected_overlap_diagnostic.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"diagnostic tests: run={result.testsRun} failures={len(result.failures)} errors={len(result.errors)} skipped={len(result.skipped)}")
          sys.exit(0 if result.wasSuccessful() and result.testsRun > 0 and not result.skipped else 1)
          PY
            echo "::error title=SOU-97 Git protected diagnostic tests::diagnostic tests failed or skipped; the experiment did not run"
            exit 1
          fi
          CANDIDATE_SHA256="$(python3 -c 'import json; print(json.load(open("eval/pilot/sou97_gate_manifest_v1.json"))["candidate"]["sha256"])')"
          python3 -B scripts/diagnose-sou97-git-protected-overlap.py --run --agentfw "$PWD/target/debug/agentfw" \
            --git "$RUNNER_TEMP/sou68-git-source/git" --git-sha256 "$(sha256sum "$RUNNER_TEMP/sou68-git-source/git" | cut -d' ' -f1)" \
            --bwrap "$RUNNER_TEMP/sou68-bwrap-build/bwrap" --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
            --expected-commit "$(git rev-parse HEAD)" \
            --classifier-script "$PWD/rule_baseline/pilot_readonly_v1/rule_baseline.py" --classifier-sha256 "$CANDIDATE_SHA256" \
            --sessions 6 --replay-iterations 2 --replay-arm auto --max-seconds 900 \
            --output "$RUNNER_TEMP/diagnostic-sou97-git-protected" 2>&1 | tee "$RUNNER_TEMP/diagnostic-sou97-git-protected.log"
      - name: Retain SOU-97 protected overlap diagnostic output (never acceptance evidence)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.sou97_git_protected_diagnostic == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: sou97-git-protected-overlap-diagnostic
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/diagnostic-sou97-git-protected-tests.log
            ${{ runner.temp }}/diagnostic-sou97-git-protected.log
            ${{ runner.temp }}/diagnostic-sou97-git-protected/diagnostic.json
      - name: Retain exact-source synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou68-real-git-mcp-evidence
          path: |
            ${{ runner.temp }}/sou98-git/**
            ${{ runner.temp }}/sou98-git.log
            ${{ runner.temp }}/sou98-development.json
            ${{ runner.temp }}/sou68-*.txt
            ${{ runner.temp }}/sou68-*.jsonl
            ${{ runner.temp }}/sou68-*.log
            ${{ runner.temp }}/sou68-acceptance/*.json
            ${{ runner.temp }}/sou68-acceptance/*.log
            ${{ runner.temp }}/profile-onboarding-git/*.json
            ${{ runner.temp }}/sou97-*.log
            ${{ runner.temp }}/sou97-git-candidate/*.json
            ${{ runner.temp }}/sou97-git-candidate/*.jsonl
            ${{ runner.temp }}/sou97-git-candidate/*.log
          if-no-files-found: error
          retention-days: 30
