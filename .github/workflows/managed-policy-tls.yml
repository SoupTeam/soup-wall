name: SOU-43 verified remote HTTPS Agent rollout

on:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest validation for a PR/ref is useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: managed-policy-tls.yml
  agent-https-rollout:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'agent-https-rollout')
    name: Real Agent verified HTTPS rollout and rollback
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Prepare accepted original MCP runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config zlib1g-dev
          mkdir "$RUNNER_TEMP/sou82-node" "$RUNNER_TEMP/sou82-git" "$RUNNER_TEMP/sou82-bwrap"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz --output "$RUNNER_TEMP/sou82-node.tar.xz"
          printf '%s  %s\n' 1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce "$RUNNER_TEMP/sou82-node.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou82-node.tar.xz" -C "$RUNNER_TEMP/sou82-node" --strip-components=1 --no-same-owner --no-same-permissions
          curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.51.3.tar.xz --output "$RUNNER_TEMP/sou82-git.tar.xz"
          printf '%s  %s\n' 8e6ff1adf702c26e75de1846498d00575ff7e9919305b38b4e27c5514062b13d "$RUNNER_TEMP/sou82-git.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou82-git.tar.xz" -C "$RUNNER_TEMP/sou82-git" --strip-components=1 --no-same-owner --no-same-permissions
          make -C "$RUNNER_TEMP/sou82-git" -j2 NO_CURL=YesPlease NO_EXPAT=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_OPENSSL=YesPlease git
          curl --fail --location --retry 3 https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz --output "$RUNNER_TEMP/sou82-bwrap.tar.xz"
          printf '%s  %s\n' 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d "$RUNNER_TEMP/sou82-bwrap.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/sou82-bwrap.tar.xz" -C "$RUNNER_TEMP/sou82-bwrap" --strip-components=1 --no-same-owner --no-same-permissions
          meson setup "$RUNNER_TEMP/sou82-bwrap-build" "$RUNNER_TEMP/sou82-bwrap" -Dtests=false -Dman=disabled -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/sou82-bwrap-build"
          python3 -m pip install cryptography==50.0.2
      - name: Verify test fixture syntax
        run: |
          python3 -m py_compile scripts/managed-policy-tls-demo.py scripts/managed-native-transitions.py scripts/fixtures/managed_policy_tls_edge.py
          python3 -B -m unittest scripts.tests.test_managed_policy_tls_edge -v
      - name: Build real SQLite Console and Agent
        run: cargo build --locked -p llm-firewall -p agentfw --bins
      - name: Execute isolated nonloopback HTTPS Agent exchange
        run: python3 scripts/managed-policy-tls-demo.py --no-build
      - name: Verify active original MCP sessions on SQLite and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for backend in sqlite postgres; do
            python3 -B scripts/managed-native-transitions.py --backend "$backend" \
              --agentfw "$PWD/target/debug/agentfw" --console "$PWD/target/debug/llm-firewall" \
              --node "$RUNNER_TEMP/sou82-node/bin/node" --npm "$RUNNER_TEMP/sou82-node/bin/npm" \
              --git "$RUNNER_TEMP/sou82-git/git" --git-launcher "$PWD/target/debug/agentfw-git-sandbox" \
              --bwrap "$RUNNER_TEMP/sou82-bwrap-build/bwrap" --expected-commit "$(git rev-parse HEAD)" \
              --output "$RUNNER_TEMP/sou82-$backend"
          done
      - name: Retain managed native transition witnesses including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sou82-managed-native-transitions
          path: |
            ${{ runner.temp }}/sou82-sqlite/*.json
            ${{ runner.temp }}/sou82-sqlite/*.log
            ${{ runner.temp }}/sou82-postgres/*.json
            ${{ runner.temp }}/sou82-postgres/*.log
          if-no-files-found: warn
      - name: Retain sanitized owned-network HTTPS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sou43-remote-https-agent-evidence
          path: target/sou43-managed-policy-tls-evidence.json
          if-no-files-found: warn
