name: Agent fleet projection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: agent-fleet.yml
  fleet:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'fleet')
    name: Fleet API and real dual-store browser witness
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Retain formatting diagnostics without changing tested source
        run: |
          mkdir -p target/fleet-evidence
          cargo fmt --all
          git diff --binary > target/fleet-evidence/format.patch
          git restore .
          git rev-parse HEAD > target/fleet-evidence/source.txt
      - name: Fleet storage and authorization regressions
        run: cargo test --locked -p llm-firewall --test fleet_projection
      - name: Build real Console and Agent
        run: cargo build --locked -p llm-firewall -p agentfw
      - name: Prepare isolated browser driver
        run: |
          python3 -m venv "$RUNNER_TEMP/fleet-driver"
          "$RUNNER_TEMP/fleet-driver/bin/python" -m pip install playwright==1.55.0 cryptography==50.0.2
          "$RUNNER_TEMP/fleet-driver/bin/python" -m playwright install --with-deps chromium
      - name: SQLite real processes and browser
        run: '"$RUNNER_TEMP/fleet-driver/bin/python" scripts/fleet-console-acceptance.py --backend sqlite --output target/fleet-evidence/sqlite'
      - name: PostgreSQL TLS real processes and browser
        run: '"$RUNNER_TEMP/fleet-driver/bin/python" scripts/fleet-console-acceptance.py --backend postgres --output target/fleet-evidence/postgres'
      - name: Managed Agent rollout panel browser regressions
        run: '"$RUNNER_TEMP/fleet-driver/bin/python" -B -m unittest scripts/tests/test_console_rollout_browser.py -v'
      - name: Agent enrollment panel browser regressions
        run: '"$RUNNER_TEMP/fleet-driver/bin/python" -B -m unittest scripts/tests/test_console_enrollment_browser.py -v'
      - name: Browser enrollment and credential lifecycle with a real Agent over HTTPS
        shell: bash
        run: |
          set +e
          status=0
          for backend in sqlite postgres; do
            "$RUNNER_TEMP/fleet-driver/bin/python" -B scripts/console-enrollment-acceptance.py --no-build \
              --backend "$backend" --output "$RUNNER_TEMP/enrollment" || status=1
          done
          cp -r "$RUNNER_TEMP/enrollment" target/fleet-evidence/enrollment
          exit $status
      - name: Agent history and incident snapshot browser regressions
        run: '"$RUNNER_TEMP/fleet-driver/bin/python" -B -m unittest scripts/tests/test_console_agent_history_browser.py -v'
      - name: Browser Agent history and incident snapshot with a real Agent
        shell: bash
        run: |
          set +e
          status=0
          for backend in sqlite postgres; do
            "$RUNNER_TEMP/fleet-driver/bin/python" -B scripts/console-agent-history-acceptance.py --no-build \
              --backend "$backend" --output "$RUNNER_TEMP/history" || status=1
          done
          cp -r "$RUNNER_TEMP/history" target/fleet-evidence/history
          exit $status
      - name: Browser rollout to one pilot and two real Agents over HTTPS
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/fleet-driver/bin/python" -B scripts/console-rollout-acceptance.py --no-build --output "$RUNNER_TEMP/rollout"
          status=$?
          cp -r "$RUNNER_TEMP/rollout" target/fleet-evidence/rollout
          exit $status
      - name: Require clean formatting
        run: test ! -s target/fleet-evidence/format.patch
      - name: Retain sanitized fleet evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-fleet-evidence
          path: target/fleet-evidence/
          retention-days: 30
          if-no-files-found: error
