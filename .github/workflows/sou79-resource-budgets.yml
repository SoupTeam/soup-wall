name: Linux MCP aggregate resource budgets

on:
  workflow_dispatch:
    inputs:
      prepared_focus:
        description: Focused native first slice; no original-host/admission claim
        type: choice
        options: ['off', '142', '143']
        default: 'off'

permissions:
  contents: read

concurrency:
  group: sou79-resource-budgets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: sou79-resource-budgets.yml
  required-disposable-delegated-linux:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'required-disposable-delegated-linux')
    # This job explicitly prepares ONE disposable, owned delegated service.
    # Other hosted checks retain their existing permissions and prerequisites.
    runs-on: ${{ github.event.inputs.prepared_focus != '' && github.event.inputs.prepared_focus != 'off' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: github.event.inputs.prepared_focus == '' || github.event.inputs.prepared_focus == 'off'
      - name: Build pinned Node and unprivileged bubblewrap prerequisites
        if: github.event.inputs.prepared_focus == '' || github.event.inputs.prepared_focus == 'off'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config
          mkdir "$RUNNER_TEMP/sou79-node" "$RUNNER_TEMP/sou79-bwrap-source"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz --output "$RUNNER_TEMP/sou79-node.tar.xz"
          printf '%s  %s\n' 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37 "$RUNNER_TEMP/sou79-node.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/sou79-node.tar.xz" --directory "$RUNNER_TEMP/sou79-node" --strip-components=1 --no-same-owner --no-same-permissions
          curl --fail --location --retry 3 https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz --output "$RUNNER_TEMP/sou79-bwrap.tar.xz"
          printf '%s  %s\n' 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d "$RUNNER_TEMP/sou79-bwrap.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/sou79-bwrap.tar.xz" --directory "$RUNNER_TEMP/sou79-bwrap-source" --strip-components=1 --no-same-owner --no-same-permissions
          meson setup "$RUNNER_TEMP/sou79-bwrap-build" "$RUNNER_TEMP/sou79-bwrap-source" -Dtests=false -Dman=disabled -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/sou79-bwrap-build"
          sha256sum "$RUNNER_TEMP/sou79-node.tar.xz" "$RUNNER_TEMP/sou79-node/bin/node" "$RUNNER_TEMP/sou79-bwrap.tar.xz" "$RUNNER_TEMP/sou79-bwrap-build/bwrap" > "$RUNNER_TEMP/sou79-runtime-hashes.txt"
      - name: Build exact candidate and require nonempty observer controls
        if: github.event.inputs.prepared_focus == '' || github.event.inputs.prepared_focus == 'off'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou79-source.txt"
          rustc --version > "$RUNNER_TEMP/sou79-rust.txt"
          python3 --version > "$RUNNER_TEMP/sou79-python.txt"
          systemd --version > "$RUNNER_TEMP/sou79-systemd.txt"
          cargo build --locked -p agentfw --bin agentfw --message-format=json > "$RUNNER_TEMP/sou79-build.jsonl"
          sha256sum target/debug/agentfw > "$RUNNER_TEMP/sou79-binary.txt"
          python3 -B - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover('scripts/tests',pattern='test_sou79_resource_budgets.py')
          if not suite.countTestCases(): raise SystemExit('required observer controls missing')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Explicitly prepare disposable delegation and run as ordinary user
        if: github.event.inputs.prepared_focus == '' || github.event.inputs.prepared_focus == 'off'
        shell: bash
        run: |
          set -euo pipefail
          unit="sou79-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # This unit alone receives delegation. No chmod/chown of cgroupfs,
          # global controller writes, sysctl changes or AppArmor relaxation.
          sudo systemd-run --quiet --wait --pipe --collect --unit="$unit" \
            --property="User=$(id -un)" --property="Group=$(id -gn)" \
            --property='Delegate=cpu memory pids' \
            --property=MemoryMax=2G --property=MemorySwapMax=0 \
            --property=TasksMax=256 --property=CPUQuota=200% \
            --property=RuntimeMaxSec=15min --property=KillMode=control-group \
            --working-directory="$GITHUB_WORKSPACE" \
            /usr/bin/env "PATH=$PATH" "TMPDIR=$RUNNER_TEMP" \
            python3 -B scripts/verify-sou79-resource-budgets.py --run \
            --agentfw "$GITHUB_WORKSPACE/target/debug/agentfw" \
            --node "$RUNNER_TEMP/sou79-node/bin/node" --npm "$RUNNER_TEMP/sou79-node/bin/npm" \
            --bwrap "$RUNNER_TEMP/sou79-bwrap-build/bwrap" \
            --expected-commit "$(git rev-parse HEAD)" --disposable-systemd-unit="$unit.service" \
            --output "$RUNNER_TEMP/sou79-acceptance"
      - name: Publish bounded sanitized kernel evidence
        if: always() && (github.event.inputs.prepared_focus == '' || github.event.inputs.prepared_focus == 'off')
        run: |
          python3 -B - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('sou79','scripts/verify-sou79-resource-budgets.py')
          driver=importlib.util.module_from_spec(spec);spec.loader.exec_module(driver)
          path=Path(os.environ['RUNNER_TEMP'])/'sou79-acceptance/report.json'
          report=json.loads(path.read_text()) if path.exists() else {'status':'incomplete','error':'required_report_missing','passed':0,'failed':1,'skipped':0}
          rendered=json.dumps(driver.summary(report),indent=2)
          print(rendered)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream: stream.write('```json\n'+rendered+'\n```\n')
          PY
      - name: Retain source identities and sanitized owned observations
        if: always() && (github.event.inputs.prepared_focus == '' || github.event.inputs.prepared_focus == 'off')
        uses: actions/upload-artifact@v7
        with:
          name: sou79-linux-resource-budget-evidence
          path: |
            ${{ runner.temp }}/sou79-*.txt
            ${{ runner.temp }}/sou79-build.jsonl
            ${{ runner.temp }}/sou79-acceptance/report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Trusted dependency download without candidate execution
        if: github.event.inputs.prepared_focus == '142' || github.event.inputs.prepared_focus == '143'
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/prepared-native-first-slice"
          mkdir -m 700 "$scratch" "$scratch/home" "$scratch/tmp" "$scratch/cargo-home"
          commit="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"
          accepted=04efdf1d959599238a0a9a3eb42cbe26b3531b74
          git merge-base --is-ancestor "$accepted" "$commit"
          python3 - "$accepted" <<'PY'
          import subprocess,sys
          from pathlib import Path
          names=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          for raw in names:
              if not raw: continue
              name=raw.decode()
              if name in ('Cargo.toml','Cargo.lock') or name.endswith('/Cargo.toml') or name.startswith('.cargo/'):
                  expected=subprocess.check_output(['git','show',sys.argv[1]+':'+name])
                  if Path(name).read_bytes()!=expected: raise SystemExit('trusted_dependency_inputs_changed')
          PY
          cargo="$(rustup which --toolchain 1.94.1 cargo)"
          env -i PATH="$(dirname "$cargo"):/usr/bin:/bin" HOME="$scratch/home" TMPDIR="$scratch/tmp" \
            CARGO_HOME="$scratch/cargo-home" RUSTUP_TOOLCHAIN=1.94.1 RUSTUP_AUTO_INSTALL=0 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            "$cargo" fetch --locked
          printf 'SOU_FOCUSED_SCRATCH=%s\nSOU_FOCUSED_CARGO=%s\nSOU_FOCUSED_COMMIT=%s\n' \
            "$scratch" "$cargo" "$commit" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$scratch/source.txt"
          "$cargo" --version > "$scratch/cargo.txt"

      - name: Native offline read-only focused controls
        if: github.event.inputs.prepared_focus == '142' || github.event.inputs.prepared_focus == '143'
        shell: bash
        env:
          SOU_FOCUS: ${{ github.event.inputs.prepared_focus }}
        run: |
          set -euo pipefail
          unit="sou79-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          properties=(--property="User=$(id -un)" --property="Group=$(id -gn)"
            --property=PrivateNetwork=yes --property=NoNewPrivileges=yes
            --property=ProtectSystem=strict
            --property="ReadOnlyPaths=$GITHUB_WORKSPACE /sys/fs/cgroup"
            --property="ReadWritePaths=$SOU_FOCUSED_SCRATCH"
            --property=RuntimeMaxSec=30min --property=KillMode=control-group)
          # Source-build steps previously had no outer MemoryMax/TasksMax/CPUQuota.
          # Do not impose or relax product limits to pass compilation. Runtime native
          # qualification later retains the accepted SOU79/SOU136 outer service caps.
          if [[ "$SOU_FOCUS" == 142 ]]; then
            properties+=(--property='Delegate=cpu memory pids'
              --property="ReadWritePaths=/sys/fs/cgroup/system.slice/$unit.service")
          fi
          status=0
          sudo systemd-run --quiet --wait --pipe --collect --unit="$unit" "${properties[@]}" \
            --working-directory="$GITHUB_WORKSPACE" \
            /usr/bin/env -i PATH=/usr/bin:/bin HOME="$SOU_FOCUSED_SCRATCH/home" TMPDIR="$SOU_FOCUSED_SCRATCH/tmp" \
            python3 -B "$GITHUB_WORKSPACE/scripts/ci/native-prepared-first-slice.py" \
            --issue "$SOU_FOCUS" --source "$GITHUB_WORKSPACE" --scratch "$SOU_FOCUSED_SCRATCH" \
            --cargo "$SOU_FOCUSED_CARGO" --expected-commit "$SOU_FOCUSED_COMMIT" --unit="$unit.service" || status=$?
          # This belongs to the trusted parent after the bounded unit has stopped.
          test ! -d "/sys/fs/cgroup/system.slice/$unit.service"
          printf '{"delegated_service_removed":true,"unit_exit_code":%s}\n' "$status" \
            > "$SOU_FOCUSED_SCRATCH/cleanup.json"
          exit "$status"

      - name: Retain first native slice including failures and incomplete checkpoints
        if: always() && (github.event.inputs.prepared_focus == '142' || github.event.inputs.prepared_focus == '143')
        uses: actions/upload-artifact@v7
        with:
          name: sou${{ github.event.inputs.prepared_focus }}-native-first-slice-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prepared-native-first-slice/native-first-slice.json
            ${{ runner.temp }}/prepared-native-first-slice/cleanup.json
            ${{ runner.temp }}/prepared-native-first-slice/source.txt
            ${{ runner.temp }}/prepared-native-first-slice/cargo.txt
            ${{ runner.temp }}/prepared-native-first-slice/compiler-diagnostics.json
          if-no-files-found: error
          retention-days: 30
