name: Managed Agent PostgreSQL rollout

on:
  pull_request:
    paths:
      - 'crates/proxy/**'
      - 'crates/agent/**'
      - 'crates/agentfw/**'
      - 'scripts/managed-policy-postgres-demo.py'
      - 'scripts/keycloak-oidc-acceptance.py'
      - 'scripts/keycloak-saml-acceptance.py'
      - '.github/workflows/managed-policy-postgres.yml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  managed-postgres:
    name: PostgreSQL migration and real Agent rollout
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the unmodified v25 migration fixture
        run: |
          git worktree add --detach "$RUNNER_TEMP/managed-previous" e6f6305de53943d8657f88ffcb5495aa60d17411
          # Keep historical artifacts separate from the current Agent API.
          CARGO_TARGET_DIR="$RUNNER_TEMP/managed-previous-target" cargo build --locked --manifest-path "$RUNNER_TEMP/managed-previous/Cargo.toml" -p llm-firewall --bin llm-firewall
          cp "$RUNNER_TEMP/managed-previous-target/debug/llm-firewall" "$RUNNER_TEMP/previous-console"
      - name: Build real Console and unchanged Agent
        run: |
          cargo build --locked -p llm-firewall -p agentfw
          cargo test --locked -p llm-firewall managed
          python3 -m venv "$RUNNER_TEMP/managed-driver"
          "$RUNNER_TEMP/managed-driver/bin/python" -m pip install cryptography==50.0.2
      - name: Run disposable PostgreSQL migration and rollout witness
        run: '"$RUNNER_TEMP/managed-driver/bin/python" scripts/managed-policy-postgres-demo.py --no-build --previous-gateway "$RUNNER_TEMP/previous-console" --output "$RUNNER_TEMP/sou42-managed-postgres-evidence.json"'
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-postgres-evidence
          path: ${{ runner.temp }}/sou42-managed-postgres-evidence.json
          if-no-files-found: warn
          retention-days: 30
