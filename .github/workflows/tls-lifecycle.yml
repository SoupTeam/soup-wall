name: TLS lifecycle

on:
  pull_request:
    paths:
      - "deploy/Caddyfile*"
      - "deploy/Dockerfile.tls"
      - "scripts/tls-lifecycle.py"
      - "scripts/fixtures/tls_*.py"
      - "scripts/tests/test_tls_lifecycle.py"
      - ".github/workflows/tls-lifecycle.yml"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: TLS rotation and recovery
        run: python3 scripts/tls-lifecycle.py --out target/tls-evidence/ci
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tls-lifecycle-linux
          path: target/tls-evidence/ci
          if-no-files-found: error
