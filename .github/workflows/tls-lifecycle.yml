name: TLS lifecycle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest validation for a PR/ref is useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: tls-lifecycle.yml
  linux:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs), 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: TLS rotation and recovery
        run: python3 scripts/tls-lifecycle.py --out target/tls-evidence/ci
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tls-lifecycle-linux
          path: target/tls-evidence/ci
          if-no-files-found: error
