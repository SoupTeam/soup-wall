name: SOU-65 focused MCP profile authoring
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: mcp-profile-author.yml
  author-cli:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'author-cli')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and emit bounded exact diagnostics
        shell: bash
        run: |
          set +e
          cargo check --locked -p agentfw --message-format=json > "$RUNNER_TEMP/mcp65-check.jsonl" 2> "$RUNNER_TEMP/mcp65-check.stderr"
          code=$?
          set -e
          python3 - "$RUNNER_TEMP/mcp65-check.jsonl" <<'PY'
          import json,sys
          count=0
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  try: event=json.loads(line)
                  except ValueError: continue
                  if event.get("reason") != "compiler-message": continue
                  message=event.get("message",{})
                  if message.get("level") not in ("error","warning"): continue
                  count+=1
                  if count>40: break
                  first=(message.get("message") or "").replace("\n"," ")[:220]
                  spans=message.get("spans") or []
                  position=next((f'{s["file_name"]}:{s["line_start"]}' for s in spans if s.get("is_primary")), "unknown")
                  print("SOU65_DIAGNOSTIC level="+message["level"]+" position="+position+" message="+first,flush=True)
          print("SOU65_DIAGNOSTIC_COUNT",count,flush=True)
          PY
          exit "$code"
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Focused library tests
        run: cargo test --locked -p agentfw mcp::profile_author -- --nocapture
      - name: Build actual Agent CLI
        run: cargo build --locked -p agentfw
      - name: Real CLI proof
        run: python3 scripts/mcp-profile-authoring-demo.py --no-build
      - name: Retain sanitized exact-source SOU-65 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou65-operator-profile-proof
          path: target/sou65-profile-author-evidence.json
          if-no-files-found: warn
          retention-days: 30
