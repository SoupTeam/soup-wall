name: SOU-65 profile authoring safety

on:
  pull_request:
    paths:
      - 'crates/agentfw/src/mcp/profile_authoring.rs'
      - 'crates/agentfw/src/mcp/mod.rs'
      - 'crates/agentfw/src/main.rs'
      - 'scripts/verify-sou65-profile.py'
      - 'scripts/verify-sou65-live.py'
      - 'scripts/fixtures/sou65_profile_server.py'
      - '.github/workflows/sou65-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile, test and lint operator CLI
        run: |
          cargo test --locked -p agentfw --lib mcp::profile_authoring
          cargo clippy --locked -p agentfw --all-targets -- -D warnings
          cargo build --locked -p agentfw
      - name: Exercise import, validation, difference and no-clobber
        run: python3 scripts/verify-sou65-profile.py
      - name: Verify real Agent and MCP collector use the compiled profile
        run: python3 scripts/verify-sou65-live.py
      - name: Preserve sanitized exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sou65-real-collector
          path: target/sou65-live.json
          if-no-files-found: warn
