name: SOU-55 real Agent enrollment credential rotation

on:
  pull_request:
    paths:
      - 'crates/agentfw/**'
      - 'crates/proxy/**'
      - 'scripts/managed-credential-rotation-demo.py'
      - '.github/workflows/managed-credential-rotation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sou55-rotation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  managed-credential-rotation:
    name: Real Console + Agent credential rotation (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate owned acceptance driver
        run: python3 -m py_compile scripts/managed-credential-rotation-demo.py
      - name: Build real Console and Agent
        run: cargo build --locked -p llm-firewall -p agentfw
      - name: Install isolated PostgreSQL fixture dependency
        if: matrix.backend == 'postgres'
        run: |
          python3 -m venv "$RUNNER_TEMP/sou55-venv"
          "$RUNNER_TEMP/sou55-venv/bin/python" -m pip install cryptography==50.0.2
      - name: Run real-process rotation, retry, revocation and policy acceptance
        env:
          SOU55_BACKEND: ${{ matrix.backend }}
        run: |
          if [ "$SOU55_BACKEND" = postgres ]; then
            "$RUNNER_TEMP/sou55-venv/bin/python" scripts/managed-credential-rotation-demo.py --backend postgres --no-build --output target/sou55-postgres.json
          else
            python3 scripts/managed-credential-rotation-demo.py --backend sqlite --no-build --output target/sou55-sqlite.json
          fi
      - name: Archive exact-source non-secret evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou55-rotation-${{ matrix.backend }}
          path: target/sou55-${{ matrix.backend }}.json
          if-no-files-found: warn
          retention-days: 30
