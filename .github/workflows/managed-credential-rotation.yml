name: SOU-55 real Agent enrollment credential rotation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sou55-rotation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: managed-credential-rotation.yml
  formatting-preview:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'formatting-preview')
    name: Rust formatting preview (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Show exact rustfmt corrections without modifying repository
        run: |
          cargo fmt --all
          git diff -U0 -- crates/agentfw/src/managed_credential.rs crates/agentfw/src/managed_sync.rs crates/proxy/src/tenant_store/agent_enrollment.rs crates/proxy/src/tenant_store/managed_async.rs crates/proxy/src/tenant_store/managed_postgres.rs crates/proxy/src/tenant_store/managed_policy.rs crates/proxy/src/managed_agent_api.rs crates/proxy/src/lib.rs crates/proxy/src/tenant_store.rs

  managed-credential-rotation:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'managed-credential-rotation')
    name: Real Console + Agent credential rotation (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate owned acceptance driver
        run: python3 -m py_compile scripts/managed-credential-rotation-demo.py
      - name: Build real Console and Agent
        run: cargo build --locked -p llm-firewall -p agentfw
      - name: Install isolated PostgreSQL fixture dependency
        if: matrix.backend == 'postgres'
        run: |
          python3 -m venv "$RUNNER_TEMP/sou55-venv"
          "$RUNNER_TEMP/sou55-venv/bin/python" -m pip install cryptography==50.0.2
      - name: Run real-process rotation, retry, revocation and policy acceptance
        env:
          SOU55_BACKEND: ${{ matrix.backend }}
        run: |
          if [ "$SOU55_BACKEND" = postgres ]; then
            "$RUNNER_TEMP/sou55-venv/bin/python" scripts/managed-credential-rotation-demo.py --backend postgres --no-build --output target/sou55-postgres.json
          else
            python3 scripts/managed-credential-rotation-demo.py --backend sqlite --no-build --output target/sou55-sqlite.json
          fi
      - name: Archive exact-source non-secret evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou55-rotation-${{ matrix.backend }}
          path: target/sou55-${{ matrix.backend }}.json
          if-no-files-found: warn
          retention-days: 30
