name: Constrained MCP HTTPS POST

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-https-post-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    uses: ./.github/workflows/ci-impact-plan.yml
    with:
      workflow: mcp-https-post.yml
  linux-https-post:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs || '[]'), 'linux-https-post')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and identify the exact candidate
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/sou73-source.txt"
          rustc --version > "$RUNNER_TEMP/sou73-rust.txt"
          openssl version > "$RUNNER_TEMP/sou73-openssl.txt"
          cargo build --locked -p agentfw --bin agentfw --message-format=json > "$RUNNER_TEMP/sou73-build.jsonl"
          sha256sum target/debug/agentfw > "$RUNNER_TEMP/sou73-binary.txt"
      - name: Native executor, authority and compatibility regressions
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p agentfw --lib -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou73-native-unit.log"
          cargo test --locked -p agentfw --test native_endpoint -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sou73-native-router.log"
          cargo clippy --locked -p agentfw --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/sou73-clippy.log"
      - name: Require nonempty passing native evidence
        run: |
          python3 - <<'PYCODE'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('sou54_helpers', 'scripts/verify-sou54-create-file.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          for name in ('unit', 'router'):
              value = Path(os.environ['RUNNER_TEMP'], 'sou73-native-' + name + '.log').read_text()
              assert probe.native_test_passed({'exit_code': 0, 'stdout': value}), name + ': no verified passed native tests'
          PYCODE
      - name: Evidence grading controls and actual owned TLS fixture
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_sou73_https_post.py' -v
      - name: Real enforcing daemon, original stdio calls and independent HTTPS ledgers
        shell: bash
        run: |
          set -o pipefail
          python3 -B scripts/verify-sou73-https-post.py --run --repo "$PWD" \
            --agentfw "$PWD/target/debug/agentfw" --expected-commit "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/sou73-https-post-results.json" 2>&1 | tee "$RUNNER_TEMP/sou73-driver.log"
      - name: Retain sanitized outcomes and exact source/build identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sou73-https-post-evidence
          path: |
            ${{ runner.temp }}/sou73-*.json
            ${{ runner.temp }}/sou73-*.jsonl
            ${{ runner.temp }}/sou73-*.txt
            ${{ runner.temp }}/sou73-*.log
          if-no-files-found: warn
          retention-days: 30
